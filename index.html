<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Reckoning Books by SKm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F7F5;
    --surface:#FFFFFF;
    --surface-strong:#EEF3EF;
    --field:#FFFFFF;
    --border:#E1E7E3;
    --border-strong:#C7D2CB;
    --ink:#1B2420;
    --ink-soft:#5C6B62;
    --ink-faint:#8B978F;
    --accent1:#2CA01C;
    --accent2:#1E7A12;
    --accent-grad:#2CA01C;
    --credit:#2CA01C;
    --credit-bg:rgba(44,160,28,0.11);
    --debit:#D64545;
    --debit-bg:rgba(214,69,69,0.10);
    --gold:#F2994A;
    --radius:10px;
    --radius-sm:7px;
    --radius-btn:6px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;color:var(--ink);
    font-family:'Inter',sans-serif;font-size:13.5px;-webkit-font-smoothing:antialiased;
    background:var(--bg);
  }
  .app{display:flex;flex-direction:column;min-height:100vh;}

  /* Title bar */
  .titlebar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:14px;letter-spacing:-.01em;}
  .titlebar span:first-child{color:var(--accent1);}
  .titlebar .winbtns{display:none;}

  /* Menu bar */
  .menubar{background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:4px;padding:7px 16px;font-size:12.5px;}
  .menubar span{padding:5px 10px;border-radius:var(--radius-sm);cursor:default;color:var(--ink-soft);font-weight:600;transition:all .15s;}
  .menubar span:hover{background:var(--surface-strong);color:var(--ink);}
  .menubar span.menu-danger:hover{background:var(--debit-bg);color:var(--debit);}

  /* Body shell → left sidebar nav + main content, side by side */
  .body-shell{display:flex;flex:1;min-height:0;}

  /* Tab strip → vertical sidebar nav */
  .tabstrip{display:flex;flex-direction:column;gap:3px;padding:16px 12px;background:var(--surface);border-right:1px solid var(--border);width:196px;flex-shrink:0;overflow-y:auto;}
  .navtab{font-family:inherit;font-size:12.5px;font-weight:700;padding:10px 14px;background:transparent;border:1px solid transparent;border-radius:var(--radius-sm);cursor:pointer;color:var(--ink-soft);transition:all .15s;display:flex;align-items:center;gap:10px;width:100%;text-align:left;}
  .navtab:hover:not(.active){background:var(--surface-strong);color:var(--ink);}
  .navtab.active{background:var(--accent1);color:#fff;border-color:var(--accent1);box-shadow:0 3px 10px rgba(44,160,28,0.28);}
  .navtab b{font-weight:900;text-decoration:underline;text-underline-offset:2px;}
  .tab-icon{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  .main{flex:1;min-width:0;padding:20px 24px 50px;overflow:auto;}

  /* Status bar */
  .statusbar{display:flex;justify-content:space-between;background:var(--surface);border-top:1px solid var(--border);padding:0;font-size:11px;color:var(--ink-faint);}
  .statusbar span{padding:7px 16px;}

  .masthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .masthead h1{font-family:inherit;font-weight:800;font-size:20px;margin:0;letter-spacing:-.02em;color:var(--ink);}
  .masthead .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .datebadge{font-family:inherit;font-variant-numeric:tabular-nums;font-weight:700;font-size:11.5px;color:var(--ink-soft);border:1px solid var(--border);background:var(--surface-strong);padding:5px 11px;border-radius:999px;}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:0 1px 2px rgba(20,30,25,0.04);}
  .stat[data-open-kpi]{cursor:pointer;transition:box-shadow .15s, transform .15s, border-color .15s;}
  .stat[data-open-kpi]:hover{box-shadow:0 6px 18px rgba(20,30,25,0.10);transform:translateY(-1px);border-color:var(--border-strong);}
  .stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:8px;font-weight:700;}
  .stat .val{font-family:inherit;font-variant-numeric:tabular-nums;font-size:21px;font-weight:800;letter-spacing:-.01em;color:var(--ink);}
  .stat .val.dr{color:var(--debit);}
  .stat .val.cr{color:var(--credit);}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:18px;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,25,0.05);}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);}
  .panel-head h2{font-family:inherit;font-size:14px;font-weight:800;margin:0;letter-spacing:-.01em;color:var(--ink);}
  .panel-body{padding:16px 18px;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface-strong);}
  td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--ink);}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#FAFBFA;}
  .num{font-family:inherit;font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap;}
  .num.dr{color:var(--debit);}
  .num.cr{color:var(--credit);}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10.5px;font-family:inherit;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.02em;}
  .pill.dr{background:var(--debit-bg);color:var(--debit);}
  .pill.cr{background:var(--credit-bg);color:var(--credit);}
  .muted{color:var(--ink-faint);}
  .empty{padding:28px;text-align:center;color:var(--ink-faint);font-size:12.5px;}

  button{font-family:'Inter',sans-serif;cursor:pointer;}
  .btn{background:var(--accent1);color:#fff;border:1px solid var(--accent1);padding:9px 18px;border-radius:var(--radius-btn);font-size:12.5px;font-weight:700;letter-spacing:-.005em;box-shadow:0 1px 2px rgba(44,160,28,0.25);transition:background .12s, box-shadow .12s;}
  .btn:hover:not(:disabled){background:var(--accent2);border-color:var(--accent2);}
  .btn:active:not(:disabled){background:var(--accent2);}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--border-strong);box-shadow:none;}
  .btn.secondary:hover:not(:disabled){background:var(--surface-strong);}
  .btn.small{padding:6px 13px;font-size:11.5px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}

  select, input[type=text], input[type=date], input[type=number], input[type=password], input[type=email], input[type=tel], textarea{
    font-family:inherit;font-size:12.5px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--field);color:var(--ink);width:100%;transition:border-color .15s, box-shadow .15s;
  }
  textarea{resize:vertical;}
  .pw-field-wrap input{padding-right:56px;}
  select:focus, input:focus{outline:none;border-color:var(--accent1);box-shadow:0 0 0 3px rgba(44,160,28,0.16);}
  input[type=number]{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;}
  label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:6px;font-weight:700;}
  .field{margin-bottom:14px;}
  .row{display:flex;gap:12px;}
  .row > *{flex:1;}

  .vtype-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .vtype-tabs button{padding:7px 16px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:600;color:var(--ink-soft);}
  .vtype-tabs button.active{background:var(--accent1);color:#fff;border-color:var(--accent1);box-shadow:0 3px 10px rgba(44,160,28,0.28);}

  .entry-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center;}
  .entry-row .rm{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--debit);font-size:14px;padding:6px 10px;font-weight:700;}
  .entry-row .rm:hover{background:var(--debit-bg);border-color:var(--debit);}
  .totals-line{display:flex;justify-content:flex-end;gap:26px;padding-top:12px;margin-top:8px;border-top:1px solid var(--border);font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;}
  .totals-line.balanced{color:var(--credit);}
  .totals-line.unbalanced{color:var(--debit);}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#1B2420;color:#fff;box-shadow:0 12px 28px rgba(0,0,0,0.25);padding:11px 22px;border-radius:999px;font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .section-title{font-family:inherit;font-size:11.5px;font-weight:800;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 9px;}
  .section-title:first-child{margin-top:0;}

  a.linklike{color:var(--accent1);text-decoration:none;cursor:pointer;font-weight:600;}
  a.linklike:hover{text-decoration:underline;}

  .loading{padding:60px;text-align:center;color:var(--ink-soft);font-size:12px;}

  /* Calendar */
  .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .calendar-grid .dow{font-size:10px;font-weight:700;text-align:center;padding:6px 0;color:var(--ink-faint);text-transform:uppercase;}
  .calendar-day{position:relative;min-height:56px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;cursor:pointer;font-variant-numeric:tabular-nums;font-size:12px;transition:all .12s;}
  .calendar-day:hover{background:var(--surface-strong);border-color:var(--border-strong);}
  .calendar-day.empty{background:transparent;border-color:transparent;cursor:default;}
  .calendar-day.empty:hover{background:transparent;border-color:transparent;}
  .calendar-day.today{border-color:var(--accent1);box-shadow:0 0 0 1px var(--accent1);}
  .calendar-day.selected{background:var(--accent1);color:#fff;border-color:var(--accent1);}
  .calendar-day .count{position:absolute;bottom:4px;right:4px;font-size:9px;background:var(--debit);color:#fff;padding:1px 5px;border-radius:999px;}
  .calendar-day.selected .count{background:rgba(255,255,255,0.35);color:#fff;}
  .calendar-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .calendar-nav .monthlabel{font-weight:800;font-size:13.5px;letter-spacing:-.01em;color:var(--ink);}
  .calendar-nav .navbtns{display:flex;gap:6px;}

  /* Gateway — company selection */
  .gateway-shell{display:flex;align-items:flex-start;justify-content:center;gap:20px;flex-wrap:wrap;min-height:65vh;padding:40px 20px;background:var(--bg);}
  .gateway-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:380px;color:var(--ink);box-shadow:0 8px 28px rgba(20,30,25,0.08);overflow:hidden;}
  .gateway-box .gw-title{background:var(--accent1);color:#fff;font-weight:800;padding:14px 18px;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;}
  .gateway-list{list-style:none;margin:0;padding:8px;min-height:40px;}
  .gateway-list li{padding:10px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center;transition:background .12s;}
  .gateway-list li:hover{background:var(--surface-strong);}
  .gateway-list .num{display:inline-block;width:22px;color:var(--accent1);font-weight:700;}
  .gateway-empty{padding:16px 18px;font-size:12px;color:var(--ink-faint);}
  .gateway-hint{padding:10px 18px 14px;font-size:11px;color:var(--ink-faint);border-top:1px solid var(--border);margin-top:2px;}
  .gateway-form{padding:2px;}
  .gateway-form label{color:var(--ink-faint);}

  /* Company Info background — a bold "R" (Reckoning, gold) and "B" (Books, green) monogram
     sitting behind the gateway cards. */
  .rb-bg{
    position:relative;min-height:100vh;overflow:hidden;isolation:isolate;
    background:
      radial-gradient(60% 50% at 6% 0%, rgba(242,169,0,0.09) 0%, transparent 62%),
      radial-gradient(55% 55% at 100% 100%, rgba(15,157,88,0.10) 0%, transparent 62%),
      linear-gradient(180deg, #FBFDF9 0%, #F4F7F5 100%);
  }
  .rb-bg .gateway-shell{background:transparent;}
  .rb-letter{position:absolute;z-index:0;font-family:'Inter',sans-serif;font-weight:900;line-height:1;letter-spacing:-.04em;user-select:none;pointer-events:none;}
  .rb-letter-r{left:-3.5%;top:-8%;font-size:clamp(220px,34vw,560px);background:linear-gradient(135deg,#FFDE7A 0%,#F2A900 45%,#C9860A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;transform:rotate(-6deg);filter:drop-shadow(0 18px 34px rgba(201,134,10,0.28));}
  .rb-letter-b{right:-3.5%;bottom:-11%;font-size:clamp(220px,34vw,560px);background:linear-gradient(135deg,#5EE28C 0%,#1FA84C 45%,#0B7A34 100%);-webkit-background-clip:text;background-clip:text;color:transparent;transform:rotate(5deg);filter:drop-shadow(0 18px 34px rgba(11,122,52,0.24));}
  .rb-content{position:relative;z-index:5;}
  .rb-credit{text-align:center;font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--ink-faint);padding:4px 20px 22px;}
  .rb-credit strong{color:var(--accent1);font-weight:800;}
  .rb-greeting{text-align:center;padding:18px 20px 0;font-size:13.5px;color:var(--ink-soft);font-weight:600;}
  .rb-greeting strong{color:var(--accent1);font-weight:800;}

  /* Login / welcome screen */
  .login-shell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:calc(100vh - 50px);padding:40px 20px;}
  .login-footer{text-align:center;font-size:11.5px;color:var(--ink-faint);letter-spacing:.02em;}
  .login-footer strong{color:var(--accent1);font-weight:800;}
  .login-footer em{font-style:italic;opacity:.85;}
  .login-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:380px;max-width:100%;box-shadow:0 20px 50px rgba(20,30,25,0.14);padding:34px 30px 30px;text-align:center;}
  .login-logo{width:60px;height:60px;border-radius:16px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:21px;letter-spacing:-.02em;color:#fff;background:linear-gradient(135deg, #F2A900, var(--accent1));box-shadow:0 8px 20px rgba(44,160,28,0.28);}
  .login-card h1{margin:0;font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.01em;}
  .login-card .login-by{margin:2px 0 18px;font-size:11px;color:var(--ink-faint);font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
  .login-tagline{margin:0 0 20px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
  .login-card label{text-align:left;}
  .pw-field-wrap{position:relative;}
  .pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;}
  .pw-toggle:hover{color:var(--accent1);}
  .auth-error{color:var(--debit);font-size:12px;margin:12px 0 0;font-weight:600;text-align:left;}
  .auth-toggle-line{margin:14px 0 0;font-size:12px;color:var(--ink-soft);text-align:center;}
  .auth-toggle-line a{color:var(--accent1);font-weight:700;cursor:pointer;text-decoration:underline;}
  .auth-users-block{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .auth-users-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;margin:0 0 8px;text-align:center;}
  .user-pick-pill{display:inline-block;padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface-strong);color:var(--ink-soft);cursor:pointer;transition:all .15s;border:1px solid var(--border);}
  .user-pick-pill:hover{background:var(--accent1);color:#fff;border-color:var(--accent1);}
  @media (max-width:900px){
    .rb-letter-r{top:-4%;}
    .rb-letter-b{bottom:-6%;}
  }

  /* Menu dropdown (View) */
  .menu-dropdown{position:absolute;top:100%;left:0;margin-top:8px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-sm);box-shadow:0 12px 28px rgba(20,30,25,0.14);min-width:170px;z-index:60;overflow:hidden;text-align:left;}
  .menu-dropdown a{display:block;padding:9px 14px;font-size:12.5px;color:var(--ink);text-decoration:none;cursor:pointer;font-weight:600;}
  .menu-dropdown a:hover{background:var(--surface-strong);}

  /* Modal (Edit Company / Help) */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,30,25,0.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:400px;max-width:100%;box-shadow:0 24px 60px rgba(20,30,25,0.25);overflow:hidden;}
  .modal-card .panel-head{padding:14px 18px;}
  .modal-card .panel-body{padding:18px;}

  @media (max-width:760px){
    .grid{grid-template-columns:1fr 1fr;}
    .main{padding:14px;}
    .entry-row{grid-template-columns:1fr;}
    .row{flex-direction:column;}
    /* Below tablet width, drop the sidebar back to a horizontal, wrapping strip along the top —
       a vertical column of 9 items eats too much width on a phone screen. */
    .body-shell{flex-direction:column;}
    .tabstrip{flex-direction:row;flex-wrap:wrap;width:auto;gap:6px;padding:12px 14px 8px;border-right:none;border-bottom:1px solid var(--border);overflow-y:visible;}
    .navtab{width:auto;border-radius:999px;}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">Opening the books…</div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* ---------------------------------------------------------------
   STORAGE SHIM
   This app expects window.storage (get/set/delete/list), which is
   provided automatically inside Claude's artifact environment.
   When this file is downloaded and opened directly in a browser,
   window.storage doesn't exist — so we polyfill it with an
   equivalent backed by localStorage, keeping the exact same
   interface. Everything else in the app works unchanged either way.
--------------------------------------------------------------- */
(function(){
  if (typeof window.storage !== 'undefined') return; // already provided (Claude environment)
  const LS_PREFIX = 'reckoningBooksBySKm:';
  window.storage = {
    async get(key){
      try{
        const raw = localStorage.getItem(LS_PREFIX+key);
        if(raw===null) return null;
        return { key, value: raw };
      }catch(e){ return null; }
    },
    async set(key, value){
      try{
        localStorage.setItem(LS_PREFIX+key, value);
        return { key, value };
      }catch(e){ return null; }
    },
    async delete(key){
      try{
        const existed = localStorage.getItem(LS_PREFIX+key) !== null;
        localStorage.removeItem(LS_PREFIX+key);
        return { key, deleted: existed };
      }catch(e){ return null; }
    },
    async list(prefix){
      try{
        const keys = [];
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(k && k.indexOf(LS_PREFIX)===0){
            const stripped = k.slice(LS_PREFIX.length);
            if(!prefix || stripped.indexOf(prefix)===0) keys.push(stripped);
          }
        }
        return { keys };
      }catch(e){ return { keys: [] }; }
    }
  };
})();

/* ---------------------------------------------------------------
   FIREBASE — shared backend for accounts & company data
   Real accounts (Firebase Authentication) and real shared storage
   (Cloud Firestore) so a person's login and the companies/books
   they create are the same on any device, instead of being stuck
   in one browser's local storage. Firebase Auth wants an email
   address, but the app's UX is username/password — so a username
   is wrapped in a fixed, invisible synthetic domain to make a
   valid "email" Firebase can use, and the user never sees it.
--------------------------------------------------------------- */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC7_svOCApXDaB9b2HTHPqbvY7o-oTGFh4",
  authDomain: "reckoning-books.firebaseapp.com",
  projectId: "reckoning-books",
  storageBucket: "reckoning-books.firebasestorage.app",
  messagingSenderId: "800981527148",
  appId: "1:800981527148:web:acb90f7a2bad2a460c4649",
};
firebase.initializeApp(FIREBASE_CONFIG);
const fbAuth = firebase.auth();
const db = firebase.firestore();
const EMAIL_DOMAIN = '@reckoningbooks.local'; // admin's fixed synthetic email only — regular accounts now use the real email they sign up with
function usernameToEmail(username){
  return username.trim().toLowerCase() + EMAIL_DOMAIN;
}
function isValidUsername(username){

  if(code==='auth/email-already-in-use') return isSignup ? 'That email is already registered to another account.' : 'That username is already taken.';
  if(code==='auth/weak-password') return 'Password must be at least 6 characters.';
  if(code==='auth/invalid-email') return isSignup ? 'Please enter a valid email address.' : 'Username can only contain letters, numbers, dots, dashes and underscores.';
  if(code==='auth/user-not-found') return 'No account found with that username.';
  if(code==='auth/wrong-password') return 'Incorrect password.';
  if(code==='auth/invalid-credential') return isSignup ? 'Could not create that account.' : 'Incorrect username or password.';
  if(code==='auth/too-many-requests') return 'Too many attempts — please wait a moment and try again.';
  if(code==='auth/network-request-failed') return 'Could not reach the server — check your internet connection.';
  return (err && err.message) || 'Something went wrong. Please try again.';
}

// Everything the Schedule III Income Statement / Balance Sheet reports need: the current financial
// year's figures (from the FY's start through today — this app is live, not a year-end snapshot, so
// a FY "in progress" is normal) and, when there's data from before this FY started, the immediately
// preceding FY's figures as a comparative. prevPl/prevBs come back null for a company with nothing
// on the books before the current FY (a brand-new company) — callers use that to skip the
// comparative column entirely rather than show a meaningless 0 vs 0.
function currentAndPriorFYData(){
  const today = new Date().toISOString().slice(0,10);
  const currentFY = fyLabelForDate(today);
  const priorFYStartYear = parseInt(currentFY.slice(0,4),10) - 1;
  const priorFY = `${priorFYStartYear}-${String((priorFYStartYear+1)%100).padStart(2,'0')}`;
  const curBounds = fyBoundsForLabel(currentFY);
  const priorBounds = fyBoundsForLabel(priorFY);

  const pl = scheduleIIIProfitLossData(curBounds.start, today);
  const cumProfitToday = scheduleIIIProfitLossData(null, today).profitForPeriod;
  const bs = scheduleIIIBalanceSheetData(cumProfitToday, today);

  const hasPriorData = state.vouchers.some(v=>v.date < curBounds.start);
  let prevPl = null, prevBs = null;
  if(hasPriorData){
    prevPl = scheduleIIIProfitLossData(priorBounds.start, priorBounds.end);
    const cumProfitPriorEnd = scheduleIIIProfitLossData(null, priorBounds.end).profitForPeriod;
    prevBs = scheduleIIIBalanceSheetData(cumProfitPriorEnd, priorBounds.end);
  }
  const periodLabel = `${humanDate(curBounds.start)} to ${humanDate(today)}`;
  const asOfLabel = humanDate(today);
  const prevPeriodLabel = hasPriorData ? `${humanDate(priorBounds.start)} to ${humanDate(priorBounds.end)}` : '';
  const prevAsOfLabel = hasPriorData ? humanDate(priorBounds.end) : '';
  return { currentFY, priorFY, curBounds, priorBounds, pl, bs, prevPl, prevBs, hasPriorData, periodLabel, asOfLabel, prevPeriodLabel, prevAsOfLabel };
}

/* ---------------- Analytics tab (computed client-side from users/companies already in memory —
   no extra reads needed since the admin's loadAdminPanelData() already pulls every document). ---------------- */
function computeAnalytics(){
  const realUsers = users.filter(u=>u.role!=='admin' && u.role!=='support');
  const realCompanies = companies.filter(c=>c.id!==DEMO_COMPANY_ID);
  const now = Date.now();
  const dayMs = 24*60*60*1000;

  // Signups per day for the last 14 days (oldest first)
  const signupTrend = [];
  for(let i=13;i>=0;i--){
    const dayStart = now - i*dayMs;
    const key = new Date(dayStart).toISOString().slice(0,10);
    const count = realUsers.filter(u=> (u.createdAt||'').slice(0,10)===key).length;
    signupTrend.push({ label: key.slice(5), count });
  }

  // Active vs dormant companies: "active" = at least one voucher dated within the last 30 days
  let active = 0, dormant = 0;
  for(const c of realCompanies){
    const vouchers = Array.isArray(c.vouchers) ? c.vouchers : [];
    const recent = vouchers.some(v=> v.date && (now - new Date(v.date).getTime()) <= 30*dayMs);
    if(recent) active++; else dormant++;
  }

  // Voucher-type breakdown across every company (including the demo, for a fuller picture)
  const typeCounts = {};
  for(const c of companies){
    const vouchers = Array.isArray(c.vouchers) ? c.vouchers : [];
    for(const v of vouchers){ typeCounts[v.type] = (typeCounts[v.type]||0) + 1; }
  }
  const voucherTypes = Object.keys(typeCounts).map(k=>({ type:k, count:typeCounts[k] })).sort((a,b)=>b.count-a.count);

  // Most active companies by voucher count
  const topCompanies = realCompanies
    .map(c=>({ id:c.id, name:c.name, count: Array.isArray(c.vouchers) ? c.vouchers.length : 0 }))
    .sort((a,b)=>b.count-a.count)
    .slice(0,5);

  return { signupTrend, active, dormant, voucherTypes, topCompanies };
}

   bottom of this file). Firestore has no client-readable usage/quota API, so this is the practical
   stand-in for "system health": real errors real users actually hit, visible to the admin. ---------------- */
async function logClientError(message, stack){
  try{
    const id = 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    await db.collection('errorLog').doc(id).set({
      id,
      message: String(message||'').slice(0,500),
      stack: String(stack||'').slice(0,2000),
      url: location.href,
      userId: currentUser ? currentUser.id : null,
      userName: currentUser ? currentUser.name : null,
      at: new Date().toISOString(),
    });
  }catch(e){ /* best-effort — never let error logging itself throw */ }
}
async function refreshErrorLog(){
  try{
    const snap = await db.collection('errorLog').get();
    errorLog = snap.docs.map(d=>d.data()).sort((a,b)=> (b.at||'').localeCompare(a.at||'')).slice(0,100);
  }catch(err){ errorLog = []; }
}
async function exportAllDataJSON(){
  try{
    const [uSnap, cSnap] = await Promise.all([ db.collection('users').get(), db.collection('companies').get() ]);
    const payload = {
      exportedAt: new Date().toISOString(),
      users: uSnap.docs.map(d=>d.data()),
      companies: cSnap.docs.map(d=>d.data()),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `reckoning-books-export-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();

/* ---------------- Force logout (client-only approximation — see saveLedgers() etc. for the
   equivalent "read-only" pattern; there is no server-side session revocation available here, so
   instead the app polls its own profile doc every 30s while logged in, and signs itself out the
   moment an admin has set forceLogoutRequested on it). ---------------- */
let forceLogoutPollHandle = null;
async function checkForceLogoutOnce(){
  if(!currentUser || currentUser.isAdmin) return;
  try{
    const doc = await db.collection('users').doc(currentUser.id).get();
    if(doc.exists && doc.data().forceLogoutRequested){
      await db.collection('users').doc(currentUser.id).update({ forceLogoutRequested:false });
      await fbAuth.signOut();
      currentUser = null;
      stopForceLogoutPoll();
      toast("You've been signed out by an administrator.");
      screen = 'login'; authMode = 'login'; renderLogin(); pushHistory();
    }
  }catch(e){ /* best-effort */ }
}
function startForceLogoutPoll(){
  stopForceLogoutPoll();
  forceLogoutPollHandle = setInterval(checkForceLogoutOnce, 30000);
}
function stopForceLogoutPoll(){
  if(forceLogoutPollHandle){ clearInterval(forceLogoutPollHandle); forceLogoutPollHandle = null; }
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------- browser Back/Forward support ----------------
   This is a single page — there's no second page to go "back" to — so without help the browser's
   Back button just leaves it (or does nothing) instead of stepping back through the app the way a
   user expects. Every meaningful navigation (login → gateway → an open company → whichever tab
   you're on) is recorded as a history entry, so Back/Forward moves between those screens instead
   of exiting. The very first entry is marked isRoot: pressing Back once more from there would
   normally carry the browser away from this page entirely, so the popstate handler immediately
   re-plants that same entry, meaning Back can always be pressed again without ever leaving. */
function historySnapshot(){
  return {
    isRoot: false,
    screen,
    view: screen==='app' ? view : null,
    authMode: screen==='login' ? authMode : null,
    companyId: currentCompany ? currentCompany.id : null
  };
}
function pushHistory(){
  try{ history.pushState(historySnapshot(), '', location.href); }catch(e){}
}
async function restoreHistorySnapshot(snap){
  if(!snap){ pushHistory(); return; }
  if(snap.isRoot){
    // We've been pushed back to the very first screen — re-plant it so Back always has room to press again.
    try{ history.pushState(snap, '', location.href); }catch(e){}
  }
  if(snap.screen==='app' && snap.companyId){
    if(!currentCompany || currentCompany.id!==snap.companyId){
      const c = companies.find(x=>x.id===snap.companyId);
      if(!c || !canAccessCompany(c)){
        // The company this history entry pointed to isn't this login's to open (e.g. a different
        // user has since logged in) — land on the gateway instead of loading someone else's books.
        screen = 'gateway';
        modal = null;
        renderGateway();
        return;
      }
      currentCompany = c; await loadState();
    }
    screen = 'app';
    view = snap.view || 'dashboard';
    modal = null;
    render();
  } else if(snap.screen==='gateway'){
    screen = 'gateway';
    modal = null;
    renderGateway();
  } else {
    screen = 'login';
    authMode = snap.authMode || 'login';
    authError = '';
    renderLogin();
  }
}
window.addEventListener('popstate', (e)=>{ restoreHistorySnapshot(e.state); });

   Real accounts, backed by Firebase Authentication — see submitAuth() further down for where
   sign-up and login happen, including the hidden admin bypass inside its login branch

/* ---------------- persistence ---------------- */
/* Companies created by a specific login belong to that login only — Demo Company stays visible
   to everyone, and an admin can see every company (for the Services → Login - Public overview).
   loadCompanies() only ever pulls in companies this login is allowed to see (enforced again,
   independently, by the Firestore security rules), so simply checking membership in the local
   `companies` array is enough to know whether a given company is accessible. */
function canAccessCompany(c){
  if(!c) return false;
  return companies.some(x=>x.id===c.id);
}
function visibleCompanies(){
  return companies;
}
async function loadCompanies(){
  if(!currentUser){ companies = []; return; }
  try{
    if(currentUser.isAdmin){
      const snap = await db.collection('companies').get();
      companies = snap.docs.map(d=>d.data());
    }else{
      const [mineSnap, demoDoc] = await Promise.all([
        db.collection('companies').where('ownerId','==',currentUser.id).get(),
        db.collection('companies').doc(DEMO_COMPANY_ID).get()
      ]);
      const mine = mineSnap.docs.map(d=>d.data());
      companies = demoDoc.exists ? [demoDoc.data(), ...mine.filter(c=>c.id!==DEMO_COMPANY_ID)] : mine;
    }
  }catch(e){
    console.error(e);
    companies = [];
    toast('Could not load companies');
  }
}
/* Saves company metadata (name, address, GSTIN, etc.) without touching that company's stored
   ledgers/vouchers/items/stock adjustments, which live as separate fields on the same Firestore
   document and are written independently by saveLedgers()/saveVouchers()/saveItems()/
   saveStockAdjustments(). Used when a company is created and when its details are edited. */
async function saveCompanyMeta(company){
  if(adminViewOnlyCompanyId){ toast("You're viewing this company in read-only mode — changes aren't saved."); return; }
  try{ await db.collection('companies').doc(company.id).set(company, {merge:true}); }
  catch(e){ toast('Could not save company'); }
}
/* Deletes a company and all of its stored books (ledgers, vouchers, items, stock adjustments —
   all embedded on the same Firestore document, so one delete removes everything). Shared by the
   "Delete" link on the company-selection screen and the "Delete Company" menu item inside an
   open company. Returns true if the company was deleted, false if the user cancelled. */
async function deleteCompanyById(id){
  const c = companies.find(x=>x.id===id);
  if(!c) return false;
  if(adminViewOnlyCompanyId){ toast("You're viewing this company in read-only mode — nothing is deleted."); return false; }
  const ok = window.confirm(`Delete company "${c.name}" and all its ledgers and vouchers?\n\nThis cannot be undone.`);
  if(!ok) return false;
  try{ await db.collection('companies').doc(id).delete(); }
  catch(e){ toast('Could not delete company'); return false; }
  companies = companies.filter(x=>x.id!==id);
  toast('Company deleted');
  return true;
}

/* Called right after any successful login (regular or admin) — creates the shared Demo Company
   document in Firestore the first time ever anyone signs in, and reseeds its sample data if the
   built-in demo dataset has since been updated (demoVersion bump). Idempotent, so it's safe to
   call on every login. Firestore requires a signed-in user for this, which is why it can't run
   until after login rather than at page load. */
async function ensureDemoCompany(){
  try{
    const ref = db.collection('companies').doc(DEMO_COMPANY_ID);
    const doc = await ref.get();
    if(!doc.exists){
      const company = {
        id: DEMO_COMPANY_ID, name:'Demo Company (Sample Data)', fyStart:'2026-04-01',
        gstin:'29ABCDE1234F1Z5', demoVersion: DEMO_DATA_VERSION, ownerId: null,
        ledgers: demoLedgers(), vouchers: demoVouchers(), items: demoItems(), stockAdjustments: [],
      };
      await ref.set(company);
      return;
    }
    const data = doc.data();
    if(data.demoVersion !== DEMO_DATA_VERSION){
      await ref.set({ demoVersion: DEMO_DATA_VERSION, ledgers: demoLedgers(), vouchers: demoVouchers(), items: demoItems() }, {merge:true});
    }
  }catch(e){ console.error(e); /* not fatal — the app still works without a fresh demo reseed */ }
}

async function loadState(){
  const cid = currentCompany.id;
  reconcileLedgerId = null; // reset so the Reconcile tab re-picks a bank ledger belonging to this company
  reconcileDraft = { date: new Date().toISOString().slice(0,10), balance: '' };
  try{
    const doc = await db.collection('companies').doc(cid).get();
    const data = doc.exists ? doc.data() : {};
    state.ledgers = Array.isArray(data.ledgers) && data.ledgers.length ? data.ledgers : DEFAULT_LEDGERS.slice();
    state.vouchers = Array.isArray(data.vouchers) ? data.vouchers : [];
    state.items = Array.isArray(data.items) ? data.items : [];
    state.stockAdjustments = Array.isArray(data.stockAdjustments) ? data.stockAdjustments : [];
    state.bankClears = Array.isArray(data.bankClears) ? data.bankClears : [];
    state.reconciliations = Array.isArray(data.reconciliations) ? data.reconciliations : [];
    state.recurringTemplates = Array.isArray(data.recurringTemplates) ? data.recurringTemplates : [];
    state.fixedAssets = Array.isArray(data.fixedAssets) ? data.fixedAssets : [];
  }catch(e){
    console.error(e);
    state.ledgers = DEFAULT_LEDGERS.slice();
    state.vouchers = [];
    state.items = [];
    state.stockAdjustments = [];
    state.bankClears = [];
    state.reconciliations = [];
    state.recurringTemplates = [];
    state.fixedAssets = [];
    toast('Could not load company data');
  }
  // Safety net: if this is the Demo Company but its sample vouchers are missing (e.g. an
  // older/partial seed from a previous version), reseed the full demo dataset on the spot —
  // regardless of the stored demoVersion flag — so "Demo Company" never opens empty.
  if(cid === DEMO_COMPANY_ID && !state.vouchers.length){
    state.ledgers = demoLedgers();
    state.vouchers = demoVouchers();
    state.items = demoItems();
    await saveLedgers();
    await saveVouchers();
    await saveItems();
  }
  if(!state.ledgers.length) state.ledgers = DEFAULT_LEDGERS.slice();
  if(ensureCoreLedgers()) await saveLedgers();
}
function ensureCoreLedgers(){
  let changed = false;
  for(const dl of DEFAULT_LEDGERS){
    if(!state.ledgers.find(l=>l.id===dl.id)){ state.ledgers.push({...dl}); changed = true; }
  }
  return changed;
}

/* ---------------- Fixed Asset Register ---------------- */
// Depreciation for one financial year, walked forward year by year from the purchase date so the
// first (partial) year is prorated by days and WDV compounds correctly off each year's closing
// balance — nothing is stored per-year; it's always derived fresh from the asset's own fields plus
// which FYs have already been posted (asset.postedFYs), the same "derive, don't store" approach the
// rest of the ledger math uses.
function assetDepreciationForFY(asset, fyLabel){
  const cost = Number(asset.cost)||0;
  const salvage = Math.max(Number(asset.salvageValue)||0, 0);
  const life = Math.max(Number(asset.usefulLifeYears)||1, 1);
  if(cost<=0) return 0;
  const purchaseFY = fyLabelForDate(asset.purchaseDate);
  if(fyLabel < purchaseFY) return 0;
  const depreciableBase = Math.max(cost - salvage, 0);
  const slmAnnual = depreciableBase / life;
  // Standard reducing-balance rate: 1 - (salvage/cost)^(1/life). A zero salvage would force a 100%
  // rate, so floor it at 1% of cost for the rate calculation only — the actual balance still floors
  // at the real salvage value below.
  const wdvRate = 1 - Math.pow(Math.max(salvage, cost*0.01) / cost, 1 / life);

  let wdv = cost;
  let label = purchaseFY;
  let guard = 0;
  while(guard < 100){
    guard++;
    if(wdv <= salvage + 0.005){
      if(label === fyLabel) return 0;
      label = nextFYLabel(label);
      continue;
    }
    const { start: yStart, end: yEnd } = fyBoundsForLabel(label);
    const periodStart = (label===purchaseFY) ? asset.purchaseDate : yStart;
    const daysInYear = Math.round((new Date(yEnd) - new Date(yStart)) / 86400000) + 1;
    const daysUsed = Math.round((new Date(yEnd) - new Date(periodStart)) / 86400000) + 1;
    const fraction = Math.min(Math.max(daysUsed / daysInYear, 0), 1);

    let yearDep = asset.method==='WDV' ? wdv * wdvRate * fraction : slmAnnual * fraction;
    yearDep = Math.min(yearDep, Math.max(wdv - salvage, 0));
    yearDep = r2(yearDep);

    if(label === fyLabel) return yearDep;

    wdv = r2(wdv - yearDep);
    label = nextFYLabel(label);
  }
  return 0;
}
function ensureDepreciationLedger(){
  let l = state.ledgers.find(x=>x.name==='Depreciation' && x.group==='iexp');
  if(!l){ l = {id:uid('l'), name:'Depreciation', group:'iexp', opening:0}; state.ledgers.push(l); saveLedgers(); }
  return l.id;
}
async function postDepreciationForFY(assetId, fyLabel){
  const asset = state.fixedAssets.find(a=>a.id===assetId);
  if(!asset) return;
  if((asset.postedFYs||[]).includes(fyLabel)){ toast(`Depreciation for FY ${fyLabel} is already posted for this asset`); return; }
  const amt = assetDepreciationForFY(asset, fyLabel);
  if(amt<=0){ toast('Nothing to depreciate — before purchase, or already fully depreciated'); return; }
  const depLedgerId = ensureDepreciationLedger();
  const { end: fyEnd } = fyBoundsForLabel(fyLabel);
  const today = new Date().toISOString().slice(0,10);
  const date = fyEnd > today ? today : fyEnd; // never post a voucher dated in the future
  state.vouchers.push({
    id: uid('v'), date, type:'Journal',
    narration: `Depreciation (${asset.method}) — ${asset.name} — FY ${fyLabel}`,
    entries: [{ledgerId:depLedgerId, dr:amt, cr:0},{ledgerId:asset.ledgerId, dr:0, cr:amt}],
    createdAt: new Date().toISOString(),
    fromFixedAsset: asset.id,
  });
  asset.postedFYs = [...(asset.postedFYs||[]), fyLabel];
  await saveVouchers();
  await saveFixedAssets();
  toast(`Posted ₹${fmt(amt)} depreciation for ${asset.name}`);
}

/* ---------------- Party Master + AR/AP ageing ---------------- */
// FIFO matching of invoices against payments on one party ledger. A customer ledger is invoiced on
// the Dr side (Sales) and paid on the Cr side (Receipt); a supplier ledger is billed on the Cr side
// (Purchase) and paid on the Dr side (Payment). Each payment is applied to the oldest still-open
// invoice first; a payment with nothing open yet to apply against (an advance) is pooled and consumed
// by the next invoice(s) that arrive. Returns only invoices with something still outstanding.
function partyOutstandingInvoices(ledgerId){
  const l = ledgerOf(ledgerId);
  if(!l) return [];
  const isCustomer = l.partyType==='customer';
  const invoiceField = isCustomer ? 'dr' : 'cr';
  const paymentField = isCustomer ? 'cr' : 'dr';

  const txns = [];
  for(const v of state.vouchers){
    for(const e of v.entries){
      if(e.ledgerId!==ledgerId) continue;
      if(!(e.dr||e.cr)) continue;
      txns.push({ voucherId:v.id, date:v.date, type:v.type, narration:v.narration, dr:e.dr||0, cr:e.cr||0, createdAt:v.createdAt||'' });
    }
  }
  txns.sort((a,b)=> a.date===b.date ? (a.createdAt||'').localeCompare(b.createdAt||'') : (a.date<b.date?-1:1));

  const invoices = [];
  let paymentPool = 0;
  for(const t of txns){
    const invAmt = t[invoiceField];
    const payAmt = t[paymentField];
    if(invAmt>0){
      invoices.push({ voucherId:t.voucherId, date:t.date, type:t.type, narration:t.narration, amount: r2(invAmt), remaining: r2(invAmt) });
      if(paymentPool>0){
        const last = invoices[invoices.length-1];
        const applied = Math.min(paymentPool, last.remaining);
        last.remaining = r2(last.remaining - applied);
        paymentPool = r2(paymentPool - applied);
      }
    }
    if(payAmt>0){
      let remainingPayment = payAmt;
      for(const inv of invoices){
        if(remainingPayment<=0) break;
        if(inv.remaining<=0) continue;
        const applied = Math.min(inv.remaining, remainingPayment);
        inv.remaining = r2(inv.remaining - applied);
        remainingPayment = r2(remainingPayment - applied);
      }
      if(remainingPayment>0) paymentPool = r2(paymentPool + remainingPayment);
    }
  }
  return invoices.filter(inv=>inv.remaining>0.005);
}
function ageBucket(days){
  if(days<=30) return '0-30';
  if(days<=60) return '31-60';
  if(days<=90) return '61-90';
  return '90+';
}
function partyAgeing(ledgerId, asOfDate){
  const today = asOfDate || new Date().toISOString().slice(0,10);
  return partyOutstandingInvoices(ledgerId).map(inv=>{
    const days = Math.round((new Date(today) - new Date(inv.date)) / 86400000);
    return { ...inv, ageDays: days, bucket: ageBucket(days) };
  });
}
function partyAgeingSummary(ledgerId, asOfDate){
  const rows = partyAgeing(ledgerId, asOfDate);
  const buckets = {'0-30':0, '31-60':0, '61-90':0, '90+':0};
  for(const r of rows) buckets[r.bucket] = r2(buckets[r.bucket] + r.remaining);
  return { rows, buckets, total: r2(rows.reduce((s,r)=>s+r.remaining,0)) };
}

/* ---------------- balance computation ---------------- */
function ledgerBalance(ledgerId){
  const l = ledgerOf(ledgerId);
  if(!l) return 0;
  let bal = l.opening || 0;
  for(const v of state.vouchers){
    for(const e of v.entries){
      if(e.ledgerId === ledgerId){
        bal += (e.dr||0) - (e.cr||0);
      }
    }
  }
  return bal;
}
function balanceLabel(signed){
  return signed >= 0 ? 'Dr' : 'Cr';
}

/* ---------------- bank reconciliation ---------------- */
// Ledger balance as of a specific date (inclusive) — a cumulative running balance up to that day,
// ignoring anything dated after it. Passing a falsy date behaves exactly like ledgerBalance().
function ledgerBalanceAsOf(ledgerId, asOfDate){
  const l = ledgerOf(ledgerId);
  if(!l) return 0;
  let bal = l.opening || 0;
  for(const v of state.vouchers){
    if(asOfDate && v.date > asOfDate) continue;
    for(const e of v.entries){
      if(e.ledgerId === ledgerId) bal += (e.dr||0) - (e.cr||0);
    }
  }
  return bal;
}
// Net movement (dr-cr) on a ledger strictly WITHIN a date range, excluding the ledger's opening
// balance — the "flow for this period" figure a P&L line needs, as opposed to a cumulative balance.
// Falsy fromDate/toDate mean "no lower/upper bound", so calling this with neither behaves exactly
// like the cumulative ledgerBalance()/ledgerBalanceAsOf(id) — same value, by construction.
function ledgerFlowBetween(ledgerId, fromDate, toDate){
  let sum = 0;
  for(const v of state.vouchers){
    if(fromDate && v.date < fromDate) continue;
    if(toDate && v.date > toDate) continue;
    for(const e of v.entries){
      if(e.ledgerId === ledgerId) sum += (e.dr||0) - (e.cr||0);
    }
  }
  return sum;
}
// Cleared/uncleared status is tracked per (bank ledger, voucher) pair rather than on the voucher
// itself, so editing a voucher later never silently wipes out its reconciliation status.
function isBankClear(ledgerId, voucherId){
  return state.bankClears.some(c=>c.ledgerId===ledgerId && c.voucherId===voucherId);
}
function toggleBankClear(ledgerId, voucherId, clearedDate){
  const idx = state.bankClears.findIndex(c=>c.ledgerId===ledgerId && c.voucherId===voucherId);
  if(idx>-1) state.bankClears.splice(idx,1);
  else state.bankClears.push({ ledgerId, voucherId, clearedDate: clearedDate || new Date().toISOString().slice(0,10) });
  saveBankClears();
}
// One row per voucher entry that touches this bank ledger, dated on/before asOfDate, oldest first.
function bankReconcileEntries(ledgerId, asOfDate){
  const rows = [];
  for(const v of state.vouchers){
    if(asOfDate && v.date > asOfDate) continue;
    for(const e of v.entries){
      if(e.ledgerId !== ledgerId) continue;
      if(!(e.dr || e.cr)) continue;
      rows.push({
        voucherId: v.id, date: v.date, type: v.type, narration: v.narration,
        dr: e.dr||0, cr: e.cr||0,
        cleared: isBankClear(ledgerId, v.id),
      });
    }
  }
  rows.sort((a,b)=> a.date===b.date ? 0 : (a.date<b.date?-1:1));
  return rows;
}
// Standard bank-reconciliation-statement math, starting from the bank statement's balance:
//   Balance as per Bank Statement
//   + deposits/receipts recorded in the books that the bank hasn't credited yet
//   − payments/cheques recorded in the books that haven't been presented to the bank yet
//   = Balance as per Books (calculated) — this should equal the ledger's real book balance.
// Any gap between the two ("difference") is what still needs investigating — a bank charge,
// interest, or direct debit/credit that hasn't been entered in the books yet, or a mis-tick.
function bankReconciliationSummary(ledgerId, asOfDate, statementBalance){
  const bookBalance = ledgerBalanceAsOf(ledgerId, asOfDate);
  const rows = bankReconcileEntries(ledgerId, asOfDate);
  const outstandingDeposits = rows.filter(r=>!r.cleared && r.dr>0);
  const outstandingPayments = rows.filter(r=>!r.cleared && r.cr>0);
  const outstandingDrTotal = r2(outstandingDeposits.reduce((s,r)=>s+r.dr,0));
  const outstandingCrTotal = r2(outstandingPayments.reduce((s,r)=>s+r.cr,0));
  const computedBookBalance = r2((statementBalance||0) + outstandingDrTotal - outstandingCrTotal);
  const difference = r2(bookBalance - computedBookBalance);
  return { bookBalance, rows, outstandingDeposits, outstandingPayments, outstandingDrTotal, outstandingCrTotal, computedBookBalance, difference, reconciled: Math.abs(difference) < 0.005 };
}
function saveReconciliationRecord(ledgerId, asOfDate, statementBalance){
  const s = bankReconciliationSummary(ledgerId, asOfDate, statementBalance);
  state.reconciliations.push({
    id: uid('rec'), ledgerId, date: asOfDate, statementBalance,
    bookBalance: s.bookBalance, difference: s.difference,
    outstandingDepositsCount: s.outstandingDeposits.length,
    outstandingPaymentsCount: s.outstandingPayments.length,
    outstandingDrTotal: s.outstandingDrTotal, outstandingCrTotal: s.outstandingCrTotal,
    createdAt: new Date().toISOString(),
  });
  saveReconciliations();
  return s;
}

/* ---------------- recurring vouchers ---------------- */
// Adds one period to a YYYY-MM-DD date string. Monthly/yearly clamp to the shortest month involved
// (31 Jan -> 28/29 Feb) rather than overflowing into the next month — a template scheduled for the
// 31st will drift to the len of whatever month it lands on from then on, which matches how most
// billing systems (and bank standing instructions) behave for month-end dates.
function advanceDate(dateStr, frequency){
  const d = new Date(dateStr + 'T00:00:00');
  if(frequency==='weekly'){ d.setDate(d.getDate()+7); }
  else if(frequency==='yearly'){ d.setFullYear(d.getFullYear()+1); }
  else {
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth()+1);
    const daysInMonth = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day, daysInMonth));
  }
  return d.toISOString().slice(0,10);
}
function dueRecurringTemplates(asOfDate){
  return state.recurringTemplates.filter(t=>t.active && t.nextDueDate && t.nextDueDate<=asOfDate);
}
// Same single-entry-to-double-entry mapping used by the Payment/Receipt/Contra "Single Entry" voucher
// form (see the saveVoucher handler) — kept as its own function so recurring generation doesn't have
// to touch that already-tested code path.
function entriesForRecurring(type, ledgerA, ledgerB, amt){
  if(type==='Receipt') return [{ledgerId:ledgerA,dr:amt,cr:0},{ledgerId:ledgerB,dr:0,cr:amt}];
  return [{ledgerId:ledgerB,dr:amt,cr:0},{ledgerId:ledgerA,dr:0,cr:amt}]; // Payment or Contra
}
// Generates a voucher for every elapsed due date of every active template, up to today — so if the
// books haven't been opened in a while, catching up creates one voucher per missed period rather
// than just one. Returns how many vouchers were created.
function generateDueVouchers(){
  const today = new Date().toISOString().slice(0,10);
  const now = new Date().toISOString();
  let count = 0;
  for(const t of state.recurringTemplates){
    if(!t.active) continue;
    let guard = 0;
    while(t.nextDueDate && t.nextDueDate<=today && guard<60){
      const amt = Number(t.amount)||0;
      if(t.ledgerA && t.ledgerB && amt>0){
        state.vouchers.push({
          id: uid('v'), date: t.nextDueDate, type: t.type,
          narration: t.narration || t.name, entries: entriesForRecurring(t.type, t.ledgerA, t.ledgerB, amt),
          createdAt: now, fromRecurring: t.id,
        });
        count++;
      }
      t.lastGeneratedDate = t.nextDueDate;
      t.nextDueDate = advanceDate(t.nextDueDate, t.frequency);
      guard++;
    }
  }
  if(count){ saveVouchers(); }
  saveRecurringTemplates();
  return count;
}

function totalsByCategory(cat){
  return state.ledgers
    .filter(l => groupOf(l.group).cat === cat)
    .reduce((sum,l)=> sum + ledgerBalance(l.id), 0);
}

function gstOutputTotal(){ return -(ledgerBalance('l_ocgst')+ledgerBalance('l_osgst')+ledgerBalance('l_oigst')); }
function gstInputTotal(){ return ledgerBalance('l_icgst')+ledgerBalance('l_isgst')+ledgerBalance('l_iigst'); }

function r2(n){ return Number((n||0).toFixed(2)); }

/* ---------------- IFRS statement data ---------------- */
function fmtRatio(x){ return x==null ? '—' : x.toFixed(2); }
function fmtPct(x){ return x==null ? '—' : x.toFixed(1)+'%'; }
function fmtDays(x){ return x==null ? '—' : Math.round(x)+' days'; }

function incomeStatementData(){
  const revenueLedgers = state.ledgers.filter(l=>l.group==='sales');
  const revenue = revenueLedgers.reduce((s,l)=>s-ledgerBalance(l.id),0);
  const otherIncomeLedgers = state.ledgers.filter(l=>l.group==='dinc');
  const otherIncome = otherIncomeLedgers.reduce((s,l)=>s-ledgerBalance(l.id),0);
  const costOfSalesLedgers = state.ledgers.filter(l=>l.group==='purch');
  const costOfSales = costOfSalesLedgers.reduce((s,l)=>s+ledgerBalance(l.id),0);
  const grossProfit = revenue - costOfSales;

  const distributionLedgers = state.ledgers.filter(l=>l.group==='dexp');
  const distributionCosts = distributionLedgers.reduce((s,l)=>s+ledgerBalance(l.id),0);

  const allIndirect = state.ledgers.filter(l=>l.group==='iexp');
  const financeLedgers = allIndirect.filter(l=>/interest|bank charge/i.test(l.name));
  const adminLedgers = allIndirect.filter(l=>!/interest|bank charge/i.test(l.name));
  const financeCosts = financeLedgers.reduce((s,l)=>s+ledgerBalance(l.id),0);
  const adminExpenses = adminLedgers.reduce((s,l)=>s+ledgerBalance(l.id),0);

  const operatingProfit = grossProfit + otherIncome - distributionCosts - adminExpenses;
  const profitBeforeTax = operatingProfit - financeCosts;
  const taxExpense = 0; // no dedicated income-tax ledger tracked separately from GST in this system
  const profitForPeriod = profitBeforeTax - taxExpense;

  return { revenue, revenueLedgers, otherIncome, otherIncomeLedgers, costOfSales, costOfSalesLedgers, grossProfit,
    distributionLedgers, distributionCosts, adminLedgers, adminExpenses, financeLedgers, financeCosts,
    operatingProfit, profitBeforeTax, taxExpense, profitForPeriod };
}

function balanceSheetIFRSData(profit){
  const nonCurrentAssets = state.ledgers.filter(l=>l.group==='fa');
  const nonCurrentAssetsTotal = nonCurrentAssets.reduce((s,l)=>s+ledgerBalance(l.id),0);

  const currentAssets = state.ledgers.filter(l=>['cash','bank','ca'].includes(l.group));
  const currentAssetsTotal = currentAssets.reduce((s,l)=>s+ledgerBalance(l.id),0);
  const totalAssets = nonCurrentAssetsTotal + currentAssetsTotal;

  const equityLedgers = state.ledgers.filter(l=>l.group==='cap');
  const equityBase = equityLedgers.reduce((s,l)=>s-ledgerBalance(l.id),0);
  const totalEquity = equityBase + profit;

  const nonCurrentLiabilities = state.ledgers.filter(l=>l.group==='loan');
  const nonCurrentLiabTotal = nonCurrentLiabilities.reduce((s,l)=>s-ledgerBalance(l.id),0);

  const currentLiabilities = state.ledgers.filter(l=>l.group==='curl');
  const currentLiabTotal = currentLiabilities.reduce((s,l)=>s-ledgerBalance(l.id),0);

  const totalEquityAndLiab = totalEquity + nonCurrentLiabTotal + currentLiabTotal;

  return { nonCurrentAssets, nonCurrentAssetsTotal, currentAssets, currentAssetsTotal, totalAssets,
    equityLedgers, equityBase, totalEquity, nonCurrentLiabilities, nonCurrentLiabTotal,
    currentLiabilities, currentLiabTotal, totalEquityAndLiab };
}

/* ---------------- Schedule III (Division I) statement data ----------------
   Maps this app's chart-of-accounts groups onto the face-of-Balance-Sheet and
   face-of-Statement-of-Profit-and-Loss line items prescribed by Schedule III
   (Division I — companies applying the Accounting Standards (AS) Rules, 2006)
   to the Companies Act, 2013, including the items added by the 2021 amendment
   (e.g. the MSME/Others split within Trade Payables). Classification below is a
   best-effort mapping driven by account group plus ledger name / GST type — this
   app's flat chart of accounts does not itself carry Schedule III sub-heads, and
   note-level disclosures that need extra data this app doesn't track (MSME
   vendor flags, ageing schedules, share reconciliation, promoter shareholding,
   the Additional Regulatory Information block, etc.) are intentionally left out
   of the face of the statement rather than shown with fabricated figures. */
// fromDate/toDate scope this to one period (e.g. one financial year) using each line's flow WITHIN
// that range — not a cumulative balance — so Revenue/Expenses reflect just that period, the way
// Schedule III's Statement of Profit and Loss actually expects. Called with no arguments, both are
// undefined and ledgerFlowBetween falls back to "no date filter", so every existing all-time caller
// (the Q&A engine, the detail modals) is completely unaffected by this change.
function scheduleIIIProfitLossData(fromDate, toDate){
  const revenueLedgers = state.ledgers.filter(l=>l.group==='sales');
  const revenueFromOperations = revenueLedgers.reduce((s,l)=>s-ledgerFlowBetween(l.id, fromDate, toDate),0);

  const otherIncomeLedgers = state.ledgers.filter(l=>l.group==='dinc');
  const otherIncome = otherIncomeLedgers.reduce((s,l)=>s-ledgerFlowBetween(l.id, fromDate, toDate),0);

  const totalIncome = revenueFromOperations + otherIncome;

  const purchaseLedgers = state.ledgers.filter(l=>l.group==='purch');
  const purchasesOfStockInTrade = purchaseLedgers.reduce((s,l)=>s+ledgerFlowBetween(l.id, fromDate, toDate),0);

  const expenseLedgers = state.ledgers.filter(l=>l.group==='dexp' || l.group==='iexp');
  const employeeLedgers = expenseLedgers.filter(l=>/salary|wages|staff|employee|bonus|provident/i.test(l.name));
  const depreciationLedgers = expenseLedgers.filter(l=>!employeeLedgers.includes(l) && /depreciat|amorti/i.test(l.name));
  const financeCostLedgers = expenseLedgers.filter(l=>!employeeLedgers.includes(l) && !depreciationLedgers.includes(l) && /interest|bank charge|finance cost/i.test(l.name));
  const otherExpenseLedgers = expenseLedgers.filter(l=>!employeeLedgers.includes(l) && !depreciationLedgers.includes(l) && !financeCostLedgers.includes(l));

  const employeeBenefitsExpense = employeeLedgers.reduce((s,l)=>s+ledgerFlowBetween(l.id, fromDate, toDate),0);
  const depreciationExpense = depreciationLedgers.reduce((s,l)=>s+ledgerFlowBetween(l.id, fromDate, toDate),0);
  const financeCosts = financeCostLedgers.reduce((s,l)=>s+ledgerFlowBetween(l.id, fromDate, toDate),0);
  const otherExpenses = otherExpenseLedgers.reduce((s,l)=>s+ledgerFlowBetween(l.id, fromDate, toDate),0);

  const totalExpenses = purchasesOfStockInTrade + employeeBenefitsExpense + depreciationExpense + financeCosts + otherExpenses;

  const profitBeforeExceptionalAndTax = totalIncome - totalExpenses;
  const exceptionalItems = 0;
  const profitBeforeTax = profitBeforeExceptionalAndTax - exceptionalItems;
  const currentTax = 0, deferredTax = 0; // income tax not separately tracked in this system
  const taxExpense = currentTax + deferredTax;
  const profitForPeriod = profitBeforeTax - taxExpense;

  return { revenueLedgers, revenueFromOperations, otherIncomeLedgers, otherIncome, totalIncome,
    purchaseLedgers, purchasesOfStockInTrade,
    employeeLedgers, employeeBenefitsExpense,
    depreciationLedgers, depreciationExpense,
    financeCostLedgers, financeCosts,
    otherExpenseLedgers, otherExpenses,
    totalExpenses, profitBeforeExceptionalAndTax, exceptionalItems, profitBeforeTax,
    currentTax, deferredTax, taxExpense, profitForPeriod };
}
// asOfDate makes this a point-in-time snapshot as of that date instead of "right now" — pass the
// cumulative profit-to-date (scheduleIIIProfitLossData(null, asOfDate).profitForPeriod, NOT the
// current-FY-only figure) as `profit`, since Reserves & Surplus is retained earnings since inception,
// not just the current period. Called with no asOfDate, ledgerBalanceAsOf falls back to "no date
// filter" so every existing all-time caller is unaffected.
function scheduleIIIBalanceSheetData(profit, asOfDate){
  // Non-current assets — Property, Plant and Equipment
  const ppe = state.ledgers.filter(l=>l.group==='fa');
  const ppeTotal = ppe.reduce((s,l)=>s+ledgerBalanceAsOf(l.id, asOfDate),0);
  const nonCurrentAssetsTotal = ppeTotal;

  // Current assets — split the 'Current Assets' group into Inventories / Trade Receivables / Other Current Assets
  const caLedgers = state.ledgers.filter(l=>l.group==='ca');
  const otherCurrentAssetLedgers = caLedgers.filter(l=>l.gstType && l.gstType.startsWith('input'));
  const inventoryLedgers = caLedgers.filter(l=>!otherCurrentAssetLedgers.includes(l) && /stock|inventor/i.test(l.name));
  const tradeReceivableLedgers = caLedgers.filter(l=>!otherCurrentAssetLedgers.includes(l) && !inventoryLedgers.includes(l));
  const cashLedgers = state.ledgers.filter(l=>l.group==='cash' || l.group==='bank');

  const inventoriesTotal = inventoryLedgers.reduce((s,l)=>s+ledgerBalanceAsOf(l.id, asOfDate),0);
  const tradeReceivablesTotal = tradeReceivableLedgers.reduce((s,l)=>s+ledgerBalanceAsOf(l.id, asOfDate),0);
  const cashTotal = cashLedgers.reduce((s,l)=>s+ledgerBalanceAsOf(l.id, asOfDate),0);
  const otherCurrentAssetsTotal = otherCurrentAssetLedgers.reduce((s,l)=>s+ledgerBalanceAsOf(l.id, asOfDate),0);
  const currentAssetsTotal = inventoriesTotal + tradeReceivablesTotal + cashTotal + otherCurrentAssetsTotal;

  const totalAssets = nonCurrentAssetsTotal + currentAssetsTotal;

  // Shareholders' funds
  const shareCapitalLedgers = state.ledgers.filter(l=>l.group==='cap');
  const shareCapitalTotal = shareCapitalLedgers.reduce((s,l)=>s-ledgerBalanceAsOf(l.id, asOfDate),0);
  const reservesAndSurplus = profit; // Surplus i.e. balance in Statement of Profit and Loss — no separate opening reserves tracked
  const shareholdersFundsTotal = shareCapitalTotal + reservesAndSurplus;

  // Non-current liabilities — Long-term Borrowings
  const longTermBorrowings = state.ledgers.filter(l=>l.group==='loan');
  const longTermBorrowingsTotal = longTermBorrowings.reduce((s,l)=>s-ledgerBalanceAsOf(l.id, asOfDate),0);
  const nonCurrentLiabTotal = longTermBorrowingsTotal;

  // Current liabilities — split 'Current Liabilities' into Trade Payables (MSME/Others, per the 2021 amendment) / Other Current Liabilities
  const curlLedgers = state.ledgers.filter(l=>l.group==='curl');
  const tradePayableLedgers = curlLedgers.filter(l=>!(l.gstType && l.gstType.startsWith('output')) && /payable|creditor|supplier|vendor/i.test(l.name));
  const otherCurrentLiabLedgers = curlLedgers.filter(l=>!tradePayableLedgers.includes(l));
  const msmeTradePayableLedgers = tradePayableLedgers.filter(l=>l.isMSME);
  const otherTradePayableLedgers = tradePayableLedgers.filter(l=>!l.isMSME);
  const tradePayablesTotal = tradePayableLedgers.reduce((s,l)=>s-ledgerBalanceAsOf(l.id, asOfDate),0);
  const msmeTradePayablesTotal = msmeTradePayableLedgers.reduce((s,l)=>s-ledgerBalanceAsOf(l.id, asOfDate),0);
  const otherTradePayablesTotal = otherTradePayableLedgers.reduce((s,l)=>s-ledgerBalanceAsOf(l.id, asOfDate),0);
  const otherCurrentLiabTotal = otherCurrentLiabLedgers.reduce((s,l)=>s-ledgerBalanceAsOf(l.id, asOfDate),0);
  const currentLiabTotal = tradePayablesTotal + otherCurrentLiabTotal;

  const totalEquityAndLiab = shareholdersFundsTotal + nonCurrentLiabTotal + currentLiabTotal;

  return {
    ppe, ppeTotal, nonCurrentAssetsTotal,
    inventoryLedgers, inventoriesTotal,
    tradeReceivableLedgers, tradeReceivablesTotal,
    cashLedgers, cashTotal,
    otherCurrentAssetLedgers, otherCurrentAssetsTotal,
    currentAssetsTotal, totalAssets,
    shareCapitalLedgers, shareCapitalTotal, reservesAndSurplus, shareholdersFundsTotal,
    longTermBorrowings, longTermBorrowingsTotal, nonCurrentLiabTotal,
    tradePayableLedgers, tradePayablesTotal, msmeTradePayableLedgers, msmeTradePayablesTotal,
    otherTradePayableLedgers, otherTradePayablesTotal,
    otherCurrentLiabLedgers, otherCurrentLiabTotal,
    currentLiabTotal, totalEquityAndLiab,
  };
}

function ratioAnalysisData(is, bs){
  const currentAssets = bs.currentAssetsTotal;
  const currentLiab = bs.currentLiabTotal;
  const cashAndBank = state.ledgers.filter(l=>['cash','bank'].includes(l.group)).reduce((s,l)=>s+ledgerBalance(l.id),0);

  const receivableLedgers = state.ledgers.filter(l=>l.group==='ca' && !l.gstType);
  const receivables = receivableLedgers.reduce((s,l)=>s+ledgerBalance(l.id),0);
  const payableLedgers = state.ledgers.filter(l=>l.group==='curl' && !l.gstType);
  const payables = payableLedgers.reduce((s,l)=>s-ledgerBalance(l.id),0);

  const quickAssets = cashAndBank + receivables;

  const currentRatio = currentLiab ? currentAssets/currentLiab : null;
  const quickRatio = currentLiab ? quickAssets/currentLiab : null;
  const cashRatio = currentLiab ? cashAndBank/currentLiab : null;
  const workingCapital = currentAssets - currentLiab;

  const totalLiab = bs.nonCurrentLiabTotal + bs.currentLiabTotal;
  const debtToEquity = bs.totalEquity ? totalLiab/bs.totalEquity : null;
  const debtRatio = bs.totalAssets ? totalLiab/bs.totalAssets : null;
  const equityRatio = bs.totalAssets ? bs.totalEquity/bs.totalAssets : null;

  const grossMargin = is.revenue ? is.grossProfit/is.revenue*100 : null;
  const operatingMargin = is.revenue ? is.operatingProfit/is.revenue*100 : null;
  const netMargin = is.revenue ? is.profitForPeriod/is.revenue*100 : null;
  const roa = bs.totalAssets ? is.profitForPeriod/bs.totalAssets*100 : null;
  const roe = bs.totalEquity ? is.profitForPeriod/bs.totalEquity*100 : null;
  const assetTurnover = bs.totalAssets ? is.revenue/bs.totalAssets : null;

  const receivablesTurnover = receivables ? is.revenue/receivables : null;
  const dso = receivablesTurnover ? 365/receivablesTurnover : null;
  const payablesTurnover = payables ? is.costOfSales/payables : null;
  const dpo = payablesTurnover ? 365/payablesTurnover : null;

  return { currentRatio, quickRatio, cashRatio, workingCapital, debtToEquity, debtRatio, equityRatio,
    grossMargin, operatingMargin, netMargin, roa, roe, assetTurnover, receivablesTurnover, dso, payablesTurnover, dpo };
}

function cashFlowClassify(voucher){
  const others = voucher.entries.filter(e=>{
    const l = ledgerOf(e.ledgerId);
    return l && l.group!=='cash' && l.group!=='bank';
  });
  if(others.some(e=>{ const l=ledgerOf(e.ledgerId); return l && l.group==='fa'; })) return 'investing';
  if(others.some(e=>{ const l=ledgerOf(e.ledgerId); return l && (l.group==='cap'||l.group==='loan'); })) return 'financing';
  return 'operating';
}
function cashFlowData(){
  let operating=0, investing=0, financing=0;
  const detail = {operating:[], investing:[], financing:[]};
  for(const v of state.vouchers){
    if(v.type==='Contra') continue;
    for(const e of v.entries){
      const l = ledgerOf(e.ledgerId);
      if(!l || (l.group!=='cash' && l.group!=='bank')) continue;
      const net = (e.dr||0)-(e.cr||0);
      if(Math.abs(net)<0.001) continue;
      const cls = cashFlowClassify(v);
      if(cls==='investing') investing+=net;
      else if(cls==='financing') financing+=net;
      else operating+=net;
      detail[cls].push({date:v.date, type:v.type, narration:v.narration||v.type, ledger:l.name, amount:net});
    }
  }
  const openingCash = state.ledgers.filter(l=>l.group==='cash'||l.group==='bank').reduce((s,l)=>s+(l.opening||0),0);
  const netChange = operating+investing+financing;
  const closingCash = openingCash+netChange;
  const actualCash = state.ledgers.filter(l=>l.group==='cash'||l.group==='bank').reduce((s,l)=>s+ledgerBalance(l.id),0);
  return { operating, investing, financing, netChange, openingCash, closingCash, actualCash, detail };
}

/* ---------------- Inventory ---------------- */
function itemVoucherDirection(type){
  if(type==='Purchase' || type==='Credit Note') return 1;  // inward: purchase in, sales-returned goods back in
  if(type==='Sales' || type==='Debit Note') return -1;      // outward: sold out, returned-to-supplier out
  return 0;
}
function stockMovementForItem(itemId){
  const moves = [];
  const sorted = state.vouchers.slice().sort((a,b)=> a.date.localeCompare(b.date));
  for(const v of sorted){
    if(!v.items) continue;
    const dir = itemVoucherDirection(v.type);
    if(dir===0) continue;
    for(const it of v.items){
      if(it.itemId===itemId && it.qty>0){
        moves.push({date:v.date, type:v.type, narration:v.narration||v.type, qty:it.qty, dir});
      }
    }
  }
  for(const adj of state.stockAdjustments){
    if(adj.itemId===itemId){
      moves.push({date:adj.date, type:'Adjustment', narration:adj.reason||'Stock adjustment', qty:Math.abs(adj.qty), dir: adj.qty>=0?1:-1});
    }
  }
  moves.sort((a,b)=> a.date.localeCompare(b.date));
  return moves;
}
function stockSummaryForItem(item){
  const moves = stockMovementForItem(item.id);
  let qty = item.openingQty||0;
  let inward=0, outward=0;
  moves.forEach(m=>{
    if(m.dir>0){ qty+=m.qty; inward+=m.qty; }
    else { qty-=m.qty; outward+=m.qty; }
  });
  const rate = item.rate!=null ? item.rate : (item.openingRate||0);
  return { opening:item.openingQty||0, inward, outward, closing:qty, value: qty*rate };
}
function stockSummaryAll(){
  return state.items.map(it=>({ item: it, summary: stockSummaryForItem(it) }));
}

function gstBreakdownForVoucher(v){
  let ocgst=0,osgst=0,oigst=0,icgst=0,isgst=0,iigst=0;
  for(const e of v.entries){
    if(e.ledgerId==='l_ocgst') ocgst += (e.cr||0)-(e.dr||0);
    if(e.ledgerId==='l_osgst') osgst += (e.cr||0)-(e.dr||0);
    if(e.ledgerId==='l_oigst') oigst += (e.cr||0)-(e.dr||0);
    if(e.ledgerId==='l_icgst') icgst += (e.dr||0)-(e.cr||0);
    if(e.ledgerId==='l_isgst') isgst += (e.dr||0)-(e.cr||0);
    if(e.ledgerId==='l_iigst') iigst += (e.dr||0)-(e.cr||0);
  }
  const cgst = ocgst+icgst, sgst = osgst+isgst, igst = oigst+iigst;
  const totalTax = cgst+sgst+igst;
  return { cgst, sgst, igst, totalTax };
}

function buildGSTStatementWorkbook(){
  const wb = XLSX.utils.book_new();
  const netGST = gstOutputTotal() - gstInputTotal();

  // Summary sheet
  const summary = [
    ['GST Statement', currentCompany.name],
    ['Generated on', new Date().toLocaleDateString('en-IN')],
    [],
    ['Tax Head','Output (Payable)','Input (Credit)'],
    ['CGST', r2(-ledgerBalance('l_ocgst')), r2(ledgerBalance('l_icgst'))],
    ['SGST', r2(-ledgerBalance('l_osgst')), r2(ledgerBalance('l_isgst'))],
    ['IGST', r2(-ledgerBalance('l_oigst')), r2(ledgerBalance('l_iigst'))],
    ['Total', r2(gstOutputTotal()), r2(gstInputTotal())],
    [],
    ['Net GST', netGST>=0?'Payable':'Refundable / Carried Forward', r2(Math.abs(netGST))],
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), 'Summary');

  // Outward supplies (Sales)
  const outward = [['Date','Voucher','Narration','Taxable Value','CGST','SGST','IGST','Total Tax','Invoice Value']];
  let outTotals = {taxable:0,cgst:0,sgst:0,igst:0,tax:0,invoice:0};
  state.vouchers.filter(v=>v.type==='Sales').forEach(v=>{
    const g = gstBreakdownForVoucher(v);
    if(g.totalTax<=0) return;
    const invoice = voucherAmount(v);
    const taxable = invoice - g.totalTax;
    outward.push([v.date, v.type, v.narration||'', r2(taxable), r2(g.cgst), r2(g.sgst), r2(g.igst), r2(g.totalTax), r2(invoice)]);
    outTotals.taxable+=taxable; outTotals.cgst+=g.cgst; outTotals.sgst+=g.sgst; outTotals.igst+=g.igst; outTotals.tax+=g.totalTax; outTotals.invoice+=invoice;
  });
  if(outward.length>1) outward.push(['Total','','', r2(outTotals.taxable), r2(outTotals.cgst), r2(outTotals.sgst), r2(outTotals.igst), r2(outTotals.tax), r2(outTotals.invoice)]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(outward), 'Outward Supplies (Sales)');

  // Inward supplies (Purchase)
  const inward = [['Date','Voucher','Narration','Taxable Value','CGST','SGST','IGST','Total Tax','Invoice Value']];
  let inTotals = {taxable:0,cgst:0,sgst:0,igst:0,tax:0,invoice:0};
  state.vouchers.filter(v=>v.type==='Purchase').forEach(v=>{
    const g = gstBreakdownForVoucher(v);
    if(g.totalTax<=0) return;
    const invoice = voucherAmount(v);
    const taxable = invoice - g.totalTax;
    inward.push([v.date, v.type, v.narration||'', r2(taxable), r2(g.cgst), r2(g.sgst), r2(g.igst), r2(g.totalTax), r2(invoice)]);
    inTotals.taxable+=taxable; inTotals.cgst+=g.cgst; inTotals.sgst+=g.sgst; inTotals.igst+=g.igst; inTotals.tax+=g.totalTax; inTotals.invoice+=invoice;
  });
  if(inward.length>1) inward.push(['Total','','', r2(inTotals.taxable), r2(inTotals.cgst), r2(inTotals.sgst), r2(inTotals.igst), r2(inTotals.tax), r2(inTotals.invoice)]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(inward), 'Inward Supplies (Purchase)');

  return wb;
}

function netProfit(){
  // Income ledgers carry Cr nature -> their signed balance is negative when in credit
  const income = -totalsByCategory('Income');   // positive number = income earned
  const expense = totalsByCategory('Expenses'); // positive number = expense incurred
  return income - expense;
}
