/* ---------------- 3D bar charts (Three.js) ---------------- */
let chart3DFrames = {}; // canvasId -> requestAnimationFrame id, so old loops stop when the canvas is replaced
function init3DBarChart(canvasId, columns){
  const canvas = document.getElementById(canvasId);
  if(!canvas || typeof THREE === 'undefined') return;
  if(chart3DFrames[canvasId]){ cancelAnimationFrame(chart3DFrames[canvasId]); delete chart3DFrames[canvasId]; }

  const width = canvas.clientWidth || 360;
  const height = canvas.clientHeight || 220;
  let renderer;
  try{
    renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  }catch(e){ return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(width, height, false);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, width/height, 0.1, 100);
  camera.position.set(4.6, 3.4, 6.2);
  camera.lookAt(0, 0.6, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dLight = new THREE.DirectionalLight(0xffffff, 0.75);
  dLight.position.set(4, 7, 5);
  scene.add(dLight);
  const fillLight = new THREE.DirectionalLight(0xffffff, 0.25);
  fillLight.position.set(-4, 2, -3);
  scene.add(fillLight);

  const columnTotals = columns.map(c=> c.segments.reduce((s,seg)=>s+Math.abs(seg.value),0));
  const maxVal = Math.max(...columnTotals, 1);
  const group = new THREE.Group();
  const barWidth = 0.85, gap = 0.55;
  const totalWidth = columns.length*barWidth + (columns.length-1)*gap;

  // faint base grid for grounding
  const gridGeo = new THREE.PlaneGeometry(totalWidth+2, 2.4);
  const gridMat = new THREE.MeshBasicMaterial({ color:0xE1E7E3, transparent:true, opacity:0.5, side:THREE.DoubleSide });
  const grid = new THREE.Mesh(gridGeo, gridMat);
  grid.rotation.x = -Math.PI/2;
  grid.position.y = -0.005;
  group.add(grid);

  columns.forEach((col,i)=>{
    const x = -totalWidth/2 + barWidth/2 + i*(barWidth+gap);
    let cumY = 0;
    col.segments.forEach(seg=>{
      const h = Math.max(0.06, (Math.abs(seg.value)/maxVal) * 2.7);
      const geo = new THREE.BoxGeometry(barWidth, h, barWidth);
      const mat = new THREE.MeshStandardMaterial({ color: seg.color, roughness:0.45, metalness:0.08 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.x = x;
      mesh.position.y = cumY + h/2;
      group.add(mesh);

      const edges = new THREE.EdgesGeometry(geo);
      const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color:0x000000, transparent:true, opacity:0.12 }));
      line.position.copy(mesh.position);
      group.add(line);

      cumY += h;
    });
  });
  scene.add(group);

  function animate(){
    group.rotation.y += 0.0055;
    renderer.render(scene, camera);
    if(document.getElementById(canvasId)){
      chart3DFrames[canvasId] = requestAnimationFrame(animate);
    } else {
      renderer.dispose();
      delete chart3DFrames[canvasId];
    }
  }
  animate();
}

// Indian financial-year label for a date, e.g. '2026-27', anchored on the company's fyStart/booksFrom
// (month+day only — the year is worked out per date). Shared by the invoice numbering below and by
// the FY-comparative reports.
function fyLabelForDate(dateStr){
  const fyStartStr = (currentCompany && (currentCompany.booksFrom||currentCompany.fyStart)) || defaultFYStart();
  const anchor = new Date(fyStartStr+'T00:00:00');
  const d = new Date(dateStr+'T00:00:00');
  let fyStartYear = d.getFullYear();
  const beforeAnchor = (d.getMonth() < anchor.getMonth()) || (d.getMonth()===anchor.getMonth() && d.getDate()<anchor.getDate());
  if(beforeAnchor) fyStartYear -= 1;
  return `${fyStartYear}-${String((fyStartYear+1) % 100).padStart(2,'0')}`;
}
function nextFYLabel(label){
  const startYear = parseInt(label.slice(0,4),10) + 1;
  return `${startYear}-${String((startYear+1)%100).padStart(2,'0')}`;
}
function priorFYLabel(label){
  const startYear = parseInt(label.slice(0,4),10) - 1;
  return `${startYear}-${String((startYear+1)%100).padStart(2,'0')}`;
}
// Every financial year that has at least one voucher dated in it, most recent first.
function distinctFYsInVouchers(){
  const set = new Set(state.vouchers.map(v=>fyLabelForDate(v.date)));
  return Array.from(set).sort().reverse();
}
// Calendar start/end dates for a FY label (e.g. '2026-27'), anchored on the company's fyStart month+day.
function fyBoundsForLabel(fyLabel){
  const startYear = parseInt(fyLabel.slice(0,4),10);
  const fyStartStr = (currentCompany && (currentCompany.booksFrom||currentCompany.fyStart)) || defaultFYStart();
  const anchor = new Date(fyStartStr+'T00:00:00');
  const start = new Date(startYear, anchor.getMonth(), anchor.getDate());
  const end = new Date(startYear+1, anchor.getMonth(), anchor.getDate());
  end.setDate(end.getDate()-1);
  return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10) };
}
// A stable-enough invoice number derived from position among all Sales vouchers ordered by date —
// there's no separate persisted invoice-numbering sequence, so this is recomputed each time from the
// voucher list itself (stable as long as vouchers aren't deleted/reordered in between reprints).
function salesVoucherInvoiceNumber(v){
  const sales = state.vouchers.filter(x=>x.type==='Sales')
    .sort((a,b)=> a.date===b.date ? (a.createdAt||'').localeCompare(b.createdAt||'') : (a.date<b.date?-1:1));
  const idx = sales.findIndex(x=>x.id===v.id);
  const seq = idx>-1 ? idx+1 : sales.length+1;
  return `INV/${fyLabelForDate(v.date)}/${String(seq).padStart(4,'0')}`;
}

function gstCalculator(){

  const subtitle = {
    'Sales':'Output tax on sale', 'Purchase':'Input tax on purchase',
    'Credit Note':'Reverses output tax — sales return', 'Debit Note':'Reverses input tax — purchase return'
  }[vform.type];
  const taxableLabel = {
    'Sales':'Sales Ledger', 'Purchase':'Purchase Ledger',
    'Credit Note':'Sales Return Ledger', 'Debit Note':'Purchase Return Ledger'
  }[vform.type];
  return `
    <div class="panel" style="border-color:var(--gold);">

      <div class="panel-body">

              <option value="">Select ledger…</option>
              ${state.ledgers.map(l=>`<option value="${l.id}" ${g.taxableLedger===l.id?'selected':''}>${l.name}${l.gstRate!=null?' ('+l.gstRate+'%)':''}</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="section-title" style="margin-top:6px;">${isReturn?'Returned Items':'Items'}</div>
        <div class="entry-row" style="grid-template-columns:2fr 0.8fr 1fr 1fr auto;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;margin-bottom:2px;padding:0 2px;">

              ${[0,5,12,18,28].map(r=>`<option value="${r}" ${Number(g.rate)===r?'selected':''}>${r}%</option>`).join('')}
            </select>
          </div>

            <select id="gstSupply">
              <option value="intra" ${g.supply==='intra'?'selected':''}>Intrastate (CGST+SGST)</option>
              <option value="inter" ${g.supply==='inter'?'selected':''}>Interstate (IGST)</option>
            </select>
          </div>
        </div>

        <button class="btn secondary small" id="applyGST" type="button">Add to Voucher</button>

function itemsSubtotal(items){
  return (items||[]).reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.rate)||0), 0);
}
function itemRow(it,i){
  const isCustom = !it.itemId || it.itemId==='__custom__';
  return `<div class="entry-row" style="grid-template-columns:2fr 0.8fr 1fr 1fr auto;align-items:start;" data-item-idx="${i}">
    <div>
      <select class="item-select" data-i="${i}">
        <option value="__custom__" ${isCustom?'selected':''}>— Custom item —</option>
        ${state.items.map(m=>`<option value="${m.id}" ${it.itemId===m.id?'selected':''}>${m.name}${m.unit?' ('+m.unit+')':''}</option>`).join('')}
      </select>
      ${isCustom ? `<input type="text" class="item-name" data-i="${i}" placeholder="Item name" value="${escapeAttr(it.name)}" style="margin-top:6px;">` : ''}
    </div>
    <input type="number" class="item-qty" data-i="${i}" placeholder="Qty" value="${it.qty||''}" min="0" step="0.01">
    <input type="number" class="item-rate" data-i="${i}" placeholder="Rate" value="${it.rate||''}" min="0" step="0.01">
    <input type="text" class="item-amount" value="₹${fmt((Number(it.qty)||0)*(Number(it.rate)||0))}" disabled>
    <button class="rm" data-item-rm="${i}" type="button" title="Remove item">✕</button>
  </div>`;
}
function gstPreview(g){
  const amt = itemsSubtotal(g.items);
  const rate = Number(g.rate)||0;
  const tax = amt*rate/100;
  const half = tax/2;
  let inner;
  if(!amt) inner = `Add items with a quantity and rate to see the tax split.`;
  else if(g.supply==='intra') inner = `CGST @ ${rate/2}% = ₹${fmt(half)} &nbsp;+&nbsp; SGST @ ${rate/2}% = ₹${fmt(half)} &nbsp;→&nbsp; Total ₹${fmt(amt+tax)}`;
  else inner = `IGST @ ${rate}% = ₹${fmt(tax)} &nbsp;→&nbsp; Total ₹${fmt(amt+tax)}`;
  return `<p class="muted" style="font-size:12.5px;" id="gstPreviewBox">${inner}</p>`;
}

function viewCalendar(){
  const {year, month} = calState;
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);

  const vouchersByDate = {};
  for(const v of state.vouchers){
    (vouchersByDate[v.date] = vouchersByDate[v.date] || []).push(v);
  }

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="calendar-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const count = (vouchersByDate[dateStr]||[]).length;
    const cls = ['calendar-day'];
    if(dateStr===todayStr) cls.push('today');
    if(dateStr===calState.selected) cls.push('selected');
    cells += `<div class="${cls.join(' ')}" data-cal-day="${dateStr}">${d}${count?`<span class="count">${count}</span>`:''}</div>`;
  }

  const selectedVouchers = vouchersByDate[calState.selected] || [];

  return `
    ${masthead('Calendar','Browse vouchers by date')}
    <div class="panel">
      <div class="panel-body">
        <div class="calendar-nav">
          <div class="navbtns">
            <button class="btn small secondary" id="calPrev" type="button">◀ Prev</button>
            <button class="btn small secondary" id="calToday" type="button">Today</button>
            <button class="btn small secondary" id="calNext" type="button">Next ▶</button>
          </div>
          <div class="monthlabel">${monthNames[month]} ${year}</div>
        </div>
        <div class="calendar-grid">
          <div class="dow">Sun</div><div class="dow">Mon</div><div class="dow">Tue</div><div class="dow">Wed</div><div class="dow">Thu</div><div class="dow">Fri</div><div class="dow">Sat</div>
          ${cells}
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Vouchers on ${calState.selected}</h2><span class="muted" style="font-size:12px;">${selectedVouchers.length} entr${selectedVouchers.length===1?'y':'ies'}</span></div>
      <div class="panel-body" style="padding:0;">
        ${selectedVouchers.length ? `<table>
          <tr><th>Type</th><th>Narration</th><th class="num">Amount</th><th>Action</th></tr>
          ${selectedVouchers.map(v=>`<tr>
            <td>${v.type}</td>
            <td>${v.narration||'—'}${itemsSummary(v)}${v.createdAt?`<div class="muted" style="font-size:10.5px;margin-top:3px;">Entered: ${fmtTimestamp(v.createdAt)}</div>`:''}</td>
            <td class="num">₹${fmt(voucherAmount(v))}</td>
            <td><button class="btn small secondary" data-edit-voucher="${v.id}" type="button">Edit</button> <button class="btn small secondary" data-delete-voucher="${v.id}" type="button">Delete</button></td>
          </tr>`).join('')}
        </table>` : `<div class="empty">No vouchers on this date. <a class="linklike" id="calNewVoucher">Add one →</a></div>`}
      </div>
    </div>
  `;
}

function ledgerStatement(ledgerId){
  const l = ledgerOf(ledgerId);
  if(!l) return `<div class="empty">Ledger not found</div>`;
  let running = l.opening || 0;
  const rows = [];
  const sorted = state.vouchers.slice().sort((a,b)=> a.date.localeCompare(b.date));
  for(const v of sorted){
    for(const e of v.entries){
      if(e.ledgerId === ledgerId){
        running += (e.dr||0) - (e.cr||0);
        rows.push({date:v.date, particulars:v.narration||v.type, dr:e.dr, cr:e.cr, running});
      }
    }
  }
  const bal = ledgerBalance(ledgerId);
  return `
    <div class="panel">
      <div class="panel-head">
        <h2>${l.name}</h2>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="btn small secondary" data-open-pie="${ledgerId}" type="button">📊 Pie Chart</button>
          <span class="pill ${bal>=0?'pos':'neg'}">${fmt(bal)} ${balanceLabel(bal)}</span>
        </div>
      </div>
      <div class="panel-body" style="padding:0;">
        <table>
          <tr><th>Date</th><th>Particulars</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr>
          <tr><td class="muted">—</td><td class="muted">Opening Balance</td><td class="num">${l.opening>0?fmt(l.opening):''}</td><td class="num">${l.opening<0?fmt(l.opening):''}</td><td class="num ${l.opening>=0?'pos':'neg'}">${fmt(l.opening)} ${balanceLabel(l.opening)}</td></tr>
          ${rows.map(r=>`<tr>
            <td class="muted">${r.date}</td>
            <td>${r.particulars}</td>
            <td class="num">${r.dr?fmt(r.dr):''}</td>
            <td class="num">${r.cr?fmt(r.cr):''}</td>
            <td class="num ${r.running>=0?'pos':'neg'}">${fmt(r.running)} ${balanceLabel(r.running)}</td>
          </tr>`).join('')}
          ${!rows.length ? `<tr><td colspan="5" class="empty">No transactions on this ledger yet.</td></tr>`:''}
        </table>
      </div>
    </div>
  `;
}

/* Lightweight, dependency-free inline-SVG horizontal bar chart. Colors accept any CSS color
   (including var(--token) references) so it stays in sync with the app's light/values theme. */
function svgHBarChart(items, opts={}){
  const width = opts.width || 480;
  const barH = opts.barHeight || 20;
  const gap = opts.gap || 12;
  const labelW = opts.labelWidth || 172;
  const valueW = opts.valueWidth || 66;
  const chartW = Math.max(40, width - labelW - valueW - 14);
  const vals = items.map(it=>Math.abs(it.value)||0);
  const maxVal = opts.max || Math.max(...vals, opts.benchmark!=null ? Math.abs(opts.benchmark) : 0, 0.0001);
  const rowH = barH + gap;
  const topPad = opts.benchmark!=null ? 18 : 4;
  const height = topPad + items.length*rowH - gap + 6;

  const barsSvg = items.map((it,i)=>{
    const y = topPad + i*rowH;
    const w = Math.max(2, (Math.abs(it.value||0)/maxVal) * chartW);
    const color = it.color || 'var(--accent1)';
    return `<g class="viz-mark" data-tip-title="${escapeAttr(it.label)}" data-tip-value="${escapeAttr(it.display)}" data-tip-color="${color}"${it.sub?` data-tip-sub="${escapeAttr(it.sub)}"`:''} tabindex="0">
      <text x="0" y="${y+barH/2+4}" font-size="11.5" font-weight="600" fill="var(--ink-soft)">${escapeHtml(it.label)}</text>
      <rect x="${labelW}" y="${y}" width="${chartW}" height="${barH}" rx="4" fill="var(--surface-strong)"></rect>
      <rect x="${labelW}" y="${y}" width="${w}" height="${barH}" rx="4" fill="${color}"></rect>
      <text x="${labelW+chartW+10}" y="${y+barH/2+4}" font-size="11.5" font-weight="700" fill="var(--ink)">${escapeHtml(it.display)}</text>
    </g>`;
  }).join('');

  let benchmarkSvg = '';
  if(opts.benchmark!=null){
    const bx = labelW + Math.min(1, Math.abs(opts.benchmark)/maxVal) * chartW;
    benchmarkSvg = `<line x1="${bx}" y1="2" x2="${bx}" y2="${height}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4,3"></line>
      <text x="${bx}" y="12" font-size="9.5" fill="var(--gold)" text-anchor="middle" font-weight="700">${escapeHtml(opts.benchmarkLabel||'')}</text>`;
  }

  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" style="display:block;font-family:'Inter',sans-serif;overflow:visible;">${benchmarkSvg}${barsSvg}</svg>`;
}
/* Single-row 100%-stacked bar, used to visualise a financing (Equity vs Liabilities) mix. */
function svgStackedBar(segments, opts={}){
  const width = opts.width || 480, height = opts.height || 26;
  const total = segments.reduce((s,x)=>s+Math.max(0,x.value||0),0) || 1;
  let x = 0;
  const rects = segments.map(seg=>{
    const w = Math.max(0,seg.value||0)/total*width;
    const pct = (Math.max(0,seg.value||0)/total*100).toFixed(1);
    const r = `<g class="viz-mark" data-tip-title="${escapeAttr(seg.label)}" data-tip-value="₹${fmt(seg.value)}" data-tip-sub="${pct}% of the total" data-tip-color="${seg.color}" tabindex="0"><rect x="${x.toFixed(2)}" y="0" width="${w.toFixed(2)}" height="${height}" fill="${seg.color}"></rect></g>`;
    x += w;
    return r;
  }).join('');
  const legend = segments.map(seg=>`<span style="display:inline-flex;align-items:center;gap:6px;margin-right:18px;font-size:11.5px;color:var(--ink-soft);"><span style="width:10px;height:10px;border-radius:2px;background:${seg.color};display:inline-block;"></span>${escapeHtml(seg.label)} (${(Math.max(0,seg.value||0)/total*100).toFixed(1)}%)</span>`).join('');
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" style="display:block;border-radius:6px;overflow:hidden;">${rects}</svg><div style="margin-top:9px;">${legend}</div>`;
}
/* Rule-based, plain-language read of the Balance Sheet's liquidity, asset mix, leverage and
   internal balance — generated from the same figures shown in the statement above it. */
function balanceSheetInterpretation(bs, ratios){
  const notes = [];
  if(ratios.currentRatio!=null){
    if(ratios.currentRatio >= 2) notes.push(`Current assets are ${fmtRatio(ratios.currentRatio)}× current liabilities — a strong liquidity buffer, comfortably above the conventional 2:1 benchmark.`);
    else if(ratios.currentRatio >= 1) notes.push(`Current assets cover current liabilities ${fmtRatio(ratios.currentRatio)}× over — an acceptable, if not generous, short-term liquidity position.`);
    else notes.push(`Current liabilities exceed current assets (ratio of ${fmtRatio(ratios.currentRatio)}) — a sign of potential short-term liquidity strain; near-term cash inflows should be watched against upcoming obligations.`);
  }
  notes.push(`Working capital stands at ₹${fmt(ratios.workingCapital)}, which is ${ratios.workingCapital>=0 ? 'positive — short-term assets comfortably fund short-term obligations.' : 'negative — short-term obligations currently exceed short-term assets.'}`);

  const currentPct = bs.totalAssets ? bs.currentAssetsTotal/bs.totalAssets*100 : 0;
  const nonCurrentPct = 100-currentPct;
  notes.push(`Assets are weighted ${currentPct.toFixed(0)}% current and ${nonCurrentPct.toFixed(0)}% non-current, ${currentPct>60?'reflecting a fairly liquid, working-capital-heavy asset base.':'reflecting meaningful investment in fixed/long-term assets relative to current holdings.'}`);

  const equityPct = bs.totalAssets ? bs.totalEquity/bs.totalAssets*100 : 0;
  if(ratios.debtToEquity!=null){
    if(ratios.debtToEquity < 0.5) notes.push(`Debt-to-equity is low at ${fmtRatio(ratios.debtToEquity)}× — the business is financed mostly by equity (${equityPct.toFixed(0)}% of total assets), implying limited financial risk from leverage.`);
    else if(ratios.debtToEquity <= 1) notes.push(`Debt-to-equity of ${fmtRatio(ratios.debtToEquity)}× indicates a fairly balanced mix of debt and equity financing (equity funds ${equityPct.toFixed(0)}% of total assets).`);
    else notes.push(`Debt-to-equity of ${fmtRatio(ratios.debtToEquity)}× shows liabilities exceeding equity — a more leveraged capital structure that raises financial risk if earnings or cash flow weaken.`);
  }

  const diff = Math.abs(bs.totalAssets-bs.totalEquityAndLiab);
  if(diff>=0.01) notes.push(`⚠ Total Assets (₹${fmt(bs.totalAssets)}) does not equal Total Equity and Liabilities (₹${fmt(bs.totalEquityAndLiab)}) — check for a misclassified or one-sided entry before relying on this statement.`);
  else notes.push(`✓ The statement balances — Total Assets equal Total Equity and Liabilities at ₹${fmt(bs.totalAssets)}.`);
  return notes;
}

function viewGST(){
  const netGST = gstOutputTotal() - gstInputTotal();
  const outward = state.vouchers.filter(v=>v.type==='Sales').map(v=>({v, g:gstBreakdownForVoucher(v)})).filter(r=>r.g.totalTax>0);
  const inward = state.vouchers.filter(v=>v.type==='Purchase').map(v=>({v, g:gstBreakdownForVoucher(v)})).filter(r=>r.g.totalTax>0);

  return `
    ${masthead('GST','Output tax, input credit, and filing-ready statements')}

    <div class="panel">
      <div class="panel-head"><h2>GST Summary</h2><button class="btn secondary small" id="downloadGSTBtn" type="button">⬇ Download GST Statement</button></div>
      <div class="panel-body" style="padding:0;">
        <table>
          <tr><th>Tax Head</th><th class="num">Output (Payable)</th><th class="num">Input (Credit)</th></tr>
          <tr><td>CGST</td><td class="num">₹${fmt(-ledgerBalance('l_ocgst'))}</td><td class="num">₹${fmt(ledgerBalance('l_icgst'))}</td></tr>
          <tr><td>SGST</td><td class="num">₹${fmt(-ledgerBalance('l_osgst'))}</td><td class="num">₹${fmt(ledgerBalance('l_isgst'))}</td></tr>
          <tr><td>IGST</td><td class="num">₹${fmt(-ledgerBalance('l_oigst'))}</td><td class="num">₹${fmt(ledgerBalance('l_iigst'))}</td></tr>
          <tr style="font-weight:600;border-top:2px solid var(--ink);"><td>Total</td><td class="num">₹${fmt(gstOutputTotal())}</td><td class="num">₹${fmt(gstInputTotal())}</td></tr>
        </table>
        <div style="padding:12px 16px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end;gap:10px;align-items:center;">
          <span class="muted" style="font-size:12.5px;">Net GST ${netGST>=0?'Payable':'Refundable / Carried Forward'}</span>
          <span class="pill ${netGST>=0?'pos':'neg'}" style="font-size:13px;">₹${fmt(netGST)}</span>
        </div>
      </div>
    </div>

    <div class="section-title">Outward Supplies (Sales)</div>
    <div class="panel"><div class="panel-body" style="padding:0;">
      ${outward.length ? `<table>
        <tr><th>Date</th><th>Narration</th><th class="num">Taxable</th><th class="num">CGST</th><th class="num">SGST</th><th class="num">IGST</th><th class="num">Invoice Total</th></tr>
        ${outward.map(({v,g})=>{
          const invoice = voucherAmount(v);
          const taxable = invoice - g.totalTax;
          return `<tr><td class="muted">${v.date}</td><td>${v.narration||'—'}</td><td class="num">₹${fmt(taxable)}</td><td class="num">₹${fmt(g.cgst)}</td><td class="num">₹${fmt(g.sgst)}</td><td class="num">₹${fmt(g.igst)}</td><td class="num">₹${fmt(invoice)}</td></tr>`;
        }).join('')}
      </table>` : `<div class="empty">No GST sales vouchers recorded yet.</div>`}
    </div></div>

    <div class="section-title">Inward Supplies (Purchase)</div>
    <div class="panel"><div class="panel-body" style="padding:0;">
      ${inward.length ? `<table>
        <tr><th>Date</th><th>Narration</th><th class="num">Taxable</th><th class="num">CGST</th><th class="num">SGST</th><th class="num">IGST</th><th class="num">Invoice Total</th></tr>
        ${inward.map(({v,g})=>{
          const invoice = voucherAmount(v);
          const taxable = invoice - g.totalTax;
          return `<tr><td class="muted">${v.date}</td><td>${v.narration||'—'}</td><td class="num">₹${fmt(taxable)}</td><td class="num">₹${fmt(g.cgst)}</td><td class="num">₹${fmt(g.sgst)}</td><td class="num">₹${fmt(g.igst)}</td><td class="num">₹${fmt(invoice)}</td></tr>`;
        }).join('')}
      </table>` : `<div class="empty">No GST purchase vouchers recorded yet.</div>`}
    </div></div>
    <p class="muted" style="font-size:11.5px;">Note: only Sales/Purchase vouchers where GST was applied via the GST Calculator appear here. Use the Voucher tab to record a taxable sale or purchase.</p>
  `;
}

function reconcileDateLabel(d){
  try{ return new Date(d).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}); }
  catch(e){ return d; }
}
function viewReconcile(){
  const bankLedgers = state.ledgers.filter(l=>bucketOf(l)==='bank');
  if(!bankLedgers.length){
    return `
      ${masthead('Bank Reconciliation','Match your books against the bank statement, account by account')}
      <div class="panel"><div class="panel-body"><div class="empty">No bank ledgers yet. Add one from Accounts under the "Bank Accounts" group, then come back here to reconcile it.</div></div></div>
    `;
  }
  if(!reconcileLedgerId || !bankLedgers.find(l=>l.id===reconcileLedgerId)) reconcileLedgerId = bankLedgers[0].id;
  const ledger = ledgerOf(reconcileLedgerId);
  const asOfDate = reconcileDraft.date || new Date().toISOString().slice(0,10);
  const hasBalance = reconcileDraft.balance !== '' && reconcileDraft.balance != null;
  const statementBalance = Number(reconcileDraft.balance)||0;
  const summary = bankReconciliationSummary(reconcileLedgerId, asOfDate, statementBalance);
  const history = state.reconciliations
    .filter(r=>r.ledgerId===reconcileLedgerId)
    .sort((a,b)=> b.date===a.date ? (b.createdAt||'').localeCompare(a.createdAt||'') : (b.date<a.date?-1:1))
    .slice(0,8);

  return `
    ${masthead('Bank Reconciliation','Match your books against the bank statement, account by account')}

    <div class="panel">
      <div class="panel-body" style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;">
        <div class="field" style="min-width:220px;">
          <label>Bank Ledger</label>
          <select id="reconcileLedgerSelect">
            ${bankLedgers.map(l=>`<option value="${l.id}" ${l.id===reconcileLedgerId?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Statement Date</label><input type="date" id="reconcileDate" value="${asOfDate}"></div>
        <button class="btn secondary small" id="reconcileHelpBtn" type="button" title="How does this work?" style="align-self:center;">ⓘ How this works</button>
        <div class="field"><label>Statement Closing Balance (₹)</label><input type="number" step="0.01" id="reconcileBalance" placeholder="As shown on your bank statement" value="${escapeAttr(String(reconcileDraft.balance))}"></div>
        <button class="btn" id="saveReconcileBtn" type="button" ${hasBalance?'':'disabled'}>💾 Save Reconciliation</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Summary — ${escapeHtml(ledger.name)}</h2><span class="pill ${!hasBalance ? '' : (summary.reconciled?'pos':'neg')}">${hasBalance ? (summary.reconciled?'✓ Reconciled':'⚠ Difference ₹'+fmt(Math.abs(summary.difference))) : 'Enter statement balance'}</span></div>
      <div class="panel-body" style="padding:0;">
        <table>
          <tr><td>Balance as per Bank Statement (${reconcileDateLabel(asOfDate)})</td><td class="num">₹${fmt(statementBalance)}</td></tr>
          <tr><td>Add: Deposits/Receipts in books not yet credited by bank (${summary.outstandingDeposits.length})</td><td class="num">+ ₹${fmt(summary.outstandingDrTotal)}</td></tr>
          <tr><td>Less: Payments/Cheques in books not yet presented (${summary.outstandingPayments.length})</td><td class="num">− ₹${fmt(summary.outstandingCrTotal)}</td></tr>
          <tr style="font-weight:700;border-top:2px solid var(--ink);"><td>= Balance as per Books (calculated)</td><td class="num">₹${fmt(summary.computedBookBalance)}</td></tr>
          <tr><td class="muted">Actual Balance as per Books (Ledger)</td><td class="num muted">₹${fmt(summary.bookBalance)}</td></tr>
          <tr style="font-weight:700;"><td>Unreconciled Difference</td><td class="num ${Math.abs(summary.difference)<0.005?'':'neg'}">₹${fmt(summary.difference)}</td></tr>
        </table>
      </div>
      <p class="muted" style="font-size:11.5px;padding:0 16px 12px;">${!hasBalance ? 'Enter the closing balance from your bank statement above to see how it lines up with the books.' : (Math.abs(summary.difference)<0.005 ? 'This account is fully reconciled as of the statement date — every difference is explained by items still outstanding below.' : 'A non-zero difference usually means something is on the bank statement but not yet in your books (bank charges, interest, a direct debit/credit) — or a transaction below is ticked the wrong way.')}</p>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Transactions up to ${reconcileDateLabel(asOfDate)}</h2></div>
      <div class="panel-body" style="padding:0;">
        <table>
          <tr><th>Date</th><th>Voucher</th><th>Narration</th><th class="num">Deposit (Dr)</th><th class="num">Payment (Cr)</th><th style="text-align:center;">Cleared</th></tr>
          ${summary.rows.map(r=>`
          <tr>
            <td class="muted">${r.date}</td>
            <td class="muted">${escapeHtml(r.type)}</td>
            <td>${escapeHtml(r.narration||'—')}</td>
            <td class="num">${r.dr?'₹'+fmt(r.dr):''}</td>
            <td class="num">${r.cr?'₹'+fmt(r.cr):''}</td>
            <td style="text-align:center;"><input type="checkbox" data-clear-voucher="${r.voucherId}" ${r.cleared?'checked':''}></td>
          </tr>`).join('') || `<tr><td colspan="6" class="empty">No transactions on this account up to this date yet.</td></tr>`}
        </table>
      </div>
    </div>

    ${history.length ? `
    <div class="panel">
      <div class="panel-head"><h2>Reconciliation History</h2></div>
      <div class="panel-body" style="padding:0;">
        <table>
          <tr><th>Statement Date</th><th class="num">Statement Bal.</th><th class="num">Book Bal.</th><th class="num">Difference</th><th>Saved</th></tr>
          ${history.map(h=>`<tr><td class="muted">${h.date}</td><td class="num">₹${fmt(h.statementBalance)}</td><td class="num">₹${fmt(h.bookBalance)}</td><td class="num ${Math.abs(h.difference)<0.005?'':'neg'}">₹${fmt(h.difference)}</td><td class="muted" style="font-size:11px;">${fmtTimestamp(h.createdAt)}</td></tr>`).join('')}
        </table>
      </div>
    </div>` : ''}
  `;
}

function viewAssets(){
  const currentFY = fyLabelForDate(new Date().toISOString().slice(0,10));
  return `
    ${masthead('Fixed Asset Register',`Track assets and post depreciation for FY ${currentFY}`,'assets')}
    <div class="panel">
      <div class="panel-body" style="padding:0;">
        ${state.fixedAssets.length ? `<table>
          <tr><th>Asset</th><th>Ledger</th><th class="num">Cost</th><th>Method</th><th>Life</th><th class="num">Book Value</th><th class="num">FY ${currentFY} Dep.</th><th></th></tr>
          ${state.fixedAssets.map(a=>{
            const ledger = ledgerOf(a.ledgerId);
            const bookValue = ledger ? ledgerBalance(ledger.id) : null;
            const posted = (a.postedFYs||[]).includes(currentFY);
            const dueDep = assetDepreciationForFY(a, currentFY);
            return `<tr>
              <td>${escapeHtml(a.name)}</td>
              <td class="muted">${ledger ? escapeHtml(ledger.name) : '<span style="color:var(--debit);">Ledger deleted</span>'}</td>
              <td class="num">₹${fmt(Number(a.cost)||0)}</td>
              <td class="muted">${a.method}</td>
              <td class="muted">${a.usefulLifeYears} yr</td>
              <td class="num">${bookValue==null?'—':'₹'+fmt(bookValue)}</td>
              <td class="num">${posted ? `<span class="muted">✓ Posted</span>` : (dueDep>0 ? '₹'+fmt(dueDep) : '—')}</td>
              <td>
                ${!posted && dueDep>0 && ledger ? `<button class="btn small secondary" data-post-depreciation="${a.id}" type="button">Post Dep.</button>` : ''}
                <button class="btn small secondary" data-delete-asset="${a.id}" type="button">🗑</button>
              </td>
            </tr>`;
          }).join('')}
        </table>` : `<div class="empty">No fixed assets registered yet.</div>`}
      </div>
    </div>
    <div class="panel"><div class="panel-body">
      ${fixedAssetDraft ? assetDraftForm() : `<button class="btn secondary small" id="newAssetBtn" type="button">+ Add Fixed Asset</button>`}
    </div></div>
    <p class="muted" style="font-size:11.5px;">Book Value is read live off the linked ledger's balance. "Post Dep." posts a Journal voucher (Dr Depreciation / Cr the asset's ledger) for the current financial year and can only be posted once per asset per year.</p>
  `;
}

function partyAgeingTable(rows, emptyMsg){
  if(!rows.length) return `<div class="empty">${emptyMsg}</div>`;
  return `<table>
    <tr><th>Party</th><th class="num">0-30 days</th><th class="num">31-60 days</th><th class="num">61-90 days</th><th class="num">90+ days</th><th class="num">Total Outstanding</th></tr>
    ${rows.map(r=>`<tr data-open-party="${r.ledger.id}" style="cursor:pointer;">
      <td>${escapeHtml(r.ledger.name)}</td>
      <td class="num">${r.summary.buckets['0-30']?'₹'+fmt(r.summary.buckets['0-30']):'—'}</td>
      <td class="num">${r.summary.buckets['31-60']?'₹'+fmt(r.summary.buckets['31-60']):'—'}</td>
      <td class="num ${r.summary.buckets['61-90']?'neg':''}">${r.summary.buckets['61-90']?'₹'+fmt(r.summary.buckets['61-90']):'—'}</td>
      <td class="num ${r.summary.buckets['90+']?'neg':''}">${r.summary.buckets['90+']?'₹'+fmt(r.summary.buckets['90+']):'—'}</td>
      <td class="num" style="font-weight:700;">₹${fmt(r.summary.total)}</td>
    </tr>`).join('')}
  </table>`;
}
function viewParties(){
  const customers = state.ledgers.filter(l=>l.partyType==='customer');
  const suppliers = state.ledgers.filter(l=>l.partyType==='supplier');
  const rowsFor = list => list.map(l=>({ ledger:l, summary: partyAgeingSummary(l.id) })).sort((a,b)=>b.summary.total-a.summary.total);
  const custRows = rowsFor(customers);
  const suppRows = rowsFor(suppliers);
  const totalReceivable = r2(custRows.reduce((s,r)=>s+r.summary.total,0));
  const totalPayable = r2(suppRows.reduce((s,r)=>s+r.summary.total,0));

  return `
    ${masthead('Parties','Customers & suppliers — outstanding balances by age','parties')}
    <div class="section-title">Receivables (Customers) — Outstanding ₹${fmt(totalReceivable)}</div>
    <div class="panel"><div class="panel-body" style="padding:0;">${partyAgeingTable(custRows, customers.length ? 'No outstanding receivables — every customer invoice is settled.' : 'No ledgers tagged as customers yet. Tag one from the Accounts tab.')}</div></div>

    <div class="section-title">Payables (Suppliers) — Outstanding ₹${fmt(totalPayable)}</div>
    <div class="panel"><div class="panel-body" style="padding:0;">${partyAgeingTable(suppRows, suppliers.length ? 'No outstanding payables — every supplier bill is settled.' : 'No ledgers tagged as suppliers yet. Tag one from the Accounts tab.')}</div></div>
    <p class="muted" style="font-size:11.5px;">Tag a ledger as a Customer or Supplier from the Accounts tab (click "Not a party" next to any ledger) to have it appear here. Click a row for its invoice-by-invoice breakdown. Payments are matched to the oldest outstanding invoice first (FIFO).</p>
  `;
}
function partyDetailModal(){
  if(!partyDetailLedgerId) return '';
  const l = ledgerOf(partyDetailLedgerId);
  if(!l) return '';
  const rows = partyAgeing(partyDetailLedgerId).sort((a,b)=> a.date===b.date?0:(a.date<b.date?-1:1));
  const total = r2(rows.reduce((s,r)=>s+r.remaining,0));
  return `
    <div class="modal-overlay" id="modalOverlayBg">
      <div class="modal-card" style="width:620px;position:relative;">
        <button class="btn secondary small" id="modalClose" type="button" style="position:absolute;top:14px;right:14px;z-index:2;">✕</button>
        <div class="panel-head"><h2>${escapeHtml(l.name)} — Outstanding</h2></div>
        <div class="panel-body" style="max-height:72vh;overflow-y:auto;">
          ${rows.length ? `<table>
            <tr><th>Date</th><th>Voucher</th><th>Narration</th><th class="num">Invoice Amt.</th><th class="num">Outstanding</th><th>Age</th></tr>
            ${rows.map(r=>`<tr>
              <td class="muted">${r.date}</td><td class="muted">${r.type}</td><td>${escapeHtml(r.narration||'—')}</td>
              <td class="num">₹${fmt(r.amount)}</td><td class="num">₹${fmt(r.remaining)}</td>
              <td class="muted" style="font-size:11.5px;">${r.ageDays}d (${r.bucket})</td>
            </tr>`).join('')}
            <tr style="font-weight:700;border-top:2px solid var(--ink);"><td colspan="4">Total Outstanding</td><td class="num">₹${fmt(total)}</td><td></td></tr>
          </table>` : `<div class="empty">Nothing outstanding — fully settled.</div>`}
        </div>
      </div>
    </div>
  `;
}

/* ---------------- event handling ---------------- */
function attachHandlers(){
  document.querySelectorAll('.navtab').forEach(b=>{
    b.addEventListener('click',()=>{ goToTab(b.dataset.tab); });
  });

  document.getElementById('openRecurringBtn')?.addEventListener('click', ()=>{
    recurringDraft = null;
    modal = 'recurring';
    render();
  });

  document.querySelectorAll('[data-open-help]').forEach(el=>{
    el.addEventListener('click', ()=>{
      modal = el.dataset.openHelp + 'Help';
      render();
    });
  });

  document.getElementById('fyBadgeBtn')?.addEventListener('click', ()=>{
    modal = 'fyPicker';
    render();
  });

  document.querySelectorAll('[data-select-fy]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const fy = el.dataset.selectFy;
      activeFY = fy==='__all__' ? null : fy;
      modal = null;
      toast(activeFY ? `Now viewing FY ${activeFY}` : 'Now viewing all years');
      render();
    });
  });

  if(modal==='backup'){
    document.getElementById('downloadBackupBtn')?.addEventListener('click', downloadCompanyBackup);
    document.getElementById('restoreFileInput')?.addEventListener('change', e=>{
      const file = e.target.files[0];
      const preview = document.getElementById('restorePreview');
      const confirmBtn = document.getElementById('restoreConfirmBtn');
      restoreFile = null;
      if(confirmBtn) confirmBtn.disabled = true;
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev=>{
        try{
          const data = JSON.parse(ev.target.result);
          if(!data || !Array.isArray(data.ledgers) || !Array.isArray(data.vouchers)){
            if(preview) preview.textContent = "This doesn't look like a valid backup file.";
            return;
          }
          restoreFile = data;
          if(preview) preview.textContent = `Backup from "${data.companyName||'unknown company'}", exported ${data._exportedAt?fmtTimestamp(data._exportedAt):'unknown date'} — ${data.ledgers.length} ledgers, ${data.vouchers.length} vouchers, ${(data.items||[]).length} items.`;
          if(confirmBtn) confirmBtn.disabled = false;
        }catch(err){
          if(preview) preview.textContent = "Could not read this file — make sure it's a backup .json exported from this app.";
        }
      };
      reader.readAsText(file);
    });
    document.getElementById('restoreConfirmBtn')?.addEventListener('click', async ()=>{
      if(!restoreFile) return;
      const ok = window.confirm(`This will REPLACE all current data in "${currentCompany.name}" with the backup (${restoreFile.ledgers.length} ledgers, ${restoreFile.vouchers.length} vouchers). This cannot be undone. Continue?`);
      if(!ok) return;
      await restoreCompanyBackup(restoreFile);
      restoreFile = null;
      modal = null;
      toast('Data restored from backup');
      render();
    });
  }

  if(view==='parties'){
    document.querySelectorAll('[data-open-party]').forEach(el=>{
      el.addEventListener('click', ()=>{
        partyDetailLedgerId = el.dataset.openParty;
        modal = 'partyDetail';
        render();
      });
    });
  }

  if(view==='assets'){
    document.getElementById('newAssetBtn')?.addEventListener('click', ()=>{
      fixedAssetDraft = { name:'', ledgerId:'', cost:'', purchaseDate: new Date().toISOString().slice(0,10), usefulLifeYears:5, method:'SLM', salvageValue:0 };
      render();
    });
    document.getElementById('cancelAssetBtn')?.addEventListener('click', ()=>{ fixedAssetDraft = null; render(); });
    document.getElementById('faName')?.addEventListener('input', e=> fixedAssetDraft.name = e.target.value);
    document.getElementById('faLedger')?.addEventListener('change', e=> fixedAssetDraft.ledgerId = e.target.value);
    document.getElementById('faCost')?.addEventListener('input', e=> fixedAssetDraft.cost = e.target.value);
    document.getElementById('faSalvage')?.addEventListener('input', e=> fixedAssetDraft.salvageValue = e.target.value);
    document.getElementById('faPurchaseDate')?.addEventListener('change', e=> fixedAssetDraft.purchaseDate = e.target.value);
    document.getElementById('faLife')?.addEventListener('input', e=> fixedAssetDraft.usefulLifeYears = e.target.value);
    document.getElementById('faMethod')?.addEventListener('change', e=> fixedAssetDraft.method = e.target.value);
    document.getElementById('saveAssetBtn')?.addEventListener('click', async ()=>{
      const d = fixedAssetDraft;
      if(!d.name.trim()){ toast('Enter an asset name'); return; }
      if(!d.ledgerId){ toast('Select the linked Fixed Assets ledger'); return; }
      if(!(Number(d.cost)>0)){ toast('Enter a cost greater than zero'); return; }
      if(!d.purchaseDate){ toast('Select a purchase date'); return; }
      if(!(Number(d.usefulLifeYears)>0)){ toast('Enter a useful life of at least 1 year'); return; }
      state.fixedAssets.push({

      if(!g.party || !g.taxableLedger || !amt){ toast('Fill party, ledger, and at least one item with qty & rate'); return; }
      const taxVal = amt*rate/100;
      const total = amt+taxVal;
      vform.entries = vform.entries.filter(e=> e.ledgerId || e.dr || e.cr);
      if(vform.type==='Sales'){
        vform.entries.push({ledgerId:g.party, dr:total, cr:0});

          vform.entries.push({ledgerId:'l_oigst', dr:0, cr:taxVal});
        }
      } else if(vform.type==='Credit Note'){

        if(g.supply==='intra' && taxVal>0){
          vform.entries.push({ledgerId:'l_ocgst', dr:taxVal/2, cr:0});
          vform.entries.push({ledgerId:'l_osgst', dr:taxVal/2, cr:0});
        } else if(taxVal>0){
          vform.entries.push({ledgerId:'l_oigst', dr:taxVal, cr:0});
        }
        vform.entries.push({ledgerId:g.party, dr:0, cr:total});
      } else if(vform.type==='Debit Note'){
        // Reverses a Purchase entry — purchase return
        vform.entries.push({ledgerId:g.party, dr:total, cr:0});
        vform.entries.push({ledgerId:g.taxableLedger, dr:0, cr:amt});
        if(g.supply==='intra' && taxVal>0){
          vform.entries.push({ledgerId:'l_icgst', dr:0, cr:taxVal/2});
          vform.entries.push({ledgerId:'l_isgst', dr:0, cr:taxVal/2});
        } else if(taxVal>0){
          vform.entries.push({ledgerId:'l_iigst', dr:0, cr:taxVal});

        vform.entries.push({ledgerId:g.taxableLedger, dr:amt, cr:0});
        if(g.supply==='intra' && taxVal>0){
          vform.entries.push({ledgerId:'l_icgst', dr:taxVal/2, cr:0});
          vform.entries.push({ledgerId:'l_isgst', dr:taxVal/2, cr:0});
        } else if(taxVal>0){
          vform.entries.push({ledgerId:'l_iigst', dr:taxVal, cr:0});
        }
        vform.entries.push({ledgerId:g.party, dr:0, cr:total});
      }
      if(vform.entries.length<2) vform.entries.push({ledgerId:'',dr:0,cr:0},{ledgerId:'',dr:0,cr:0});
      vform.appliedItems = (g.items||[]).filter(it=>it.name && (Number(it.qty)||0)>0).map(it=>({itemId: (it.itemId && it.itemId!=='__custom__') ? it.itemId : null, name:it.name, qty:Number(it.qty)||0, rate:Number(it.rate)||0}));

      render();

    });

  if(view==='inventory'){
    attachStockItemFormHandlers();
    document.querySelectorAll('[data-stock-detail]').forEach(el=>{
      el.addEventListener('click', ()=>{
        stockDetailItemId = el.dataset.stockDetail;
        modal = 'stockDetail';
        render();
      });
    });
    document.querySelectorAll('[data-stock-adjust]').forEach(el=>{
      el.addEventListener('click', ()=>{
        stockAdjustItemId = el.dataset.stockAdjust;
        modal = 'stockAdjust';
        render();
      });
    });
  }
  if(modal==='stockAdjust'){
    document.getElementById('saveStockAdjBtn')?.addEventListener('click', async ()=>{
      const qtyRaw = document.getElementById('stockAdjQty').value;
      const reason = document.getElementById('stockAdjReason').value.trim();
      const qty = Number(qtyRaw);
      if(!qtyRaw || qty===0 || isNaN(qty)){ toast('Enter a non-zero adjustment quantity'); return; }
      state.stockAdjustments.push({
        id: uid('adj'),
        itemId: stockAdjustItemId,
        date: new Date().toISOString().slice(0,10),
        qty,
        reason,
        createdAt: new Date().toISOString(),
      });
      await saveStockAdjustments();
      toast('Stock adjustment saved');
      modal = null;
      render();
    });
  }

  if(modal==='import' && importState){
    document.getElementById('downloadSampleTemplateBtn')?.addEventListener('click', ()=> downloadImportTemplate(true));
    document.getElementById('downloadEmptyTemplateBtn')?.addEventListener('click', ()=> downloadImportTemplate(false));
    const fileInput = document.getElementById('importFileInput');
    fileInput?.addEventListener('change', async (e)=>{
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      importState.error = '';
      try{
        const {headers, rows} = await parseImportFile(file);
        if(!headers.length){ importState.error = 'No data found in this file.'; render(); return; }
        importState.fileName = file.name;
        importState.headers = headers;
        importState.rows = rows;
        importState.dateCol = guessImportColumn(headers,'date');
        importState.descCol = guessImportColumn(headers,'desc');
        importState.debitCol = guessImportColumn(headers,'debit');
        importState.creditCol = guessImportColumn(headers,'credit');
        importState.amountCol = guessImportColumn(headers,'amount');
        importState.typeCol = guessImportColumn(headers,'type');
        importState.colMode = (importState.debitCol && importState.creditCol) ? 'split' : (importState.amountCol ? 'single' : 'split');
        render();
      }catch(err){
        importState.error = 'Could not read this file. Please check the format and try again.';
        render();
      }
    });
    document.getElementById('importChangeFileBtn')?.addEventListener('click', ()=>{
      importState.headers = []; importState.rows = []; importState.fileName = '';
      render();
    });
    document.getElementById('importPrimaryLedger')?.addEventListener('change', e=>{
      importState.primaryLedgerId = e.target.value;
      render();
    });
    document.getElementById('importNewPrimaryName')?.addEventListener('input', e=> importState.newPrimaryLedgerName = e.target.value);
    document.getElementById('importDateCol')?.addEventListener('change', e=> importState.dateCol = e.target.value);
    document.getElementById('importDescCol')?.addEventListener('change', e=> importState.descCol = e.target.value);
    document.getElementById('importColMode')?.addEventListener('change', e=>{ importState.colMode = e.target.value; render(); });
    document.getElementById('importDebitCol')?.addEventListener('change', e=> importState.debitCol = e.target.value);
    document.getElementById('importCreditCol')?.addEventListener('change', e=> importState.creditCol = e.target.value);
    document.getElementById('importAmountCol')?.addEventListener('change', e=> importState.amountCol = e.target.value);
    document.getElementById('importTypeCol')?.addEventListener('change', e=> importState.typeCol = e.target.value);

    document.getElementById('importContinueBtn')?.addEventListener('click', ()=>{
      if(!importState.primaryLedgerId){ toast('Select which ledger this statement is for'); return; }
      if(importState.primaryLedgerId==='__new__' && !(importState.newPrimaryLedgerName||'').trim()){ toast('Enter a name for the new ledger'); return; }
      if(!importState.dateCol){ toast('Select the date column'); return; }
      if(importState.colMode==='split' && (!importState.debitCol || !importState.creditCol)){ toast('Select both debit and credit columns'); return; }
      if(importState.colMode==='single' && !importState.amountCol){ toast('Select the amount column'); return; }
      const txns = importRowsToTransactions();
      if(!txns.length){ toast('No valid transactions found — check your column mapping'); return; }
      importState.transactions = txns;
      importState.groups = importBuildGroups(txns);
      importState.step = 2;
      render();
    });

    document.getElementById('importBackBtn')?.addEventListener('click', ()=>{
      importState.step = 1;
      render();
    });

    document.querySelectorAll('[data-group-ledger]').forEach(sel=>{
      sel.addEventListener('change', e=>{
        const i = +e.target.dataset.groupLedger;
        importState.groups[i].ledgerId = e.target.value === '__suspense__' ? '' : e.target.value;
      });
    });

    document.getElementById('importCommitBtn')?.addEventListener('click', commitImport);
  }

  if(view==='reports'){
    document.getElementById('exportExcelBtn')?.addEventListener('click', exportReportsToExcel);
    document.getElementById('exportTBBtn')?.addEventListener('click', exportTrialBalanceToExcel);
    document.getElementById('exportPLBtn')?.addEventListener('click', exportPLToExcel);
    document.getElementById('exportBSBtn')?.addEventListener('click', exportBalanceSheetToExcel);
    document.getElementById('exportRatiosBtn')?.addEventListener('click', exportRatiosToExcel);
    document.getElementById('exportCFBtn')?.addEventListener('click', exportCashFlowToExcel);
    document.querySelectorAll('[data-open-report]').forEach(el=>{
      el.addEventListener('click', ()=>{
        reportsSelected = el.dataset.openReport;
        render();
      });
    });
    document.getElementById('reportsBackBtn')?.addEventListener('click', ()=>{
      reportsSelected = null;
      render();
    });
    document.querySelectorAll('[data-is-detail]').forEach(el=>{
      el.addEventListener('click', ()=>{
        isDetailCategory = el.dataset.isDetail;
        modal = 'isDetail';
        render();
      });
    });
    document.querySelectorAll('[data-ledger-detail]').forEach(el=>{
      el.addEventListener('click', ()=>{
        ledgerDetailId = el.dataset.ledgerDetail;
        modal = 'ledgerDetail';
        render();
      });
    });
    // Cash Flow / Ratio Analysis's new Power BI-style visuals (waterfall, clustered column, trend
    // lines, gauges, KPI cards) reuse the same hover-tooltip / click-through / legend-toggle layer
    // the Dashboard's visuals already run on.
    wireVizInteractivity();
  }

  if(view==='gst'){
    document.getElementById('downloadGSTBtn')?.addEventListener('click', downloadGSTStatement);
  }

  if(view==='reconcile'){
    document.getElementById('reconcileLedgerSelect')?.addEventListener('change', e=>{
      reconcileLedgerId = e.target.value;
      render();
    });
    document.getElementById('reconcileDate')?.addEventListener('change', e=>{
      reconcileDraft.date = e.target.value;
      render();
    });
    document.getElementById('reconcileHelpBtn')?.addEventListener('click', ()=>{
      modal = 'reconcileHelp';
      render();
    });
    document.getElementById('reconcileBalance')?.addEventListener('input', e=>{
      reconcileDraft.balance = e.target.value;
      render();
    });
    document.querySelectorAll('[data-clear-voucher]').forEach(el=>{
      el.addEventListener('change', ()=>{
        toggleBankClear(reconcileLedgerId, el.dataset.clearVoucher, reconcileDraft.date);
        render();
      });
    });
    document.getElementById('saveReconcileBtn')?.addEventListener('click', ()=>{
      if(reconcileDraft.balance === '' || reconcileDraft.balance == null){ toast('Enter the statement closing balance first'); return; }
      saveReconciliationRecord(reconcileLedgerId, reconcileDraft.date, Number(reconcileDraft.balance)||0);
      toast('Reconciliation saved');
      render();
    });
  }
}

function updateGSTPreview(){
  const el = document.getElementById('gstPreviewBox');
  if(el) el.outerHTML = gstPreview(vform.gst);
}
function updateItemsTotals(){
  document.querySelectorAll('#gstItemRows .item-amount').forEach((el,i)=>{
    const it = vform.gst.items[i];
    if(it) el.value = '₹'+fmt((Number(it.qty)||0)*(Number(it.rate)||0));
  });
  const totalEl = document.getElementById('gstItemsTotal');
  if(totalEl) totalEl.textContent = '₹'+fmt(itemsSubtotal(vform.gst.items));
  updateGSTPreview();
}

// Re-render just the totals line without losing input focus while typing amounts
function updateSingleEntryPreview(){
  const el = document.getElementById('singlePreview');
  if(el) el.textContent = singleEntryPreviewText();
  const s = vform.single;
  const amt = Number(s.amount)||0;
  const ok = !!(s.ledgerA && s.ledgerB && amt>0 && s.ledgerA!==s.ledgerB);
  const saveBtn = document.getElementById('saveVoucher');
  if(saveBtn) saveBtn.disabled = !ok;
}

function renderTotalsOnly(){
  const dr = vform.entries.reduce((s,e)=>s+(Number(e.dr)||0),0);
  const cr = vform.entries.reduce((s,e)=>s+(Number(e.cr)||0),0);
  const balanced = Math.abs(dr-cr) < 0.005 && dr > 0;
  const el = document.querySelector('.totals-line');
  if(el){
    el.className = 'totals-line ' + (balanced?'balanced':'unbalanced');
    el.innerHTML = `<span>Dr ₹${fmt(dr)}</span><span>Cr ₹${fmt(cr)}</span><span>${balanced?'Balanced ✓':'Not balanced'}</span>`;
  }
  const saveBtn = document.getElementById('saveVoucher');
  if(saveBtn) saveBtn.disabled = !balanced;
}

/* ---------------- init ----------------
   Companies and accounts now live in Firestore, which requires a signed-in user — so nothing is
   fetched here. The app always starts at the login screen (matching how it always worked, even
   before real accounts existed); ensureSkDemoCompany()/loadCompanies() run right after a successful
   login or admin login instead, once there's a Firebase Auth session to read/write with. */
// Client-side "system health" — there's no server here to log to, so real JS errors real users
// hit are captured client-side and written (best-effort) to Firestore's errorLog collection,
// where the Admin Panel's Settings tab surfaces the most recent 100. Never throws itself.
window.addEventListener('error', (e)=>{
  try{ logClientError(e.message, e.error && e.error.stack); }catch(err){}
});
window.addEventListener('unhandledrejection', (e)=>{
  try{ logClientError('Unhandled promise rejection: ' + (e.reason && e.reason.message || e.reason), e.reason && e.reason.stack); }catch(err){}
});

(async function init(){
  try{ const n = await window.storage.get('lastUsername'); lastUsername = n ? n.value : ''; }catch(e){ lastUsername = ''; }
  authMode = 'login';
  screen = 'landing'; // a fresh visit lands on the marketing/intro page, not straight at the form
  if(fbAuth.isSignInWithEmailLink(window.location.href)){
    // Landed here from the "Verify Email" link — finish the passwordless sign-in before anything
    // else, and skip the landing page: this is a returning, mid-signup visit, not a fresh one.
    screen = 'login';
    await handleEmailLinkReturn();
  }else{
    // Not a link click — but if a signup was left mid-flight (link sent, not yet opened), resume
    // showing that "check your inbox" state instead of the landing page.
    const draft = await loadPendingSignupDraft();
    if(draft){
      authDraft = { name:draft.name||'', username:draft.username||'', mobile:draft.mobile||'', email:draft.email||'' };
      authMode = 'signup';
      pendingVerifyEmail = draft.email||'';
      verifyLinkAwaiting = true;
      screen = 'login';
    }
  }
  if(screen==='landing') renderLanding(); else renderLogin();
  try{
    const rootSnap = { isRoot:true, screen, view:null, authMode: screen==='login' ? authMode : null, companyId:null };
    history.replaceState(rootSnap, '', location.href);
    history.pushState(rootSnap, '', location.href);
  }catch(e){}
})();
</script>
