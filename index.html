  document.getElementById('landingLoginBtn')?.addEventListener('click', ()=>goToLogin('login'));
  document.getElementById('landingHeroLoginBtn')?.addEventListener('click', ()=>goToLogin('login'));
  document.getElementById('landingSignupBtn')?.addEventListener('click', ()=>goToLogin('signup'));
  document.getElementById('landingHeroSignupBtn')?.addEventListener('click', ()=>goToLogin('signup'));
  document.getElementById('landingCtaBtn')?.addEventListener('click', ()=>goToLogin('signup'));
}

/* ---------------- Login — welcome screen shown before Company Info ---------------- */
function renderLogin(){
  const app = document.getElementById('app');
  const isSignup = authMode==='signup';
  const pwType = authShowPassword ? 'text' : 'password';
  const verifyLinkCooldownActive = Date.now() < verifyLinkCooldownUntil;
  const verifyBtnLabel = verifyLinkSending ? 'Sending…' : (verifyLinkAwaiting ? (verifyLinkCooldownActive ? 'Sent ✓' : 'Resend Link') : 'Verify Email');
  const verifyBtnDisabled = verifyLinkSending || (verifyLinkAwaiting && verifyLinkCooldownActive);
  app.innerHTML = `
    <div class="rb-bg">
      <span class="rb-letter rb-letter-r">R</span>
      <span class="rb-letter rb-letter-b">B</span>
      <div class="rb-content">
        <div class="titlebar">
          <span id="backToLandingLink" style="cursor:pointer;">← The Reckoning Books by SKm</span>
          <span class="winbtns"><span>_</span><span>▢</span><span>✕</span></span>
        </div>
        <div class="login-shell">
          <div class="login-card">
            <div class="login-logo">RB</div>
            <h1>The Reckoning Books</h1>
            <div class="login-by">by SKm</div>
            <p class="login-tagline">${isSignup ? 'Create your account to start keeping the books.' : 'Log in to continue.'}</p>

            ${isSignup ? (pendingVerifyUser ? `
            <div style="background:var(--surface-strong);border:1px solid var(--border);border-radius:8px;padding:10px 12px;">
              <div style="font-size:12.5px;font-weight:600;">${escapeHtml(authDraft.name||'')}</div>
              <div class="muted" style="font-size:11.5px;">@${escapeHtml(authDraft.username||'')} · ${escapeHtml(authDraft.email||'')} · <span style="color:var(--accent1);">✓ Verified</span></div>
            </div>
            <p style="margin:6px 0 0;"><a id="signupStartOverLink" style="font-size:12px;cursor:pointer;color:var(--accent1);text-decoration:underline;">Not you? Start over</a></p>

            <label style="margin-top:12px;">Password</label>
            <div class="pw-field-wrap">
              <input type="${pwType}" id="authPassword" placeholder="Create a password" autocomplete="new-password">
              <button type="button" class="pw-toggle" id="authTogglePw">${authShowPassword?'Hide':'Show'}</button>
            </div>
            <label style="margin-top:12px;">Confirm Password</label>
            <input type="${pwType}" id="authConfirmPassword" placeholder="Re-enter password" autocomplete="new-password">

            ${authError ? `<p class="auth-error">${escapeHtml(authError)}</p>` : ''}

            <button class="btn" id="authSubmitBtn" type="button" style="width:100%;margin-top:16px;">Create Account →</button>
            ` : `
            <label>Full Name</label>
            <input type="text" id="authName" placeholder="e.g. Santhosh Kumar" value="${escapeAttr(authDraft.name)}" autocomplete="name" ${verifyLinkAwaiting?'disabled':''}>
            <label style="margin-top:12px;">Username</label>
            <input type="text" id="authUsername" placeholder="Choose a username" value="${escapeAttr(authDraft.username)}" autocomplete="username" ${verifyLinkAwaiting?'disabled':''}>
            <label style="margin-top:12px;">Mobile Number</label>
            <input type="tel" id="authMobile" placeholder="10-digit mobile number" maxlength="10" inputmode="numeric" value="${escapeAttr(authDraft.mobile)}" autocomplete="tel" ${verifyLinkAwaiting?'disabled':''}>
            <label style="margin-top:12px;">Email</label>
            <input type="email" id="authEmail" placeholder="you@example.com" value="${escapeAttr(authDraft.email)}" autocomplete="email" ${verifyLinkAwaiting?'disabled':''}>

            ${verifyLinkAwaiting ? `
            <div style="background:var(--surface-strong);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:12px;">
              We sent a verification link to <strong>${escapeHtml(authDraft.email)}</strong>. Open it on this device to continue — this tab will pick up automatically once you do.
            </div>
            ` : ''}
            ${verifyLinkNotice ? `<p style="font-size:12px;color:var(--accent1);margin:6px 0 0;">${escapeHtml(verifyLinkNotice)}</p>` : ''}
            ${verifyLinkError ? `<p class="auth-error" style="margin:6px 0 0;">${escapeHtml(verifyLinkError)}</p>` : ''}
            ${authError ? `<p class="auth-error">${escapeHtml(authError)}</p>` : ''}

            <button class="btn" id="verifyEmailBtn" type="button" style="width:100%;margin-top:16px;" ${verifyBtnDisabled?'disabled':''}>${verifyBtnLabel}</button>
            ${verifyLinkAwaiting ? `<p style="margin:8px 0 0;text-align:center;"><a id="signupUseDifferentEmailLink" style="font-size:12px;cursor:pointer;color:var(--accent1);text-decoration:underline;">Use a different email</a></p>` : ''}
            `) : `
            <label>Username</label>
            <input type="text" id="authUsername" placeholder="Your username" value="${escapeAttr(authDraft.username || lastUsername)}" autocomplete="username">

            <label style="margin-top:12px;">Password</label>
            <div class="pw-field-wrap">
              <input type="${pwType}" id="authPassword" placeholder="Your password" autocomplete="current-password">
              <button type="button" class="pw-toggle" id="authTogglePw">${authShowPassword?'Hide':'Show'}</button>
            </div>
            <p style="text-align:right;margin:6px 0 0;"><a id="forgotPasswordLink" style="font-size:12px;cursor:pointer;color:var(--accent1);text-decoration:underline;">Forgot password?</a></p>

            ${authError ? `<p class="auth-error">${escapeHtml(authError)}</p>` : ''}

            <button class="btn" id="authSubmitBtn" type="button" style="width:100%;margin-top:16px;">Log In →</button>
            `}

            <p class="auth-toggle-line">${isSignup ? 'Already have an account?' : 'New here?'} <a id="authToggleModeLink">${isSignup?'Log in':'Create one'}</a></p>
          </div>
          <div class="login-footer">Built by <strong>Santhosh Kumar M</strong> — <em>Accounting at the speed of business</em></div>
        </div>
      </div>
      ${forgotPasswordOpen ? `
      <div class="modal-overlay" id="forgotOverlayBg">
        <div class="modal-card" style="width:360px;">
          <div class="panel-head"><h2>Reset Password</h2><button class="btn secondary small" id="forgotDialogClose" type="button">✕</button></div>
          <div class="panel-body">
            ${forgotPasswordSent ? `
            <p class="muted" style="font-size:12.5px;margin-top:0;">If an account exists with that username, a password reset link has been sent to its registered email. Check your inbox (and spam folder).</p>
            <button class="btn" id="forgotDialogDone" type="button" style="width:100%;margin-top:6px;">Done</button>
            ` : `
            <p class="muted" style="font-size:12.5px;margin-top:0;">Enter your username and we'll email a reset link to the address on that account.</p>
            <label>Username</label>
            <input type="text" id="forgotUsernameInput" placeholder="Your username" autocomplete="username">
            ${forgotPasswordError ? `<p class="auth-error">${escapeHtml(forgotPasswordError)}</p>` : ''}
            <button class="btn" id="forgotPasswordSubmit" type="button" style="width:100%;margin-top:14px;">Send Reset Link →</button>
            `}
          </div>
        </div>
      </div>
      ` : ''}
    </div>
  `;

  const submitAuth = async ()=>{
    authError = '';
    const password = document.getElementById('authPassword').value || '';
    const submitBtn = document.getElementById('authSubmitBtn');
    if(isSignup){
      // Step 2 only — by the time this button exists at all, the email is already verified
      // (pendingVerifyUser) and name/username/mobile/email already live in authDraft from step 1.
      if(!pendingVerifyUser){ authError = 'Please verify your email first.'; renderLogin(); return; }
      const { name, username, mobile, email } = authDraft;
      const confirm = document.getElementById('authConfirmPassword').value || '';
      if(!name || !username || !mobile || !email){ authError = 'Some of your details were lost — please start over.'; renderLogin(); return; }
      if(!password){ authError = 'Please create a password.'; renderLogin(); return; }
      if(password.length<6){ authError = 'Password must be at least 6 characters.'; renderLogin(); return; }
      if(password!==confirm){ authError = 'Passwords do not match.'; renderLogin(); return; }
      submitBtn.disabled = true;
      const usernameKey = username.toLowerCase();
      try{
        const takenDoc = await db.collection('usernames').doc(usernameKey).get();
        if(takenDoc.exists){ authError = 'That username is already taken — please go back and choose another.'; submitBtn.disabled = false; renderLogin(); return; }
        // The account already exists (created passwordlessly via the email link). Firebase treats
        // the email-link sign-in as already having the "password" provider linked (it's the same
        // provider ID as email/password, just without a password set yet) — so linkWithCredential
        // here would always fail with auth/provider-already-linked. Setting the password directly
        // on the existing identity is the correct call in this situation.
        await pendingVerifyUser.updatePassword(password);
        const profile = { id: pendingVerifyUser.uid, name, username, usernameLower: usernameKey, mobile, email, role:'user', plan:'free', planExpiry:null, createdAt: new Date().toISOString(), lastLoginAt: new Date().toISOString() };
        await db.collection('users').doc(pendingVerifyUser.uid).set(profile);
        await db.collection('usernames').doc(usernameKey).set({ email });
        lastUsername = username;
        currentUser = { id: pendingVerifyUser.uid, name, username, isAdmin:false, role:'user', plan:'free', planExpiry:null };
        authDraft = { name:'', username:'', mobile:'', email:'' };
        pendingVerifyUser = null; pendingVerifyEmail = ''; verifyLinkAwaiting = false; verifyLinkCooldownUntil = 0;
        verifyLinkNotice = ''; verifyLinkError = '';
        await clearPendingSignupDraft();
        try{ await window.storage.set('lastUsername', lastUsername); }catch(e){}
        await ensureSkDemoCompany();
        await loadCompanies();
        await loadAnnouncementForUser();
        await loadFeatureFlags();
        logAudit('account_created', `New account @${username}`, currentUser.id, name);
        startForceLogoutPoll();
        startTicketUpdatePoll();
        screen = 'gateway';
        renderGateway();
        pushHistory();
      }catch(err){
        authError = authErrorMessage(err, true);
        submitBtn.disabled = false;
        renderLogin();
      }
    }else{
      const username = (document.getElementById('authUsername').value||'').trim();
      authDraft.username = username;
      if(!username || !password){ authError = 'Enter your username and password.'; renderLogin(); return; }
      submitBtn.disabled = true;
      // Hidden admin bypass: no admin-login control appears anywhere in the UI — typing this
      // exact username + the admin master password into the regular Login form is the only way in.
      if(username.toLowerCase()===ADMIN_BACKDOOR_USERNAME && password===ADMIN_MASTER_PASSWORD){
        const adminEmail = usernameToEmail('admin');
        try{
          let cred;
          try{
            cred = await fbAuth.signInWithEmailAndPassword(adminEmail, ADMIN_MASTER_PASSWORD);
          }catch(err){
            if(err.code==='auth/user-not-found' || err.code==='auth/invalid-credential'){
              cred = await fbAuth.createUserWithEmailAndPassword(adminEmail, ADMIN_MASTER_PASSWORD);
            }else{
              throw err;
            }
          }
          await db.collection('users').doc(cred.user.uid).set({ id: cred.user.uid, name:'Administrator', username:'admin', usernameLower:'admin', role:'admin', createdAt: new Date().toISOString(), lastLoginAt: new Date().toISOString() }, {merge:true});
          currentUser = { id: cred.user.uid, name:'Administrator', username:'admin', isAdmin:true, role:'admin' };
          authDraft = { name:'', username:'', mobile:'', email:'' };
          // Admin login also retires the old shared "Demo Company (Sample Data)" doc globally —
          // only an admin has delete rights on an ownerless company per the Firestore rules, so
          // this is the one login path that can actually make co_demo disappear for everyone.
          await Promise.all([ensureSkDemoCompany(), retireOldDemoCompany()]);
          await loadCompanies();
          await loadFeatureFlags();
          logAudit('admin_login', 'Logged in via the admin backdoor', cred.user.uid, 'Administrator');
          screen = 'gateway';
          renderGateway();
          pushHistory();
        }catch(err){
          authError = authErrorMessage(err, false);
          submitBtn.disabled = false;
          renderLogin();
        }
        return;
      }
      try{
        const lookupDoc = await db.collection('usernames').doc(username.toLowerCase()).get();
        if(!lookupDoc.exists){
          authError = 'No account found with that username.';
          submitBtn.disabled = false; renderLogin();
          logAudit('login_failed', `No account found for username "${username}"`, null, username);
          return;
        }
        const { email } = lookupDoc.data();
        const cred = await fbAuth.signInWithEmailAndPassword(email, password);
        const profDoc = await db.collection('users').doc(cred.user.uid).get();
        const profile = profDoc.exists ? profDoc.data() : { name: username, username, role:'user' };
        if(profile.blocked){
          await fbAuth.signOut();
          authError = 'This account has been blocked. Please contact the administrator.';
          submitBtn.disabled = false;
          renderLogin();
          return;
        }
        const role = profile.role==='admin' ? 'admin' : (profile.role==='support' ? 'support' : 'user');
        currentUser = { id: cred.user.uid, name: profile.name || username, username: profile.username || username, isAdmin: role==='admin' || role==='support', role, plan: profile.plan||'free', planExpiry: profile.planExpiry||null };
        lastUsername = username;
        authDraft = { name:'', username:'', mobile:'', email:'' };
        try{ await window.storage.set('lastUsername', lastUsername); }catch(e){}
        try{ await db.collection('users').doc(cred.user.uid).update({ lastLoginAt: new Date().toISOString() }); }catch(e){}
        await ensureSkDemoCompany();
        await loadCompanies();
        await loadAnnouncementForUser();
        await loadFeatureFlags();
        logAudit('login', '', cred.user.uid, currentUser.name);
        startForceLogoutPoll();
        startTicketUpdatePoll();
        screen = 'gateway';
        renderGateway();
        pushHistory();
      }catch(err){
        authError = authErrorMessage(err, false);
        logAudit('login_failed', `Failed login attempt for username "${username}" (${err && err.code ? err.code : 'error'})`, null, username);
        submitBtn.disabled = false;
        renderLogin();
      }
    }
  };

  document.getElementById('authSubmitBtn')?.addEventListener('click', submitAuth);
  const onVerifyEmailClick = async ()=>{
    const name = (document.getElementById('authName').value||'').trim();
    const username = (document.getElementById('authUsername').value||'').trim();
    const mobile = (document.getElementById('authMobile').value||'').trim();
    const email = (document.getElementById('authEmail').value||'').trim();
    authDraft.name = name; authDraft.username = username; authDraft.mobile = mobile; authDraft.email = email;
    authError = ''; verifyLinkError = ''; verifyLinkNotice = '';

    // Resend on an already-awaiting, unchanged email — no need to re-validate the whole form again.
    if(verifyLinkAwaiting && pendingVerifyEmail===email){
      if(verifyLinkSending || Date.now()<verifyLinkCooldownUntil) return;
      verifyLinkSending = true;
      renderLogin();
      try{
        await fbAuth.sendSignInLinkToEmail(email, { url: signupLinkUrl(), handleCodeInApp: true });
        await savePendingSignupDraft({ name, username, mobile, email });
        verifyLinkNotice = 'Verification link resent — check your inbox (and spam folder).';
        verifyLinkCooldownUntil = Date.now() + 30000;
      }catch(err){
        verifyLinkError = authErrorMessage(err, true);
      }
      verifyLinkSending = false;
      renderLogin();
      return;
    }

    // Fresh send: validate the contact details first (no password involved at this stage at all).
    if(!name || !username || !mobile || !email){ authError = 'Please fill in your name, username, mobile number and email.'; renderLogin(); return; }
    if(!isValidUsername(username)){ authError = 'Username can only contain letters, numbers, dots, dashes and underscores.'; renderLogin(); return; }
    if(!isValidMobile(mobile)){ authError = 'Mobile number must be exactly 10 digits.'; renderLogin(); return; }
    if(!isValidEmail(email)){ authError = 'Please enter a valid email address.'; renderLogin(); return; }
    if(verifyLinkSending) return;
    verifyLinkSending = true;
    renderLogin();
    try{
      const usernameKey = username.toLowerCase();
      const takenDoc = await db.collection('usernames').doc(usernameKey).get();
      if(takenDoc.exists){ throw Object.assign(new Error('That username is already taken.'), { code:'auth/username-taken' }); }
      await fbAuth.sendSignInLinkToEmail(email, { url: signupLinkUrl(), handleCodeInApp: true });
      await savePendingSignupDraft({ name, username, mobile, email });
      pendingVerifyEmail = email;
      verifyLinkAwaiting = true;
      verifyLinkCooldownUntil = Date.now() + 30000;
      verifyLinkNotice = 'Verification link sent — open it on this device, then this tab will pick up automatically.';
      verifyLinkError = '';
    }catch(err){
      verifyLinkNotice = '';
      verifyLinkError = err.code==='auth/username-taken' ? err.message : authErrorMessage(err, true);
    }
    verifyLinkSending = false;
    renderLogin();
  };
  document.getElementById('verifyEmailBtn')?.addEventListener('click', onVerifyEmailClick);
  ['authName','authUsername','authMobile','authEmail'].forEach(id=>{
    document.getElementById(id)?.addEventListener('keydown', (e)=>{ if(e.key==='Enter') onVerifyEmailClick(); });
  });
  ['authPassword','authConfirmPassword'].forEach(id=>{
    document.getElementById(id)?.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitAuth(); });
  });
  const resetSignupFlow = async ()=>{
    if(pendingVerifyUser){ try{ await fbAuth.signOut(); }catch(e){} }
    pendingVerifyUser = null; pendingVerifyEmail = ''; verifyLinkAwaiting = false; verifyLinkCooldownUntil = 0;
    verifyLinkNotice = ''; verifyLinkError = '';
    authDraft = { name:'', username:'', mobile:'', email:'' };
    await clearPendingSignupDraft();
  };
  document.getElementById('authToggleModeLink')?.addEventListener('click', async ()=>{
    const goingToSignup = !isSignup;
    authError = '';
    await resetSignupFlow();
    authMode = goingToSignup ? 'signup' : 'login';
    renderLogin();
  });
  document.getElementById('backToLandingLink')?.addEventListener('click', ()=>{
    screen = 'landing';
    authError = '';
    renderLanding();
    pushHistory();
  });
  document.getElementById('signupStartOverLink')?.addEventListener('click', async ()=>{
    await resetSignupFlow();
    renderLogin();
  });
  document.getElementById('signupUseDifferentEmailLink')?.addEventListener('click', async ()=>{
    const draft = { name: authDraft.name, username: authDraft.username, mobile: authDraft.mobile };
    verifyLinkAwaiting = false; pendingVerifyEmail = ''; verifyLinkCooldownUntil = 0;
    verifyLinkNotice = ''; verifyLinkError = '';
    authDraft = { ...draft, email:'' };
    await clearPendingSignupDraft();
    renderLogin();
    document.getElementById('authEmail')?.focus();
  });
  document.getElementById('authTogglePw')?.addEventListener('click', ()=>{
    authShowPassword = !authShowPassword;
    renderLogin();
  });
  document.getElementById('authMobile')?.addEventListener('input', (e)=>{
    e.target.value = e.target.value.replace(/\D/g,'').slice(0,10);
  });

  document.getElementById('forgotPasswordLink')?.addEventListener('click', ()=>{
    forgotPasswordOpen = true;
    forgotPasswordError = '';
    forgotPasswordSent = false;
    renderLogin();
  });
  const closeForgotDialog = ()=>{
    forgotPasswordOpen = false;
    forgotPasswordError = '';
    forgotPasswordSent = false;
    renderLogin();
  };
  document.getElementById('forgotDialogClose')?.addEventListener('click', closeForgotDialog);
  document.getElementById('forgotDialogDone')?.addEventListener('click', closeForgotDialog);
  document.getElementById('forgotOverlayBg')?.addEventListener('click', (e)=>{
    if(e.target.id==='forgotOverlayBg') closeForgotDialog();
  });
  const submitForgotPassword = async ()=>{
    const username = (document.getElementById('forgotUsernameInput').value||'').trim();
    if(!username){ forgotPasswordError = 'Enter your username.'; renderLogin(); return; }
    const submitBtn = document.getElementById('forgotPasswordSubmit');
    submitBtn.disabled = true;
    try{
      const doc = await db.collection('usernames').doc(username.toLowerCase()).get();
      if(doc.exists){
        try{ await fbAuth.sendPasswordResetEmail(doc.data().email); }catch(e){}
      }
      // Same message whether or not the username exists, so this can't be used to check
      // which usernames are registered.
      forgotPasswordSent = true;
      forgotPasswordError = '';
      renderLogin();
    }catch(err){
      forgotPasswordError = 'Could not send the reset email. Please try again.';
      renderLogin();
    }
  };
  document.getElementById('forgotPasswordSubmit')?.addEventListener('click', submitForgotPassword);
  document.getElementById('forgotUsernameInput')?.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitForgotPassword(); });

  if(forgotPasswordOpen){
    document.getElementById('forgotUsernameInput')?.focus();
  }else{
    const firstField = isSignup
      ? document.getElementById('authName')
      : (lastUsername ? document.getElementById('authPassword') : document.getElementById('authUsername'));
    firstField?.focus();
  }
}

          }
          selectedUserIds = {};
          toast(`${uids.length} account${uids.length===1?'':'s'} ${nextBlocked?'blocked':'unblocked'}`);
          renderGateway();
        }catch(err){
          console.error('Bulk status update failed:', err);
          toast('Could not update those accounts — ' + (err && (err.code || err.message) || 'unknown error'));
          el.disabled = false;
        }
      });
    });
    document.querySelectorAll('[data-bulk-delete]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        if(!isFullAdmin()){ toast('Only a full Administrator can delete accounts.'); return; }
        const uids = Object.keys(selectedUserIds).filter(id=>selectedUserIds[id] && !(currentUser && id===currentUser.id));
        if(!uids.length) return;
        const targets = uids.map(uid=>users.find(x=>x.id===uid)).filter(Boolean);
        const totalCompanies = targets.reduce((s,u)=>s+companies.filter(c=>c.ownerId===u.id).length, 0);
        const ok = window.confirm(
          `Delete ${targets.length} account${targets.length===1?'':'s'}?\n\n`+
          `This permanently deletes their profiles and frees up their usernames, along with `+
          `${totalCompanies} compan${totalCompanies===1?'y':'ies'} they own and all its ledgers/vouchers.\n\n`+
          `This cannot be undone.`
        );
        if(!ok) return;
        el.disabled = true;
        try{
          for(const u of targets){
            const ownedCompanies = companies.filter(c=>c.ownerId===u.id);
            for(const c of ownedCompanies){
              await db.collection('companies').doc(c.id).delete();
            }
            if(u.usernameLower){
              try{ await db.collection('usernames').doc(u.usernameLower).delete(); }catch(e){}
            }
            await db.collection('users').doc(u.id).delete();
            users = users.filter(x=>x.id!==u.id);
            companies = companies.filter(c=>c.ownerId!==u.id);
            await logAudit('account_deleted', `Deleted account @${u.username} and ${ownedCompanies.length} compan${ownedCompanies.length===1?'y':'ies'} (bulk action)`, u.id, u.name);
          }
          selectedUserIds = {};
          toast(`${targets.length} account${targets.length===1?'':'s'} deleted`);
          renderGateway();
        }catch(err){
          console.error('Bulk delete failed:', err);
          toast('Could not delete those accounts — ' + (err && (err.code || err.message) || 'unknown error'));
          el.disabled = false;
        }
      });
    });
    document.querySelectorAll('[data-view-user-detail]').forEach(el=>{
      el.addEventListener('click', ()=>{
        adminUserDetailId = el.dataset.viewUserDetail;
        renderGateway();
      });
    });
  }
  if(modal==='adminPanel' && adminUserDetailId){
    document.getElementById('userDetailOverlayBg')?.addEventListener('click', (e)=>{
      if(e.target.id==='userDetailOverlayBg'){ adminUserDetailId = null; renderGateway(); }
    });
    document.getElementById('userDetailClose')?.addEventListener('click', ()=>{
      adminUserDetailId = null;
      renderGateway();
    });
  }
  if(modal==='adminPanel' && adminTab==='companies'){
    document.getElementById('adminCompanySearchInput')?.addEventListener('input', (e)=>{
      adminCompanySearch = e.target.value;
      const caret = e.target.selectionStart;
      renderGateway();
      const el = document.getElementById('adminCompanySearchInput');
      if(el){ el.focus(); try{ el.setSelectionRange(caret, caret); }catch(err){} }
    });
    document.querySelectorAll('[data-view-company]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        const cid = el.dataset.viewCompany;
        const c = companies.find(x=>x.id===cid);
        if(!c) return;
        await logAudit('company_viewed', `Opened "${c.name}" in read-only View mode`, cid, c.name);
        await enterCompanyApp(c, {adminViewOnly:true});
      });
    });
    document.querySelectorAll('[data-export-company]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const cid = el.dataset.exportCompany;
        const c = companies.find(x=>x.id===cid);
        if(!c) return;
        const ok = exportCompanyDataJSON(c);
        toast(ok ? 'Export downloaded' : 'Could not export that company');
      });
    });
    document.querySelectorAll('[data-reassign-company]').forEach(el=>{
      el.addEventListener('click', ()=>{
        reassigningCompanyId = el.dataset.reassignCompany;
        renderGateway();
      });
    });
    document.getElementById('cancelReassignBtn')?.addEventListener('click', ()=>{
      reassigningCompanyId = null;
      renderGateway();
    });
    document.querySelectorAll('[data-confirm-reassign]').forEach(el=>{
      el.addEventListener('click', async ()=>{
        if(!isFullAdmin()) return;
        const cid = el.dataset.confirmReassign;
        const c = companies.find(x=>x.id===cid);
        const select = document.querySelector(`[data-reassign-select="${cid}"]`);
        if(!c || !select) return;
        const newOwnerId = select.value;
        const newOwner = users.find(x=>x.id===newOwnerId);
        if(!newOwner) return;
        const ok = window.confirm(`Reassign "${c.name}" to ${newOwner.name} (@${newOwner.username})?`);
        if(!ok) return;
        el.disabled = true;
        try{
          await db.collection('companies').doc(cid).set({ ownerId: newOwnerId }, {merge:true});
          c.ownerId = newOwnerId;
          reassigningCompanyId = null;
          await logAudit('company_reassigned', `Reassigned "${c.name}" to @${newOwner.username}`, cid, c.name);
          toast('Company reassigned');
          renderGateway();
        }catch(err){
          console.error('Reassign company failed:', err);
          toast('Could not reassign that company — ' + (err && (err.code || err.message) || 'unknown error'));
          el.disabled = false;
        }
      });
    });
  }
  if(modal==='adminPanel' && adminTab==='analytics'){
    document.getElementById('adminAnalyticsRangeSelect')?.addEventListener('change', (e)=>{
      adminAnalyticsRangeDays = Number(e.target.value);
      renderGateway();
    });
    wireVizInteractivity();
  }
  if(modal==='adminPanel' && adminTab==='support'){
    document.getElementById('ticketStatusFilterSelect')?.addEventListener('change', (e)=>{
      ticketStatusFilter = e.target.value;
      renderGateway();
    });
    document.querySelectorAll('[data-ticket-status]').forEach(el=>{
      el.addEventListener('change', async ()=>{
        const tid = el.dataset.ticketStatus;
        const t = supportTickets.find(x=>x.id===tid);
        if(!t) return;
        const nextStatus = el.value;
        try{
          await db.collection('supportTickets').doc(tid).set({ status: nextStatus, updatedAt: new Date().toISOString(), seenByUser: false }, {merge:true});
          t.status = nextStatus;
          t.seenByUser = false;
          await logAudit('ticket_status_changed', `Set ticket "${t.subject}" to ${nextStatus}`, t.userId, t.userName);
          toast('Ticket updated');
          renderGateway();

          console.error('Update ticket failed:', err);
          toast('Could not update that ticket — ' + (err && (err.code || err.message) || 'unknown error'));
        }
      });
    });
    document.querySelectorAll('[data-edit-ticket-note]').forEach(el=>{

      renderGateway();

    document.querySelectorAll('[data-save-ticket-note]').forEach(el=>{

        const noteInput = document.querySelector(`[data-ticket-note="${tid}"]`);

        el.disabled = true;
        try{
          await db.collection('supportTickets').doc(tid).set({ adminNote: note, updatedAt: new Date().toISOString(), seenByUser: false }, {merge:true});
          t.adminNote = note;
          t.seenByUser = false;
          editingTicketId = null;
          toast('Note saved');
          renderGateway();
        }catch(err){
          console.error('Save ticket note failed:', err);
          toast('Could not save that note — ' + (err && (err.code || err.message) || 'unknown error'));
          el.disabled = false;
        }
      });
    });

  if(modal==='adminPanel' && adminTab==='settings'){

      const reconcileRequiresPaid = document.getElementById('flagReconcile').checked;
      const btn = document.getElementById('saveFeatureFlagsBtn');
      btn.disabled = true;
      try{
        await db.collection('settings').doc('featureFlags').set({ inventoryRequiresPaid, importRequiresPaid, reconcileRequiresPaid, updatedAt: new Date().toISOString() }, {merge:true});
        featureFlags = { inventoryRequiresPaid, importRequiresPaid, reconcileRequiresPaid };
        featureFlagsDraft = { ...featureFlags };
        await logAudit('feature_flags_updated', `Inventory paid-gated: ${inventoryRequiresPaid}, Import paid-gated: ${importRequiresPaid}, Reconcile paid-gated: ${reconcileRequiresPaid}`);
        toast('Feature flags saved');
        renderGateway();
      }catch(err){
        console.error('Save feature flags failed:', err);
        toast('Could not save feature flags — ' + (err && (err.code || err.message) || 'unknown error'));
        btn.disabled = false;
      }
    });
    document.getElementById('exportAllDataBtn')?.addEventListener('click', async ()=>{
      const btn = document.getElementById('exportAllDataBtn');
      btn.disabled = true; btn.textContent = 'Exporting…';

      toast('Export downloaded');
    });
    document.querySelectorAll('[data-dismiss-error]').forEach(el=>{
      el.addEventListener('click', async ()=>{

    });
    document.getElementById('copyFirestoreRulesBtn')?.addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(RECOMMENDED_FIRESTORE_RULES);
        toast('Rules copied to clipboard');
      }catch(err){
        // Clipboard API can be blocked (no HTTPS, permissions, etc.) — fall back to a text selection.
        const pre = document.getElementById('firestoreRulesBlock');
        if(pre){
          const range = document.createRange();
          range.selectNodeContents(pre);
          const sel = window.getSelection();
          sel.removeAllRanges(); sel.addRange(range);
          toast('Could not auto-copy — text selected, press Ctrl/Cmd+C');
        } else {
          toast('Could not copy the rules');
        }
      }
    });
  }
  if(modal==='adminPanel' && adminTab==='auditLog'){
    document.getElementById('adminAuditSearchInput')?.addEventListener('input', (e)=>{
      adminAuditSearch = e.target.value;
      const caret = e.target.selectionStart;

// Reference-only — shown (with a copy button) on the Settings tab. This app talks to Firestore
// directly from the browser via the client SDK, which has no API to deploy security rules, so this
// is never applied automatically; an admin has to paste it into the Firebase Console themselves.
const RECOMMENDED_FIRESTORE_RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function isSignedIn() { return request.auth != null; }
    function isOwnerUid(uid) { return isSignedIn() && request.auth.uid == uid; }
    function myRole() { return isSignedIn() ? get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role : null; }
    function isSupportOrAdmin() { return myRole() == 'support' || myRole() == 'admin'; }
    function isAdmin() { return myRole() == 'admin'; }

    match /users/{uid} {
      allow read: if isOwnerUid(uid) || isSupportOrAdmin();
      allow create: if isOwnerUid(uid);
      allow update: if isOwnerUid(uid) || isAdmin();
      allow delete: if isAdmin();
    }
    match /usernames/{name} {
      allow read, write: if isSignedIn();
    }
    match /companies/{cid} {
      allow read: if isSignedIn() && (resource.data.ownerId == request.auth.uid || isSupportOrAdmin());
      allow create: if isSignedIn() && request.resource.data.ownerId == request.auth.uid;
      allow update, delete: if isSignedIn() && (resource.data.ownerId == request.auth.uid || isAdmin());
    }
    match /auditLog/{id} {
      allow read, create: if isSupportOrAdmin();
      allow update, delete: if false;
    }
    match /errorLog/{id} {
      allow read, delete: if isSupportOrAdmin();
      allow create: if isSignedIn();
      allow update: if false;
    }
    match /supportTickets/{id} {
      allow read: if isSupportOrAdmin() || (isSignedIn() && resource.data.userId == request.auth.uid);
      allow create: if isSignedIn() && request.resource.data.userId == request.auth.uid;
      // The ticket's own user may only flip seenByUser (to dismiss the "updated" badge once they've
      // viewed it) — every other field, including status and adminNote, stays support/admin-only.

}`;

function adminFilteredSortedUsers(){

      (u.mobile||'').toLowerCase().includes(q)

/* ============================================================================================
   Interactive Dashboard Visuals — Power BI–style charts shown alongside the two cards above.
   Every figure here is derived from the SAME data functions the Reports tab and the cards above
   already rely on (incomeStatementData(), balanceSheetIFRSData(), ratioAnalysisData(),
   scheduleIIIProfitLossData()) — nothing is computed twice with different logic — so a number
   shown in a chart always matches the number you land on after drilling into it. Every chart is
   hand-drawn inline SVG (this app has no charting library beyond Three.js for the two 3D bars
   above) with three interaction layers, wired by wireVizInteractivity() below:
     1. Hover tooltip on every mark  — any element carrying data-tip-title/value/[sub/color].
     2. Click-through to detail      — data-open-detail (reuses the existing *DetailModal
                                        functions), or data-ledger-detail (reuses the existing
                                        per-ledger statement modal, e.g. from the Reports tab).
     3. Clickable legends            — data-viz-toggle hides/shows one series, like clicking a
                                        Power BI legend entry.
   ============================================================================================ */
// A validated (colorblind-safe, run through this app's dataviz palette checker), already-in-use
// categorical order — the first five entries of the existing PIE_COLORS palette (see
// ledgerTypeBreakdown's pie chart above) — reused here so every chart on the Dashboard, old and
// new, draws from one consistent set of category colors.
const VIZ_COLORS = ['#2CA01C','#4F8EF7','#F2994A','#A78BFA','#D64545'];

function fmtShort(n){
  const v = Math.abs(n)||0;
  if(v>=10000000) return (v/10000000).toFixed(v>=100000000?0:1)+'Cr';
  if(v>=100000) return (v/100000).toFixed(v>=1000000?0:1)+'L';
  if(v>=1000) return (v/1000).toFixed(1)+'k';
  return Math.round(v).toString();
}
function shortenLabel(s, maxChars){
  maxChars = maxChars || 16;
  if(maxChars<4) maxChars=4;
  return (s||'').length>maxChars ? s.slice(0,maxChars-1)+'…' : (s||'');
}
// Wraps a category label onto up to 2 lines at the word-split that best balances line lengths
// (rather than one long truncated line) — used for the Waterfall chart's per-bar labels, which sit
// in narrow, evenly-spaced columns where a single long line would run into its neighbors.
function wrapLabel2(s, maxCharsPerLine){
  maxCharsPerLine = maxCharsPerLine || 10;
  const words = (s||'').split(' ');
  if(words.length===1) return [shortenLabel(s, maxCharsPerLine)];
  let best=null, bestScore=Infinity;
  for(let i=1;i<words.length;i++){
    const l1 = words.slice(0,i).join(' '), l2 = words.slice(i).join(' ');
    const score = Math.max(l1.length, l2.length);
    if(score<bestScore){ bestScore=score; best=[l1,l2]; }
  }
  return best.map(l=>shortenLabel(l, maxCharsPerLine));
}

/* ---------------- Tooltip layer (shared by every chart below) ----------------
   A single floating div, created lazily and reused across every hover — cheap enough to move on
   mousemove without going through this app's normal state-mutation + render() cycle, which is
   reserved for actual clicks (legend toggles, drill-through) below. */
function ensureChartTooltipEl(){
  let el = document.getElementById('chartTooltip');
  if(!el){ el = document.createElement('div'); el.id = 'chartTooltip'; document.body.appendChild(el); }
  return el;
}
function positionChartTooltip(evt){
  const el = document.getElementById('chartTooltip');
  if(!el) return;
  const pad = 14;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  const rect = el.getBoundingClientRect();
  if(x + rect.width > window.innerWidth - 8) x = evt.clientX - rect.width - pad;
  if(y + rect.height > window.innerHeight - 8) y = evt.clientY - rect.height - pad;
  if(x<4) x=4;
  if(y<4) y=4;
  el.style.left = x+'px';
  el.style.top = y+'px';
}
function showChartTooltipFor(el, evt){
  const tt = ensureChartTooltipEl();
  const title = el.getAttribute('data-tip-title')||'';
  const value = el.getAttribute('data-tip-value')||'';
  const sub = el.getAttribute('data-tip-sub')||'';
  const color = el.getAttribute('data-tip-color')||'';
  tt.innerHTML = `<div class="tt-title">${escapeHtml(title)}</div><div class="tt-row">${color?`<span class="tt-swatch" style="background:${color};"></span>`:''}<span>${escapeHtml(value)}</span></div>${sub?`<div class="tt-muted">${escapeHtml(sub)}</div>`:''}`;
  tt.classList.add('show');
  positionChartTooltip(evt);
}
function hideChartTooltip(){
  const el = document.getElementById('chartTooltip');
  if(el) el.classList.remove('show');
}
// Wires the three interaction layers described above onto whatever the dashboard just rendered.
// Called once after every dashboard render (see the view==='dashboard' wiring block) — independent
// of renderDashboardCharts(), which bails out early when Three.js hasn't loaded and would otherwise
// silently take these plain-SVG charts' interactivity down with it.
function wireVizInteractivity(){
  document.querySelectorAll('[data-tip-title]').forEach(el=>{
    el.addEventListener('mouseenter', e=>showChartTooltipFor(el, e));
    el.addEventListener('mousemove', positionChartTooltip);
    el.addEventListener('mouseleave', hideChartTooltip);
    el.addEventListener('focus', e=>showChartTooltipFor(el, {clientX:innerWidth/2, clientY:innerHeight/2}));
    el.addEventListener('blur', hideChartTooltip);
  });
  document.querySelectorAll('[data-open-detail]').forEach(el=>{
    el.addEventListener('click', ()=>{
      // A generic bridge for any modal that needs to know WHICH thing was clicked, not just that
      // something was — today only the Cash Flow bucket detail modal uses it (data-detail-arg
      // carries 'operating'/'investing'/'financing'), but any future data-open-detail modal can
      // read cfDetailBucket the same way without another purpose-built handler.
      if(el.dataset.detailArg) cfDetailBucket = el.dataset.detailArg;
      modal = el.dataset.openDetail; render();
    });
  });
  document.querySelectorAll('[data-ledger-detail]').forEach(el=>{
    el.addEventListener('click', ()=>{ ledgerDetailId = el.dataset.ledgerDetail; modal = 'ledgerDetail'; render(); });
  });
  document.querySelectorAll('[data-viz-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.dataset.vizToggle;
      dashVizHiddenSeries[key] = !dashVizHiddenSeries[key];
      render();
    });
  });
}
// A clickable (or, with opts.toggle===false, a plain informational) legend row — click toggles
// dashVizHiddenSeries[key] and re-renders, exactly like clicking a series off in a Power BI legend.
function vizLegend(items, opts){
  opts = opts||{};
  const toggle = opts.toggle !== false;
  return `<div class="viz-legend">${items.map(it=>{
    if(!toggle){
      return `<span class="viz-legend-item" style="cursor:default;"><span class="viz-legend-swatch ${it.dashed?'viz-line':''}" style="background:${it.color};"></span>${escapeHtml(it.label)}</span>`;
    }
    const off = dashVizHiddenSeries[it.key];
    return `<button type="button" class="viz-legend-item ${off?'viz-off':''}" data-viz-toggle="${it.key}"><span class="viz-legend-swatch ${it.dashed?'viz-line':''}" style="background:${it.color};"></span>${escapeHtml(it.label)}</button>`;
  }).join('')}</div>`;
}

/* ---------------- Data ---------------- */

function dashboardIncomeFYSeries(maxYears){
  const fys = distinctFYsInVouchers().slice().reverse(); // oldest → newest
  const todayFY = fyLabelForDate(new Date().toISOString().slice(0,10));

/* ---------------- Treemap layout ----------------
   A simple, robust binary-split ("slice and dice via recursive bisection") treemap: always cuts
   the current rectangle along its longer side, splitting the value-sorted items into two groups
   whose sums are as close to equal as possible, and recurses into each half. Not as tightly
   "squarified" as the classic Bruls/Huizing/Wijk algorithm, but area-exact by construction (every
   leaf's area is proportional to its value, and the leaves exactly tile the input rectangle with
   no gaps or overlaps), never produces a zero/negative-size cell, and is simple enough to verify
   directly — appropriate for the handful of ledgers per expense category this chart ever lays out. */
function treemapLayout(items, x, y, w, h){
  items = (items||[]).filter(it=>(it.value||0)>0);
  if(!items.length || w<=0 || h<=0) return [];
  if(items.length===1) return [{...items[0], x, y, w, h}];
  const sorted = items.slice().sort((a,b)=>b.value-a.value);
  const total = sorted.reduce((s,it)=>s+it.value,0);
  if(total<=0) return [];
  let acc=0, splitIdx=1, bestDiff=Infinity;
  for(let i=0;i<sorted.length-1;i++){
    acc += sorted[i].value;
    const diff = Math.abs(acc - total/2);
    if(diff<bestDiff){ bestDiff=diff; splitIdx=i+1; }
  }
  const left = sorted.slice(0,splitIdx), right = sorted.slice(splitIdx);
  const leftTotal = left.reduce((s,it)=>s+it.value,0);
  const frac = leftTotal/total;
  if(w>=h){
    const wLeft = w*frac;
    return [...treemapLayout(left, x, y, wLeft, h), ...treemapLayout(right, x+wLeft, y, w-wLeft, h)];
  } else {
    const hTop = h*frac;
    return [...treemapLayout(left, x, y, w, hTop), ...treemapLayout(right, x, y+hTop, w, h-hTop)];
  }
}

/* ---------------- Chart builders (inline SVG) ---------------- */
// Generic floating-bar waterfall: caller supplies `steps` as [{label, value, kind:'flow'|'total'}, …]
// — a 'flow' bar floats from the running cumulative total by `value`; a 'total' bar resets to and
// draws from zero (a subtotal/checkpoint). Green = adds, red = subtracts, blue = a running subtotal.
// `opts.openDetail` (default 'incomeStatementDetail') names the modal every bar's click-through
// opens; `opts.detailArg`, if set, is stamped onto each bar as data-detail-arg so
// wireVizInteractivity() can route the click to a specific sub-view of that modal (e.g. which Cash
// Flow bucket). `opts.tipSubFlow`/`opts.tipSubTotal` override the hover-tooltip explainer text.
function svgWaterfallChart(steps, opts){
  opts = opts||{};
  const openDetail = opts.openDetail || 'incomeStatementDetail';
  const tipSubFlow = opts.tipSubFlow || 'Click to see every ledger behind this statement';
  const tipSubTotal = opts.tipSubTotal || 'Running subtotal';
  const W=620,H=280,padL=8,padR=8,padT=20,padB=56;
  const n=steps.length, bw=(W-padL-padR)/n, barW=bw*0.62;
  let cum=0;
  const allVals=[0];
  const bars = steps.map(s=>{
    let from,to;
    if(s.kind==='total'){ from=0; to=s.value; cum=s.value; }
    else { from=cum; to=cum+s.value; cum=to; }
    allVals.push(from,to);
    return {...s, from, to};
  });
  const maxV=Math.max(...allVals), minV=Math.min(...allVals);
  const range=(maxV-minV)||1;
  const H0=H-padB;
  const y = v => H0 - ((v-minV)/range)*(H0-padT);
  const zeroY = y(0);
  const colorInc='var(--credit)', colorDec='var(--debit)', colorTotal='#4F8EF7';
  const barsSvg = bars.map((b,i)=>{
    const x = padL + i*bw + (bw-barW)/2;
    const yTop = y(Math.max(b.from,b.to)), yBot = y(Math.min(b.from,b.to));
    const hgt = Math.max(2, yBot-yTop);
    const color = b.kind==='total' ? colorTotal : (b.value>=0?colorInc:colorDec);
    const sign = b.kind==='total' ? '' : (b.value>=0?'+':'−');
    const labelLines = wrapLabel2(b.label, 11);
    const labelSvg = labelLines.map((line,li)=>`<text x="${(x+barW/2).toFixed(1)}" y="${(H0+16+li*10).toFixed(1)}" font-size="8.5" font-weight="600" fill="var(--ink-soft)" text-anchor="middle">${escapeHtml(line)}</text>`).join('');
    const barOpenDetail = b.openDetail || openDetail;
    return `<g class="viz-mark" data-tip-title="${escapeAttr(b.label)}" data-tip-value="${sign}₹${fmt(Math.abs(b.value))}" data-tip-sub="${b.kind==='total'?tipSubTotal:tipSubFlow}" data-tip-color="${color}" data-open-detail="${barOpenDetail}"${(b.detailArg||opts.detailArg)?` data-detail-arg="${escapeAttr(b.detailArg||opts.detailArg)}"`:''} tabindex="0">
      <rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${hgt.toFixed(1)}" rx="3" fill="${color}"></rect>
      <text x="${(x+barW/2).toFixed(1)}" y="${(Math.min(yTop,yBot)-6).toFixed(1)}" font-size="9.5" font-weight="700" fill="var(--ink)" text-anchor="middle">${sign}₹${fmtShort(Math.abs(b.value))}</text>
      ${labelSvg}
    </g>`;
  }).join('');
  const connectorsSvg = bars.slice(0,-1).map((b,i)=>{
    const x1 = padL + i*bw + bw - (bw-barW)/2;
    const x2 = padL + (i+1)*bw + (bw-barW)/2;
    const yv = y(b.to);
    return `<line x1="${x1.toFixed(1)}" y1="${yv.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${yv.toFixed(1)}" stroke="var(--border-strong)" stroke-width="1" stroke-dasharray="2,2"></line>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;font-family:'Inter',sans-serif;overflow:visible;">
    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W-padR}" y2="${zeroY.toFixed(1)}" class="viz-axis-line"></line>
    ${connectorsSvg}${barsSvg}
  </svg>`;
}
// Revenue, COGS (left ₹ axis) and Net Profit Margin % (right % axis) over up to six financial
// years — a deliberately dual-axis combo of three trend lines (mirrors exactly the "Line Graph"
// this app's Power BI-style dashboards are modeled on: money and a percentage plotted together,
// each on its own clearly-labelled axis, with a hover tooltip giving the exact figure either way).
function svgIncomeTrendLine(series){
  const W=620,H=260,padL=48,padR=48,padT=16,padB=32;
  const n=series.length, H0=H-padB;
  const xPos = i => n<=1 ? padL+(W-padL-padR)/2 : padL + i*(W-padL-padR)/(n-1);
  const showRevenue = !dashVizHiddenSeries.trendRevenue;
  const showCogs = !dashVizHiddenSeries.trendCogs;
  const showMargin = !dashVizHiddenSeries.trendMargin;
  const moneyVals=[0];
  series.forEach(s=>{ if(showRevenue) moneyVals.push(s.revenue); if(showCogs) moneyVals.push(s.cogs); });
  const maxMoney = Math.max(...moneyVals)*1.1 || 1;
  const marginVals = series.map(s=>s.netMargin);
  const marginMin = Math.min(0, ...marginVals);
  const marginMax = Math.max(1, ...marginVals)*1.15;
  const marginRange = (marginMax-marginMin)||1;
  const yMoney = v => H0 - (v/maxMoney)*(H0-padT);
  const yMargin = v => H0 - ((v-marginMin)/marginRange)*(H0-padT);
  let svg='';
  const ticks=4;
  for(let t=0;t<=ticks;t++){
    const yy = padT + t*(H0-padT)/ticks;
    svg += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" class="viz-gridline"></line>`;
    svg += `<text x="${padL-6}" y="${(yy+3).toFixed(1)}" text-anchor="end" class="viz-axis-label">₹${fmtShort(maxMoney*(1-t/ticks))}</text>`;
    svg += `<text x="${W-padR+6}" y="${(yy+3).toFixed(1)}" text-anchor="start" class="viz-axis-label">${(marginMin+marginRange*(1-t/ticks)).toFixed(0)}%</text>`;
  }
  series.forEach((s,i)=>{ svg += `<text x="${xPos(i).toFixed(1)}" y="${H0+18}" text-anchor="middle" class="viz-axis-label">${escapeHtml(s.fy)}</text>`; });
  function drawLine(vals, yfn, color, dashed, tipFmt){
    if(!vals.length) return '';
    const path = vals.map((v,i)=>`${i===0?'M':'L'} ${xPos(i).toFixed(1)} ${yfn(v).toFixed(1)}`).join(' ');
    let out = `<path d="${path}" fill="none" stroke="${color}" stroke-width="2.25" ${dashed?'stroke-dasharray="5,4"':''}></path>`;
    vals.forEach((v,i)=>{
      out += `<circle class="viz-mark" cx="${xPos(i).toFixed(1)}" cy="${yfn(v).toFixed(1)}" r="4.5" fill="${color}" stroke="var(--surface)" stroke-width="1.5" data-tip-title="FY ${escapeAttr(series[i].fy)}" data-tip-value="${tipFmt(v)}" data-tip-color="${color}" tabindex="0"></circle>`;
    });
    return out;
  }
  if(showRevenue) svg += drawLine(series.map(s=>s.revenue), yMoney, VIZ_COLORS[0], false, v=>'Revenue: ₹'+fmt(v));
  if(showCogs) svg += drawLine(series.map(s=>s.cogs), yMoney, VIZ_COLORS[4], false, v=>'COGS: ₹'+fmt(v));
  if(showMargin) svg += drawLine(series.map(s=>s.netMargin), yMargin, VIZ_COLORS[1], true, v=>'Net Margin: '+v.toFixed(1)+'%');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;font-family:'Inter',sans-serif;overflow:visible;">${svg}</svg>`;
}
// Columns = Total Revenue per FY (left ₹ axis), line overlay = Net Profit Margin % (right % axis)
// — the same up-to-six-FY series as the trend line above, presented Power BI "combo chart" style.
function svgIncomeComboChart(series){
  const W=620,H=260,padL=48,padR=48,padT=16,padB=32;
  const n=series.length, H0=H-padB, bw=(W-padL-padR)/n, barW=bw*0.5;
  const xPos = i => padL + i*bw + bw/2;
  const showRevenue = !dashVizHiddenSeries.comboRevenue;
  const showMargin = !dashVizHiddenSeries.comboMargin;
  const maxRevenue = Math.max(...series.map(s=>s.revenue),0)*1.1 || 1;
  const marginVals = series.map(s=>s.netMargin);
  const marginMin = Math.min(0, ...marginVals);
  const marginMax = Math.max(1, ...marginVals)*1.15;
  const marginRange = (marginMax-marginMin)||1;
  const yRev = v => H0 - (v/maxRevenue)*(H0-padT);
  const yMargin = v => H0 - ((v-marginMin)/marginRange)*(H0-padT);
  let svg='';
  const ticks=4;
  for(let t=0;t<=ticks;t++){
    const yy = padT + t*(H0-padT)/ticks;
    svg += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" class="viz-gridline"></line>`;
    svg += `<text x="${padL-6}" y="${(yy+3).toFixed(1)}" text-anchor="end" class="viz-axis-label">₹${fmtShort(maxRevenue*(1-t/ticks))}</text>`;
    svg += `<text x="${W-padR+6}" y="${(yy+3).toFixed(1)}" text-anchor="start" class="viz-axis-label">${(marginMin+marginRange*(1-t/ticks)).toFixed(0)}%</text>`;
  }
  series.forEach((s,i)=>{
    svg += `<text x="${xPos(i).toFixed(1)}" y="${H0+18}" text-anchor="middle" class="viz-axis-label">${escapeHtml(s.fy)}</text>`;
    if(showRevenue){
      const barH = H0-yRev(s.revenue);
      svg += `<rect class="viz-mark" x="${(xPos(i)-barW/2).toFixed(1)}" y="${yRev(s.revenue).toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,barH).toFixed(1)}" rx="3" fill="${VIZ_COLORS[0]}" data-tip-title="Total Revenue — FY ${escapeAttr(s.fy)}" data-tip-value="₹${fmt(s.revenue)}" data-tip-color="${VIZ_COLORS[0]}" tabindex="0"></rect>`;
    }
  });
  if(showMargin){
    const path = series.map((s,i)=>`${i===0?'M':'L'} ${xPos(i).toFixed(1)} ${yMargin(s.netMargin).toFixed(1)}`).join(' ');
    svg += `<path d="${path}" fill="none" stroke="${VIZ_COLORS[1]}" stroke-width="2.5"></path>`;
    series.forEach((s,i)=>{
      svg += `<circle class="viz-mark" cx="${xPos(i).toFixed(1)}" cy="${yMargin(s.netMargin).toFixed(1)}" r="5" fill="${VIZ_COLORS[1]}" stroke="var(--surface)" stroke-width="1.5" data-tip-title="Net Profit Margin — FY ${escapeAttr(s.fy)}" data-tip-value="${s.netMargin.toFixed(1)}%" data-tip-color="${VIZ_COLORS[1]}" tabindex="0"></circle>`;
    });
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;font-family:'Inter',sans-serif;overflow:visible;">${svg}</svg>`;
}
// Generic clustered/grouped column chart: one group of bars per category, all series sharing a
// single ₹/unit axis (deliberately single-axis — every series here is the same unit, so there's no
// dual-axis case to justify, unlike the Income Trend/Combo charts above). `categories` is
// [{key,label}, …]; `series` is [{key,label,color,values:{[categoryKey]:number}}, …].
function svgClusteredColumnChart(categories, series, opts){
  opts = opts||{};
  const W=620,H=260,padL=48,padR=16,padT=16,padB=32;
  const n=categories.length||1, H0=H-padB, groupW=(W-padL-padR)/n;
  const barGap=3, groupPad=groupW*0.16;
  const barsPerGroup = series.length||1;
  const barW = Math.max(2,(groupW-groupPad*2-barGap*(barsPerGroup-1))/barsPerGroup);
  const allVals = [0];
  categories.forEach(c=> series.forEach(s=> allVals.push(s.values[c.key]||0)));
  const maxVal = Math.max(...allVals)*1.12 || 1;
  const yScale = v => (v/maxVal)*(H0-padT);
  let svg='';
  const ticks=4;
  for(let t=0;t<=ticks;t++){
    const val = maxVal*t/ticks, yy = H0-yScale(val);
    svg += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" class="viz-gridline"></line>`;
    svg += `<text x="${padL-6}" y="${(yy+3).toFixed(1)}" text-anchor="end" class="viz-axis-label">₹${fmtShort(val)}</text>`;
  }
  categories.forEach((c,ci)=>{
    const groupX = padL + ci*groupW + groupPad;
    svg += `<text x="${(groupX+(groupW-groupPad*2)/2).toFixed(1)}" y="${H0+18}" text-anchor="middle" class="viz-axis-label">${escapeHtml(c.label)}</text>`;
    series.forEach((s,si)=>{
      if(opts.hiddenKey && opts.hiddenKey(s.key)) return;
      const val = s.values[c.key]||0;
      const x = groupX + si*(barW+barGap);
      const h = Math.max(1, yScale(val));
      const y = H0-h;
      svg += `<rect class="viz-mark" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2.5" fill="${s.color}" data-tip-title="${escapeAttr(s.label)} — ${escapeAttr(c.label)}" data-tip-value="₹${fmt(val)}" data-tip-color="${s.color}" tabindex="0"></rect>`;
    });
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;font-family:'Inter',sans-serif;overflow:visible;">${svg}</svg>`;
}
// Generic single-axis multi-line trend chart — every line shares one unit (₹, ×, or %), so unlike
// the Income Trend combo above there's no dual-axis to justify; used for the Cash Flow "Operating
// Cash Flow Trend" line and the Ratio Analysis trend charts. `categories` is [{key,label}, …];
// `lines` is [{key,label,color,dashed,values:{[categoryKey]:number}, fmt:(v)=>string}, …].
function svgMultiLineChart(categories, lines, opts){
  opts = opts||{};
  const W=620,H=260,padL=54,padR=16,padT=16,padB=32;
  const n=categories.length, H0=H-padB;
  const xPos = i => n<=1 ? padL+(W-padL-padR)/2 : padL + i*(W-padL-padR)/(n-1);
  const visibleLines = lines.filter(l=> !(opts.hiddenKey && opts.hiddenKey(l.key)));
  const allVals=[0];
  visibleLines.forEach(l=> categories.forEach(c=> allVals.push(l.values[c.key]||0)));
  const vMin = Math.min(0, ...allVals);
  const vMax = Math.max(...allVals,0.0001)*1.15;
  const range = (vMax-vMin)||1;
  const y = v => H0 - ((v-vMin)/range)*(H0-padT);
  const unit = opts.unit || '';
  const axisFmt = opts.axisFmt || (v=>v.toFixed(0)+unit);
  let svg='';
  const ticks=4;
  for(let t=0;t<=ticks;t++){
    const yy = padT + t*(H0-padT)/ticks;
    svg += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" class="viz-gridline"></line>`;
    svg += `<text x="${padL-6}" y="${(yy+3).toFixed(1)}" text-anchor="end" class="viz-axis-label">${axisFmt(vMin+range*(1-t/ticks))}</text>`;
  }
  categories.forEach((c,i)=>{ svg += `<text x="${xPos(i).toFixed(1)}" y="${H0+18}" text-anchor="middle" class="viz-axis-label">${escapeHtml(c.label)}</text>`; });
  if(vMin<0 && vMax>0){
    svg += `<line x1="${padL}" y1="${y(0).toFixed(1)}" x2="${W-padR}" y2="${y(0).toFixed(1)}" class="viz-axis-line"></line>`;
  }
  visibleLines.forEach(l=>{
    const vals = categories.map(c=>l.values[c.key]||0);
    const path = vals.map((v,i)=>`${i===0?'M':'L'} ${xPos(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
    svg += `<path d="${path}" fill="none" stroke="${l.color}" stroke-width="2.25" ${l.dashed?'stroke-dasharray="5,4"':''}></path>`;
    vals.forEach((v,i)=>{
      const tip = l.fmt ? l.fmt(v) : (v.toFixed(2)+unit);
      svg += `<circle class="viz-mark" cx="${xPos(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4.5" fill="${l.color}" stroke="var(--surface)" stroke-width="1.5" data-tip-title="${escapeAttr(l.label)} — ${escapeAttr(categories[i].label)}" data-tip-value="${escapeAttr(tip)}" data-tip-color="${l.color}" tabindex="0"></circle>`;
    });
  });
  if(!visibleLines.length) return `<div class="empty">No series selected — click a legend item to turn one back on.</div>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;font-family:'Inter',sans-serif;overflow:visible;">${svg}</svg>`;
}
// Ledger-level expense treemap — block size = amount, grouped and colored by the same four
// categories the Income Statement breaks expenses into. Click a block to open that ledger's own

function svgExpenseTreemap(groups){

  groupRects.forEach(gr=>{

        <rect x="${(lf.x+1.5).toFixed(1)}" y="${(lf.y+1.5).toFixed(1)}" width="${Math.max(0,lf.w-3).toFixed(1)}" height="${Math.max(0,lf.h-3).toFixed(1)}" rx="3" fill="${gr.color}" fill-opacity="0.82"></rect>

// Two grouped, stacked columns — Assets split Current vs Non-current, Liabilities split Current
// vs Non-current — straight from balanceSheetIFRSData(), the same totals the Balance Sheet card
// and detail modals above already show. Click a segment for that half's full breakdown.
function svgBalanceSheetStackedBars(bs){
  const W=560,H=250,padL=64,padR=20,padT=16,padB=30;
  const bars = [
    {label:'Assets', segs:[
      {name:'Current Assets', value:bs.currentAssetsTotal, color:VIZ_COLORS[0]},
      {name:'Non-current Assets', value:bs.nonCurrentAssetsTotal, color:VIZ_COLORS[1]},
    ], detail:'totalAssetsDetail'},
    {label:'Liabilities', segs:[
      {name:'Current Liabilities', value:bs.currentLiabTotal, color:VIZ_COLORS[2]},
      {name:'Non-current Liabilities', value:bs.nonCurrentLiabTotal, color:VIZ_COLORS[3]},
    ], detail:'liabCapitalDetail'},
  ];
  const maxTotal = Math.max(...bars.map(b=>b.segs.reduce((s,x)=>s+x.value,0)), 1);
  const H0=H-padB, barW=120, gap=90;
  const totalW = bars.length*barW+(bars.length-1)*gap;
  const startX = (W-totalW)/2;
  const yScale = v => (v/maxTotal)*(H0-padT);
  let svg='';
  const ticks=4;
  for(let t=0;t<=ticks;t++){
    const val = maxTotal*t/ticks, yy = H0-yScale(val);
    svg += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" class="viz-gridline"></line>`;
    svg += `<text x="${padL-8}" y="${(yy+3).toFixed(1)}" text-anchor="end" class="viz-axis-label">₹${fmtShort(val)}</text>`;
  }
  bars.forEach((b,i)=>{
    const x = startX + i*(barW+gap);
    const barTotal = b.segs.reduce((s,x)=>s+x.value,0);
    let cum=0;
    b.segs.forEach(seg=>{
      const segH = yScale(seg.value);
      const yTop = H0-cum-segH;
      // A segment for a genuinely small liability/asset can be just 1-2px tall at this scale —
      // accurate but nearly impossible to point at. The visible rect stays proportionally exact;
      // a transparent overlay widens only the HOVER/click target so tiny segments stay reachable.
      const hitH = Math.max(6, segH);
      const hitY = yTop - (hitH-segH)/2;
      svg += `<g class="viz-mark" data-tip-title="${escapeAttr(seg.name)}" data-tip-value="₹${fmt(seg.value)}" data-tip-sub="${escapeAttr(b.label)} total: ₹${fmt(barTotal)}" data-tip-color="${seg.color}" data-open-detail="${b.detail}" tabindex="0">
        <rect x="${x.toFixed(1)}" y="${hitY.toFixed(1)}" width="${barW}" height="${hitH.toFixed(1)}" fill="transparent"></rect>
        <rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW}" height="${Math.max(1,segH).toFixed(1)}" rx="3" fill="${seg.color}" style="pointer-events:none;"></rect>
      </g>`;
      cum += segH;
    });
    svg += `<text x="${(x+barW/2).toFixed(1)}" y="${H0+18}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${escapeHtml(b.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;font-family:'Inter',sans-serif;overflow:visible;">${svg}</svg>`;
}
// True SVG donut (not a CSS conic-gradient, so each slice can carry its own hover/click handlers)
// showing total-assets composition by functional bucket, with the grand total in the hollow
// center — click a slice for the full Total Assets breakdown.
function svgAssetDonut(slices, total){
  const W=260,H=230,cx=W/2,cy=108,rOuter=86,rInner=52;
  const sum = slices.reduce((s,x)=>s+x.value,0);
  if(!sum) return `<div class="empty">No assets recorded yet.</div>`;
  let svg='';
  if(slices.length===1){
    const s = slices[0];
    svg += `<circle class="viz-mark" cx="${cx}" cy="${cy}" r="${(rOuter+rInner)/2}" fill="none" stroke="${s.color}" stroke-width="${rOuter-rInner}" data-tip-title="${escapeAttr(s.label)}" data-tip-value="₹${fmt(s.value)}" data-tip-sub="100% of total assets" data-tip-color="${s.color}" data-open-detail="totalAssetsDetail" tabindex="0"></circle>`;
  } else {
    let angle=-Math.PI/2;
    slices.forEach(s=>{
      const frac=s.value/sum;
      const a0=angle, a1=angle+frac*Math.PI*2;
      angle=a1;
      const large=(a1-a0)>Math.PI?1:0;
      const x0o=cx+rOuter*Math.cos(a0), y0o=cy+rOuter*Math.sin(a0);
      const x1o=cx+rOuter*Math.cos(a1), y1o=cy+rOuter*Math.sin(a1);
      const x1i=cx+rInner*Math.cos(a1), y1i=cy+rInner*Math.sin(a1);
      const x0i=cx+rInner*Math.cos(a0), y0i=cy+rInner*Math.sin(a0);
      const d=`M ${x0o.toFixed(2)} ${y0o.toFixed(2)} A ${rOuter} ${rOuter} 0 ${large} 1 ${x1o.toFixed(2)} ${y1o.toFixed(2)} L ${x1i.toFixed(2)} ${y1i.toFixed(2)} A ${rInner} ${rInner} 0 ${large} 0 ${x0i.toFixed(2)} ${y0i.toFixed(2)} Z`;
      const pct=(frac*100).toFixed(1);
      svg += `<path class="viz-mark" d="${d}" fill="${s.color}" stroke="var(--surface)" stroke-width="2" data-tip-title="${escapeAttr(s.label)}" data-tip-value="₹${fmt(s.value)}" data-tip-sub="${pct}% of total assets" data-tip-color="${s.color}" data-open-detail="totalAssetsDetail" tabindex="0"></path>`;
    });
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;font-family:'Inter',sans-serif;overflow:visible;">
    ${svg}
    <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--ink-faint)" style="text-transform:uppercase;letter-spacing:.04em;">Total Assets</text>
    <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">₹${fmtShort(total)}</text>
  </svg>`;
}
// Semicircular gauge for the Current Ratio, colored risk/health zones plus a needle — hover
// anywhere on it for the exact ratio and its formula.
// Semicircular gauge, generic: pass opts.title/opts.formula/opts.suffix/opts.zones/opts.max to
// reuse for any single "value against a safe zone" ratio (Quick Ratio, Cash Ratio, Debt-to-Equity,
// …) — every existing call site (the Dashboard's Current Ratio gauge) passes no opts and keeps its
// exact original look and tooltip.
function svgGaugeChart(value, opts){
  opts = opts||{};
  // Scale headroom to the actual value — a current ratio of 2 or 3 is common, but a cash-rich
  // company (or the bundled demo data) can post a ratio in the double digits; a fixed max:4 would
  // just pin the needle at the edge and hide how far above "healthy" the real figure is.
  const max = opts.max || Math.max(4, Math.ceil((value||0)*1.15));
  const zones = opts.zones || [
    {to:1, color:'var(--debit)'},
    {to:1.5, color:'#F2994A'},
    {to:3, color:'var(--credit)'},
    {to:max, color:'#4F8EF7'},
  ];
  const title = opts.title || 'Current Ratio';
  const formula = opts.formula || 'Current Assets ÷ Current Liabilities · 1.5×–3× is generally considered healthy';
  const suffix = opts.suffix != null ? opts.suffix : '×';
  const W=240,H=150,cx=120,cy=132,r=98;
  const v = Math.max(0, Math.min(value==null?0:value, max));
  const angleFor = x => Math.PI - (x/max)*Math.PI;
  let prevTo=0;
  const zoneArcs = zones.map(z=>{
    const a0=angleFor(prevTo), a1=angleFor(Math.min(z.to,max));
    prevTo=z.to;
    const x0=cx+r*Math.cos(a0), y0=cy-r*Math.sin(a0);
    const x1=cx+r*Math.cos(a1), y1=cy-r*Math.sin(a1);
    const large=(a0-a1)>Math.PI?1:0;
    return `<path d="M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" fill="none" stroke="${z.color}" stroke-width="16"></path>`;
  }).join('');
  const needleAngle = angleFor(v);
  const nx = cx+(r-22)*Math.cos(needleAngle), ny = cy-(r-22)*Math.sin(needleAngle);
  const valueLabel = value==null ? '—' : value.toFixed(2)+suffix;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;font-family:'Inter',sans-serif;overflow:visible;">
    <g class="viz-mark" data-tip-title="${escapeAttr(title)}" data-tip-value="${valueLabel}" data-tip-sub="${escapeAttr(formula)}" tabindex="0">
      ${zoneArcs}
      <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"></line>
      <circle cx="${cx}" cy="${cy}" r="5" fill="var(--ink)"></circle>
    </g>
    <text x="${cx}" y="${cy-30}" text-anchor="middle" font-size="19" font-weight="800" fill="var(--ink)">${valueLabel}</text>
    <text x="${cx-r}" y="${cy+16}" text-anchor="start" font-size="9" fill="var(--ink-faint)">0</text>
    <text x="${cx+r}" y="${cy+16}" text-anchor="end" font-size="9" fill="var(--ink-faint)">${max}${suffix}</text>
  </svg>`;
}

/* ---------------- Import Accounting Data (bank statement / spreadsheet → vouchers) ---------------- */
const IMPORT_COLUMN_SYNONYMS = {
  date:   ['date','txn date','transaction date','value date','posting date','entry date'],
  desc:   ['description','narration','particulars','details','transaction details','remarks','memo'],
  debit:  ['debit','withdrawal','withdrawal amt','withdrawal amt.','withdrawal amount','dr','paid out','money out'],
  credit: ['credit','deposit','deposit amt','deposit amt.','deposit amount','cr','paid in','money in'],
  amount: ['amount','amt','value','transaction amount'],
  type:   ['type','dr/cr','cr/dr','drcr','transaction type'],
};
function guessImportColumn(headers, key){
  const syns = IMPORT_COLUMN_SYNONYMS[key];
  const lower = headers.map(h=>h.toLowerCase().trim());
  for(const syn of syns){
    const idx = lower.findIndex(h=>h===syn);
    if(idx>-1) return headers[idx];
  }
  for(const syn of syns){
    const idx = lower.findIndex(h=>h.includes(syn));
    if(idx>-1) return headers[idx];
  }
  return '';
}
function importFindHeaderRowIndex(rows){
  // Real-world exports (and this app's own template) often carry a title/preamble above the
  // real header row — e.g. an account number or statement period. Scan the first ~20 rows and
  // pick whichever one best matches the known column-name synonyms, rather than blindly
  // assuming row 1 is the header.
  const maxScan = Math.min(rows.length, 20);
  let bestIdx = -1, bestScore = -1, bestCellCount = -1;
  for(let i=0;i<maxScan;i++){
    const row = rows[i] || [];
    const cells = row.map(c=>String(c==null?'':c).trim().toLowerCase()).filter(Boolean);
    if(cells.length < 2) continue; // a real header names several columns
    let score = 0;
    for(const key of Object.keys(IMPORT_COLUMN_SYNONYMS)){
      const syns = IMPORT_COLUMN_SYNONYMS[key];
      if(cells.some(c=> syns.some(s=> c===s || c.includes(s)))) score++;
    }
    if(score > bestScore || (score===bestScore && cells.length > bestCellCount)){
      bestScore = score; bestIdx = i; bestCellCount = cells.length;
    }
  }
  return bestIdx>-1 ? bestIdx : 0;
}
function importCleanRows(rows){
  rows = (rows||[]).filter(r=> r && r.some(c=> String(c==null?'':c).trim()!==''));
  if(!rows.length) return {headers:[], rows:[]};
  const headerIdx = importFindHeaderRowIndex(rows);
  const headers = rows[headerIdx].map((h,i)=> String(h==null?'':h).trim() || `Column ${i+1}`);
  return {headers, rows: rows.slice(headerIdx+1)};
}
function importParseCSVText(text){
  // Hand-rolled CSV parser (handles quoted fields, escaped quotes, CRLF/LF) so date-like
  // strings such as "01/06/2026" are kept as plain text — SheetJS's CSV reader auto-detects
  // such values as dates using a US (MM/DD/YYYY) assumption, which silently corrupts the
  // day/month for India-format (DD/MM/YYYY) statements. Keeping raw text lets parseImportDate
  // below apply its own, more careful, locale-aware parsing.
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if(c === '"'){
      inQuotes = true;
    } else if(c === ','){
      row.push(field); field = '';
    } else if(c === '\n'){
      row.push(field); rows.push(row); row = []; field = '';
    } else if(c === '\r'){
      // skip; paired \n (if any) handles the row break
    } else {
      field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}
function parseImportFile(file){
  return new Promise((resolve, reject)=>{
    const name = (file.name||'').toLowerCase();
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('Could not read the file'));
    const isCsv = name.endsWith('.csv') || name.endsWith('.txt');
    reader.onload = (e)=>{
      try{
        let rows;
        if(isCsv){
          rows = importParseCSVText(String(e.target.result));
        } else {
          if(typeof XLSX === 'undefined'){ reject(new Error('Spreadsheet reader unavailable')); return; }
          const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
        }
        resolve(importCleanRows(rows));
      }catch(err){ reject(err); }
    };
    if(isCsv) reader.readAsText(file); else reader.readAsArrayBuffer(file);
  });
}
function importPad(n){ return String(n).padStart(2,'0'); }
function parseImportDate(v){
  if(v==null || v==='') return '';
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v === 'number'){
    const epoch = new Date(Date.UTC(1899,11,30));
    const d = new Date(epoch.getTime() + v*24*60*60*1000);
    return isNaN(d) ? '' : d.toISOString().slice(0,10);
  }
  const s = String(v).trim();
  if(!s) return '';
  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m) return `${m[1]}-${importPad(m[2])}-${importPad(m[3])}`;
  m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if(m){
    let day=+m[1], month=+m[2];
    if(day<=12 && month>12){ const t=day; day=month; month=t; } // swap if it looks like MM-DD-YYYY
    return `${m[3]}-${importPad(month)}-${importPad(day)}`;
  }
  m = s.match(/^(\d{1,2})[\s-]([A-Za-z]{3,9})[\s-](\d{4})/);
  if(m){
    const months = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
    const mon = months[m[2].slice(0,3).toLowerCase()];
    if(mon) return `${m[3]}-${importPad(mon)}-${importPad(m[1])}`;
  }
  const d = new Date(s);
  return isNaN(d) ? '' : d.toISOString().slice(0,10);
}
function parseImportAmount(v){
  if(v==null || v==='') return 0;
  if(typeof v === 'number') return v;
  let s = String(v).trim().replace(/[₹$,\s]/g,'');
  if(!s) return 0;
  const negParen = /^\((.*)\)$/.exec(s);
  if(negParen) s = '-'+negParen[1];
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function importNormalizeNarration(s){ return (s||'').trim().replace(/\s+/g,' ').toLowerCase(); }
function importGuessLedgerMatch(desc){
  const norm = importNormalizeNarration(desc);
  if(!norm) return '';
  for(const l of state.ledgers){
    const lname = importNormalizeNarration(l.name);
    if(lname && (norm.includes(lname) || lname.includes(norm))) return l.id;
  }
  const words = norm.split(' ').filter(w=>w.length>3);
  for(const l of state.ledgers){
    const lname = importNormalizeNarration(l.name);
    if(lname && words.some(w=>lname.includes(w))) return l.id;
  }
  return '';
}
function importRowsToTransactions(){
  const headers = importState.headers;
  const idx = h => headers.indexOf(h);
  const dIdx = idx(importState.dateCol), descIdx = idx(importState.descCol);
  const debIdx = idx(importState.debitCol), credIdx = idx(importState.creditCol);
  const amtIdx = idx(importState.amountCol), typeIdx = idx(importState.typeCol);
  const txns = [];
  importState.rows.forEach(r=>{
    const date = dIdx>-1 ? parseImportDate(r[dIdx]) : '';
    const desc = descIdx>-1 ? String(r[descIdx]==null?'':r[descIdx]).trim() : '';
    let amount = 0, drcr = '';
    if(importState.colMode==='split'){
      const deb = debIdx>-1 ? parseImportAmount(r[debIdx]) : 0;
      const cred = credIdx>-1 ? parseImportAmount(r[credIdx]) : 0;
      if(deb>0){ amount=deb; drcr='dr'; }
      else if(cred>0){ amount=cred; drcr='cr'; }
    } else {
      const raw = amtIdx>-1 ? parseImportAmount(r[amtIdx]) : 0;
      if(importState.typeCol && typeIdx>-1){
        const t = String(r[typeIdx]==null?'':r[typeIdx]).trim().toLowerCase();
        drcr = /^(d|dr|debit|withdrawal|w)/.test(t) ? 'dr' : /^(c|cr|credit|deposit)/.test(t) ? 'cr' : (raw<0?'dr':'cr');
        amount = Math.abs(raw);
      } else {
        drcr = raw<0 ? 'dr' : 'cr';
        amount = Math.abs(raw);
      }
    }
    if(!date || !amount) return;
    txns.push({date, desc, amount, drcr});
  });
  return txns;
}
function importBuildGroups(txns){
  const map = new Map();
  txns.forEach(t=>{
    const key = importNormalizeNarration(t.desc) || '(blank)';
    if(!map.has(key)) map.set(key, {key, label: t.desc || '(No description)', count:0, drTotal:0, crTotal:0, ledgerId: importGuessLedgerMatch(t.desc)});
    const g = map.get(key);
    g.count++;
    if(t.drcr==='dr') g.drTotal += t.amount; else g.crTotal += t.amount;
  });
  return Array.from(map.values()).sort((a,b)=> (b.drTotal+b.crTotal)-(a.drTotal+a.crTotal));
}

async function commitImport(){
  let primaryId = importState.primaryLedgerId;
  if(primaryId === '__new__'){
    const nm = (importState.newPrimaryLedgerName||'').trim();
    if(!nm){ toast('Enter a name for the new ledger'); return; }
    const l = {id: uid('l'), name: nm, group:'bank', opening:0};
    state.ledgers.push(l);
    primaryId = l.id;
  }
  if(!primaryId){ toast('Select which ledger this statement is for'); return; }

  const groupLedgerMap = {};
  const ensureSuspense = ()=>{
    let sus = state.ledgers.find(l=>l.name==='Suspense Account (Import)');
    if(!sus){ sus = {id:uid('l'), name:'Suspense Account (Import)', group:'ca', opening:0}; state.ledgers.push(sus); }
    return sus.id;
  };
  for(const g of importState.groups){
    let lid = g.ledgerId;
    if(!lid || lid === '__suspense__') lid = ensureSuspense();
    groupLedgerMap[g.key] = lid;
  }

  const now = new Date().toISOString();
  let created = 0;
  importState.transactions.forEach(t=>{
    const key = importNormalizeNarration(t.desc) || '(blank)';
    const counterId = groupLedgerMap[key];
    if(!counterId) return;
    const entries = t.drcr==='dr'
      ? [{ledgerId:counterId, dr:t.amount, cr:0}, {ledgerId:primaryId, dr:0, cr:t.amount}]
      : [{ledgerId:primaryId, dr:t.amount, cr:0}, {ledgerId:counterId, dr:0, cr:t.amount}];
    state.vouchers.push({
      id: uid('v'),
      type: t.drcr==='dr' ? 'Payment' : 'Receipt',
      date: t.date,
      narration: t.desc || '(Imported transaction)',
      entries,
      createdAt: now,
      importedFrom: importState.fileName || 'spreadsheet import',
    });
    created++;
  });

  await saveLedgers();
  await saveVouchers();
  toast(`Imported ${created} voucher${created===1?'':'s'}`);
  modal = null;
  importState = null;
  view = 'daybook';
  render();
}
