            <button class="btn small secondary" id="calNext" type="button">Next ▶</button>
          </div>
          <div class="monthlabel">${monthNames[month]} ${year}</div>
        </div>
        <div class="calendar-grid">
          <div class="dow">Sun</div><div class="dow">Mon</div><div class="dow">Tue</div><div class="dow">Wed</div><div class="dow">Thu</div><div class="dow">Fri</div><div class="dow">Sat</div>

        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Vouchers on ${calState.selected}</h2><span class="muted" style="font-size:12px;">${selectedVouchers.length} entr${selectedVouchers.length===1?'y':'ies'}</span></div>
      <div class="panel-body" style="padding:0;">
        ${selectedVouchers.length ? `<table>
          <tr><th>Type</th><th>Narration</th><th class="num">Amount</th><th>Action</th></tr>
          ${selectedVouchers.map(v=>`<tr>

            <td><button class="btn small secondary" data-edit-voucher="${v.id}" type="button">Edit</button> <button class="btn small secondary" data-delete-voucher="${v.id}" type="button">Delete</button></td>

        </table>` : `<div class="empty">No vouchers on this date. <a class="linklike" id="calNewVoucher">Add one →</a></div>`}
      </div>
    </div>
  `;
}

function ledgerStatement(ledgerId){
  const l = ledgerOf(ledgerId);
  if(!l) return `<div class="empty">Ledger not found</div>`;
  let running = l.opening || 0;
  const rows = [];
  const sorted = state.vouchers.slice().sort((a,b)=> a.date.localeCompare(b.date));
  for(const v of sorted){
    for(const e of v.entries){
      if(e.ledgerId === ledgerId){
        running += (e.dr||0) - (e.cr||0);
        rows.push({date:v.date, particulars:v.narration||v.type, dr:e.dr, cr:e.cr, running});
      }
    }
  }
  const bal = ledgerBalance(ledgerId);
  return `
    <div class="panel">
      <div class="panel-head">
        <h2>${l.name}</h2>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="btn small secondary" data-open-pie="${ledgerId}" type="button">📊 Pie Chart</button>
          <span class="pill ${bal>=0?'dr':'cr'}">${fmt(bal)} ${balanceLabel(bal)}</span>
        </div>
      </div>
      <div class="panel-body" style="padding:0;">
        <table>
          <tr><th>Date</th><th>Particulars</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr>
          <tr><td class="muted">—</td><td class="muted">Opening Balance</td><td class="num">${l.opening>0?fmt(l.opening):''}</td><td class="num">${l.opening<0?fmt(l.opening):''}</td><td class="num ${l.opening>=0?'dr':'cr'}">${fmt(l.opening)} ${balanceLabel(l.opening)}</td></tr>
          ${rows.map(r=>`<tr>
            <td class="muted">${r.date}</td>
            <td>${r.particulars}</td>
            <td class="num">${r.dr?fmt(r.dr):''}</td>
            <td class="num">${r.cr?fmt(r.cr):''}</td>
            <td class="num ${r.running>=0?'dr':'cr'}">${fmt(r.running)} ${balanceLabel(r.running)}</td>
          </tr>`).join('')}
          ${!rows.length ? `<tr><td colspan="5" class="empty">No transactions on this ledger yet.</td></tr>`:''}
        </table>
      </div>
    </div>
  `;
}

/* Lightweight, dependency-free inline-SVG horizontal bar chart. Colors accept any CSS color
   (including var(--token) references) so it stays in sync with the app's light/values theme. */
function svgHBarChart(items, opts={}){
  const width = opts.width || 480;
  const barH = opts.barHeight || 20;
  const gap = opts.gap || 12;
  const labelW = opts.labelWidth || 172;
  const valueW = opts.valueWidth || 66;
  const chartW = Math.max(40, width - labelW - valueW - 14);
  const vals = items.map(it=>Math.abs(it.value)||0);
  const maxVal = opts.max || Math.max(...vals, opts.benchmark!=null ? Math.abs(opts.benchmark) : 0, 0.0001);
  const rowH = barH + gap;
  const topPad = opts.benchmark!=null ? 18 : 4;
  const height = topPad + items.length*rowH - gap + 6;

  const barsSvg = items.map((it,i)=>{
    const y = topPad + i*rowH;
    const w = Math.max(2, (Math.abs(it.value||0)/maxVal) * chartW);
    const color = it.color || 'var(--accent1)';
    return `<g>
      <text x="0" y="${y+barH/2+4}" font-size="11.5" font-weight="600" fill="var(--ink-soft)">${escapeHtml(it.label)}</text>
      <rect x="${labelW}" y="${y}" width="${chartW}" height="${barH}" rx="4" fill="var(--surface-strong)"></rect>
      <rect x="${labelW}" y="${y}" width="${w}" height="${barH}" rx="4" fill="${color}"></rect>
      <text x="${labelW+chartW+10}" y="${y+barH/2+4}" font-size="11.5" font-weight="700" fill="var(--ink)">${escapeHtml(it.display)}</text>
    </g>`;
  }).join('');

  let benchmarkSvg = '';
  if(opts.benchmark!=null){
    const bx = labelW + Math.min(1, Math.abs(opts.benchmark)/maxVal) * chartW;
    benchmarkSvg = `<line x1="${bx}" y1="2" x2="${bx}" y2="${height}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="4,3"></line>
      <text x="${bx}" y="12" font-size="9.5" fill="var(--gold)" text-anchor="middle" font-weight="700">${escapeHtml(opts.benchmarkLabel||'')}</text>`;
  }

  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" style="display:block;font-family:'Inter',sans-serif;overflow:visible;">${benchmarkSvg}${barsSvg}</svg>`;
}
/* Single-row 100%-stacked bar, used to visualise a financing (Equity vs Liabilities) mix. */
function svgStackedBar(segments, opts={}){
  const width = opts.width || 480, height = opts.height || 26;
  const total = segments.reduce((s,x)=>s+Math.max(0,x.value||0),0) || 1;
  let x = 0;
  const rects = segments.map(seg=>{
    const w = Math.max(0,seg.value||0)/total*width;
    const r = `<rect x="${x.toFixed(2)}" y="0" width="${w.toFixed(2)}" height="${height}" fill="${seg.color}"></rect>`;
    x += w;
    return r;
  }).join('');
  const legend = segments.map(seg=>`<span style="display:inline-flex;align-items:center;gap:6px;margin-right:18px;font-size:11.5px;color:var(--ink-soft);"><span style="width:10px;height:10px;border-radius:2px;background:${seg.color};display:inline-block;"></span>${escapeHtml(seg.label)} (${(Math.max(0,seg.value||0)/total*100).toFixed(1)}%)</span>`).join('');
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" style="display:block;border-radius:6px;overflow:hidden;">${rects}</svg><div style="margin-top:9px;">${legend}</div>`;
}
/* Rule-based, plain-language read of the Balance Sheet's liquidity, asset mix, leverage and
   internal balance — generated from the same figures shown in the statement above it. */
function balanceSheetInterpretation(bs, ratios){
  const notes = [];
  if(ratios.currentRatio!=null){
    if(ratios.currentRatio >= 2) notes.push(`Current assets are ${fmtRatio(ratios.currentRatio)}× current liabilities — a strong liquidity buffer, comfortably above the conventional 2:1 benchmark.`);
    else if(ratios.currentRatio >= 1) notes.push(`Current assets cover current liabilities ${fmtRatio(ratios.currentRatio)}× over — an acceptable, if not generous, short-term liquidity position.`);
    else notes.push(`Current liabilities exceed current assets (ratio of ${fmtRatio(ratios.currentRatio)}) — a sign of potential short-term liquidity strain; near-term cash inflows should be watched against upcoming obligations.`);
  }
  notes.push(`Working capital stands at ₹${fmt(ratios.workingCapital)}, which is ${ratios.workingCapital>=0 ? 'positive — short-term assets comfortably fund short-term obligations.' : 'negative — short-term obligations currently exceed short-term assets.'}`);

  const currentPct = bs.totalAssets ? bs.currentAssetsTotal/bs.totalAssets*100 : 0;
  const nonCurrentPct = 100-currentPct;
  notes.push(`Assets are weighted ${currentPct.toFixed(0)}% current and ${nonCurrentPct.toFixed(0)}% non-current, ${currentPct>60?'reflecting a fairly liquid, working-capital-heavy asset base.':'reflecting meaningful investment in fixed/long-term assets relative to current holdings.'}`);

  const equityPct = bs.totalAssets ? bs.totalEquity/bs.totalAssets*100 : 0;
  if(ratios.debtToEquity!=null){
    if(ratios.debtToEquity < 0.5) notes.push(`Debt-to-equity is low at ${fmtRatio(ratios.debtToEquity)}× — the business is financed mostly by equity (${equityPct.toFixed(0)}% of total assets), implying limited financial risk from leverage.`);
    else if(ratios.debtToEquity <= 1) notes.push(`Debt-to-equity of ${fmtRatio(ratios.debtToEquity)}× indicates a fairly balanced mix of debt and equity financing (equity funds ${equityPct.toFixed(0)}% of total assets).`);
    else notes.push(`Debt-to-equity of ${fmtRatio(ratios.debtToEquity)}× shows liabilities exceeding equity — a more leveraged capital structure that raises financial risk if earnings or cash flow weaken.`);
  }

  const diff = Math.abs(bs.totalAssets-bs.totalEquityAndLiab);
  if(diff>=0.01) notes.push(`⚠ Total Assets (₹${fmt(bs.totalAssets)}) does not equal Total Equity and Liabilities (₹${fmt(bs.totalEquityAndLiab)}) — check for a misclassified or one-sided entry before relying on this statement.`);
  else notes.push(`✓ The statement balances — Total Assets equal Total Equity and Liabilities at ₹${fmt(bs.totalAssets)}.`);
  return notes;
}

              {label:'Payables Turnover', value: ratios.payablesTurnover||0, display: fmtRatio(ratios.payablesTurnover)+'×', color:'#F2994A'},

  `;
}

function viewGST(){
  const netGST = gstOutputTotal() - gstInputTotal();
  const outward = state.vouchers.filter(v=>v.type==='Sales').map(v=>({v, g:gstBreakdownForVoucher(v)})).filter(r=>r.g.totalTax>0);
  const inward = state.vouchers.filter(v=>v.type==='Purchase').map(v=>({v, g:gstBreakdownForVoucher(v)})).filter(r=>r.g.totalTax>0);

  return `
    ${masthead('GST','Output tax, input credit, and filing-ready statements')}

    <div class="panel">
      <div class="panel-head"><h2>GST Summary</h2><button class="btn secondary small" id="downloadGSTBtn" type="button">⬇ Download GST Statement</button></div>
      <div class="panel-body" style="padding:0;">
        <table>
          <tr><th>Tax Head</th><th class="num">Output (Payable)</th><th class="num">Input (Credit)</th></tr>

          <tr><td>SGST</td><td class="num">₹${fmt(-ledgerBalance('l_osgst'))}</td><td class="num">₹${fmt(ledgerBalance('l_isgst'))}</td></tr>
          <tr><td>IGST</td><td class="num">₹${fmt(-ledgerBalance('l_oigst'))}</td><td class="num">₹${fmt(ledgerBalance('l_iigst'))}</td></tr>
          <tr style="font-weight:600;border-top:2px solid var(--ink);"><td>Total</td><td class="num">₹${fmt(gstOutputTotal())}</td><td class="num">₹${fmt(gstInputTotal())}</td></tr>
        </table>
        <div style="padding:12px 16px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end;gap:10px;align-items:center;">
          <span class="muted" style="font-size:12.5px;">Net GST ${netGST>=0?'Payable':'Refundable / Carried Forward'}</span>
          <span class="pill ${netGST>=0?'dr':'cr'}" style="font-size:13px;">₹${fmt(netGST)}</span>
        </div>
      </div>
    </div>

    <div class="section-title">Outward Supplies (Sales)</div>
    <div class="panel"><div class="panel-body" style="padding:0;">
      ${outward.length ? `<table>
        <tr><th>Date</th><th>Narration</th><th class="num">Taxable</th><th class="num">CGST</th><th class="num">SGST</th><th class="num">IGST</th><th class="num">Invoice Total</th></tr>
        ${outward.map(({v,g})=>{
          const invoice = voucherAmount(v);
          const taxable = invoice - g.totalTax;
          return `<tr><td class="muted">${v.date}</td><td>${v.narration||'—'}</td><td class="num">₹${fmt(taxable)}</td><td class="num">₹${fmt(g.cgst)}</td><td class="num">₹${fmt(g.sgst)}</td><td class="num">₹${fmt(g.igst)}</td><td class="num">₹${fmt(invoice)}</td></tr>`;
        }).join('')}
      </table>` : `<div class="empty">No GST sales vouchers recorded yet.</div>`}
    </div></div>

    <div class="section-title">Inward Supplies (Purchase)</div>
    <div class="panel"><div class="panel-body" style="padding:0;">
      ${inward.length ? `<table>
        <tr><th>Date</th><th>Narration</th><th class="num">Taxable</th><th class="num">CGST</th><th class="num">SGST</th><th class="num">IGST</th><th class="num">Invoice Total</th></tr>
        ${inward.map(({v,g})=>{
          const invoice = voucherAmount(v);
          const taxable = invoice - g.totalTax;
          return `<tr><td class="muted">${v.date}</td><td>${v.narration||'—'}</td><td class="num">₹${fmt(taxable)}</td><td class="num">₹${fmt(g.cgst)}</td><td class="num">₹${fmt(g.sgst)}</td><td class="num">₹${fmt(g.igst)}</td><td class="num">₹${fmt(invoice)}</td></tr>`;
        }).join('')}
      </table>` : `<div class="empty">No GST purchase vouchers recorded yet.</div>`}
    </div></div>
    <p class="muted" style="font-size:11.5px;">Note: only Sales/Purchase vouchers where GST was applied via the GST Calculator appear here. Use the Voucher tab to record a taxable sale or purchase.</p>

}

      };

      });

    document.querySelectorAll('[data-open-kpi]').forEach(el=>{
      el.addEventListener('click', ()=>{
        modal = KPI_MODALS[el.dataset.openKpi];
        render();
      });
    });
    renderDashboardCharts();
  }

    });

    document.getElementById('vnarr').addEventListener('input', e=> vform.narration = e.target.value);
    document.querySelectorAll('[data-mode]').forEach(b=>{
      b.addEventListener('click', ()=>{ vform.mode = b.dataset.mode; render(); });
    });
    document.getElementById('singleA')?.addEventListener('change', e=>{ vform.single.ledgerA = e.target.value; updateSingleEntryPreview(); });
    document.getElementById('singleB')?.addEventListener('change', e=>{ vform.single.ledgerB = e.target.value; updateSingleEntryPreview(); });
    document.getElementById('singleA')?.addEventListener('focus', ()=>{ quickLedgerFocus = {type:'single', which:'A'}; });
    document.getElementById('singleB')?.addEventListener('focus', ()=>{ quickLedgerFocus = {type:'single', which:'B'}; });
    document.getElementById('singleAmount')?.addEventListener('input', e=>{ vform.single.amount = e.target.value; updateSingleEntryPreview(); });
    document.getElementById('quickAddLedgerBtn')?.addEventListener('click', ()=>{
      const inSingleMode = !!document.getElementById('singleA');
      if(inSingleMode){
        if(!quickLedgerFocus || quickLedgerFocus.type!=='single'){
          quickLedgerFocus = { type:'single', which: vform.single.ledgerA ? 'B' : 'A' };
        }
      } else {
        if(!quickLedgerFocus || quickLedgerFocus.type!=='entry' || vform.entries[quickLedgerFocus.index]===undefined){
          let idx = vform.entries.findIndex(e=>!e.ledgerId);
          if(idx===-1){ vform.entries.push({ledgerId:'',dr:0,cr:0}); idx = vform.entries.length-1; }
          quickLedgerFocus = { type:'entry', index: idx };
        }
      }
      modal = 'quickAddLedger';
      render();
    });
    document.getElementById('addRow')?.addEventListener('click',()=>{
      vform.entries.push({ledgerId:'',dr:0,cr:0});
      render();
    });
    document.getElementById('resetVoucher').addEventListener('click',()=>{
      vform = null; render();
    });
    document.getElementById('printBillBtn')?.addEventListener('click', ()=>{ generateAndPrintBill(); });
    document.querySelectorAll('.e-ledger').forEach(s=>{
      s.addEventListener('change', e=>{ vform.entries[+e.target.dataset.i].ledgerId = e.target.value; });
      s.addEventListener('focus', e=>{ quickLedgerFocus = { type:'entry', index: +e.target.dataset.i }; });
    });
    document.querySelectorAll('.e-dr').forEach(s=>{
      s.addEventListener('input', e=>{
        const i = +e.target.dataset.i;
        vform.entries[i].dr = Number(e.target.value)||0;
        if(vform.entries[i].dr) vform.entries[i].cr = 0;
        renderTotalsOnly();
      });
    });
    document.querySelectorAll('.e-cr').forEach(s=>{
      s.addEventListener('input', e=>{
        const i = +e.target.dataset.i;
        vform.entries[i].cr = Number(e.target.value)||0;
        if(vform.entries[i].cr) vform.entries[i].dr = 0;
        renderTotalsOnly();
      });
    });
    document.querySelectorAll('[data-rm]').forEach(b=>{
      b.addEventListener('click', e=>{
        const i = +e.target.dataset.rm;
        if(vform.entries.length>2) vform.entries.splice(i,1);
        render();
      });
    });
    document.getElementById('gstParty')?.addEventListener('change', e=>{ vform.gst.party = e.target.value; });
    document.getElementById('gstTaxable')?.addEventListener('change', e=>{
      vform.gst.taxableLedger = e.target.value;
      const l = ledgerOf(e.target.value);
      if(l && l.gstRate!=null) vform.gst.rate = l.gstRate;
      render();
    });
    document.getElementById('addItemRow')?.addEventListener('click', ()=>{
      vform.gst.items = vform.gst.items || [];
      vform.gst.items.push({itemId:'__custom__', name:'', qty:1, rate:0});
      render();
    });
    document.querySelectorAll('.item-select').forEach(el=>{
      el.addEventListener('change', e=>{
        const i = +e.target.dataset.i;
        const val = e.target.value;
        vform.gst.items[i].itemId = val;
        if(val!=='__custom__'){
          const m = state.items.find(x=>x.id===val);
          if(m){
            vform.gst.items[i].name = m.name;
            if(m.rate!=null) vform.gst.items[i].rate = m.rate;
          }
        } else {
          vform.gst.items[i].name = '';
        }
        render();
      });
    });
    document.querySelectorAll('.item-name').forEach(el=>{
      el.addEventListener('input', e=>{ vform.gst.items[+e.target.dataset.i].name = e.target.value; });
    });
    document.querySelectorAll('.item-qty').forEach(el=>{
      el.addEventListener('input', e=>{ vform.gst.items[+e.target.dataset.i].qty = e.target.value; updateItemsTotals(); });
    });
    document.querySelectorAll('.item-rate').forEach(el=>{
      el.addEventListener('input', e=>{ vform.gst.items[+e.target.dataset.i].rate = e.target.value; updateItemsTotals(); });
    });
    document.querySelectorAll('[data-item-rm]').forEach(el=>{
      el.addEventListener('click', ()=>{
        vform.gst.items.splice(+el.dataset.itemRm,1);
        render();
      });
    });
    document.getElementById('gstRate')?.addEventListener('change', e=>{ vform.gst.rate = e.target.value; updateGSTPreview(); });
    document.getElementById('gstSupply')?.addEventListener('change', e=>{ vform.gst.supply = e.target.value; updateGSTPreview(); });
    document.getElementById('applyGST')?.addEventListener('click', ()=>{
      const g = vform.gst;
      const amt = itemsSubtotal(g.items);
      const rate = Number(g.rate)||0;
      if(!g.party || !g.taxableLedger || !amt){ toast('Fill party, ledger, and at least one item with qty & rate'); return; }
      const taxVal = amt*rate/100;
      const total = amt+taxVal;
      vform.entries = vform.entries.filter(e=> e.ledgerId || e.dr || e.cr);
      if(vform.type==='Sales'){
        vform.entries.push({ledgerId:g.party, dr:total, cr:0});
        vform.entries.push({ledgerId:g.taxableLedger, dr:0, cr:amt});
        if(g.supply==='intra' && taxVal>0){
          vform.entries.push({ledgerId:'l_ocgst', dr:0, cr:taxVal/2});
          vform.entries.push({ledgerId:'l_osgst', dr:0, cr:taxVal/2});
        } else if(taxVal>0){
          vform.entries.push({ledgerId:'l_oigst', dr:0, cr:taxVal});
        }
      } else if(vform.type==='Credit Note'){
        // Reverses a Sales entry — sales return
        vform.entries.push({ledgerId:g.taxableLedger, dr:amt, cr:0});
        if(g.supply==='intra' && taxVal>0){
          vform.entries.push({ledgerId:'l_ocgst', dr:taxVal/2, cr:0});
          vform.entries.push({ledgerId:'l_osgst', dr:taxVal/2, cr:0});
        } else if(taxVal>0){
          vform.entries.push({ledgerId:'l_oigst', dr:taxVal, cr:0});
        }
        vform.entries.push({ledgerId:g.party, dr:0, cr:total});
      } else if(vform.type==='Debit Note'){
        // Reverses a Purchase entry — purchase return
        vform.entries.push({ledgerId:g.party, dr:total, cr:0});
        vform.entries.push({ledgerId:g.taxableLedger, dr:0, cr:amt});
        if(g.supply==='intra' && taxVal>0){
          vform.entries.push({ledgerId:'l_icgst', dr:0, cr:taxVal/2});
          vform.entries.push({ledgerId:'l_isgst', dr:0, cr:taxVal/2});
        } else if(taxVal>0){
          vform.entries.push({ledgerId:'l_iigst', dr:0, cr:taxVal});
        }
      } else {
        // Purchase
        vform.entries.push({ledgerId:g.taxableLedger, dr:amt, cr:0});
        if(g.supply==='intra' && taxVal>0){
          vform.entries.push({ledgerId:'l_icgst', dr:taxVal/2, cr:0});
          vform.entries.push({ledgerId:'l_isgst', dr:taxVal/2, cr:0});
        } else if(taxVal>0){
          vform.entries.push({ledgerId:'l_iigst', dr:taxVal, cr:0});
        }
        vform.entries.push({ledgerId:g.party, dr:0, cr:total});
      }
      if(vform.entries.length<2) vform.entries.push({ledgerId:'',dr:0,cr:0},{ledgerId:'',dr:0,cr:0});
      vform.appliedItems = (g.items||[]).filter(it=>it.name && (Number(it.qty)||0)>0).map(it=>({itemId: (it.itemId && it.itemId!=='__custom__') ? it.itemId : null, name:it.name, qty:Number(it.qty)||0, rate:Number(it.rate)||0}));
      toast('GST entries added — review below and Save');
      render();
    });
    const saveBtn = document.getElementById('saveVoucher');
    if(saveBtn) saveBtn.addEventListener('click', async ()=>{
      const singleEligible = ['Payment','Receipt','Contra'].includes(vform.type);
      const effectiveMode = singleEligible ? vform.mode : 'double';
      let entries;
      if(effectiveMode==='single'){
        const s = vform.single;
        const amt = Number(s.amount)||0;
        if(!s.ledgerA || !s.ledgerB || !amt){ toast('Fill both ledgers and an amount'); return; }
        if(s.ledgerA===s.ledgerB){ toast('The two ledgers must be different'); return; }
        if(vform.type==='Payment') entries = [{ledgerId:s.ledgerB,dr:amt,cr:0},{ledgerId:s.ledgerA,dr:0,cr:amt}];
        else if(vform.type==='Receipt') entries = [{ledgerId:s.ledgerA,dr:amt,cr:0},{ledgerId:s.ledgerB,dr:0,cr:amt}];
        else entries = [{ledgerId:s.ledgerB,dr:amt,cr:0},{ledgerId:s.ledgerA,dr:0,cr:amt}];
      } else {
        entries = vform.entries.filter(e=>e.ledgerId && (e.dr||e.cr));
        if(entries.length<2){ toast('Add at least two ledger entries'); return; }
      }
      if(vform.id){
        const idx = state.vouchers.findIndex(v=>v.id===vform.id);
        if(idx>-1){
          const createdAt = state.vouchers[idx].createdAt || new Date().toISOString();
          state.vouchers[idx] = { id: vform.id, date: vform.date, type: vform.type, narration: vform.narration, entries, createdAt, updatedAt: new Date().toISOString() };
          if(vform.appliedItems && vform.appliedItems.length) state.vouchers[idx].items = vform.appliedItems;
        }
        await saveVouchers();
        toast('Voucher updated');
      } else {
        const now = new Date().toISOString();
        const v = { id: uid('v'), date: vform.date, type: vform.type, narration: vform.narration, entries, createdAt: now };
        if(vform.appliedItems && vform.appliedItems.length) v.items = vform.appliedItems;
        state.vouchers.push(v);
        await saveVouchers();
        toast('Voucher saved');
      }
      vform = null;
      view = 'daybook';
      render();
    });
  }

  if(view==='ledgers'){
    document.querySelectorAll('[data-select-ledger]').forEach(el=>{
      el.addEventListener('click',()=>{ window._selectedLedger = el.dataset.selectLedger; render(); });
    });
  }

  if(view==='calendar'){
    document.getElementById('calPrev')?.addEventListener('click', ()=>{
      calState.month--;
      if(calState.month<0){ calState.month=11; calState.year--; }
      render();
    });
    document.getElementById('calNext')?.addEventListener('click', ()=>{
      calState.month++;
      if(calState.month>11){ calState.month=0; calState.year++; }
      render();
    });
    document.getElementById('calToday')?.addEventListener('click', ()=>{
      const t = new Date();
      calState.year = t.getFullYear();
      calState.month = t.getMonth();
      calState.selected = t.toISOString().slice(0,10);
      render();
    });
    document.querySelectorAll('[data-cal-day]').forEach(el=>{
      el.addEventListener('click', ()=>{ calState.selected = el.dataset.calDay; render(); });
    });
    document.getElementById('calNewVoucher')?.addEventListener('click', ()=>{
      vform = { type:'Payment', date: calState.selected, narration:'', entries:[{ledgerId:'',dr:0,cr:0},{ledgerId:'',dr:0,cr:0}], gst:{party:'', taxableLedger:'', amount:'', rate:18, supply:'intra', items:[]} };
      view = 'voucher';
      render();
    });
  }

  if(modal==='quickAddLedger'){
    document.getElementById('quickAddLedgerSubmit')?.addEventListener('click', async ()=>{
      const name = document.getElementById('quickLedgerName').value.trim();
      const group = document.getElementById('quickLedgerGroup').value;
      const openingRaw = Number(document.getElementById('quickLedgerOpening').value)||0;
      const sign = Number(document.getElementById('quickLedgerType').value);
      const gstRaw = document.getElementById('quickLedgerGST').value;
      if(!name){ toast('Enter a ledger name'); return; }
      const ledger = { id: uid('l'), name, group, opening: openingRaw*sign };
      if(gstRaw !== '') ledger.gstRate = Number(gstRaw);
      state.ledgers.push(ledger);
      await saveLedgers();
      if(vform && quickLedgerFocus){
        if(quickLedgerFocus.type==='entry' && vform.entries[quickLedgerFocus.index]){
          vform.entries[quickLedgerFocus.index].ledgerId = ledger.id;
        } else if(quickLedgerFocus.type==='single'){
          if(quickLedgerFocus.which==='A') vform.single.ledgerA = ledger.id;
          else vform.single.ledgerB = ledger.id;
        }
      }
      quickLedgerFocus = null;
      modal = null;
      toast('Ledger added');
      render();
    });
  }

  if(view==='coa'){
    const addBtn = document.getElementById('addLedgerBtn');
    if(addBtn) addBtn.addEventListener('click', async ()=>{
      const name = document.getElementById('newLedgerName').value.trim();
      const group = document.getElementById('newLedgerGroup').value;
      const openingRaw = Number(document.getElementById('newLedgerOpening').value)||0;
      const sign = Number(document.getElementById('newLedgerType').value);
      const gstRaw = document.getElementById('newLedgerGST').value;
      if(!name){ toast('Enter a ledger name'); return; }
      const ledger = { id: uid('l'), name, group, opening: openingRaw*sign };
      if(gstRaw !== '') ledger.gstRate = Number(gstRaw);
      state.ledgers.push(ledger);
      await saveLedgers();
      toast('Ledger added');
      render();
    });
    attachStockItemFormHandlers();
    document.querySelectorAll('[data-delete-item]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const id = b.dataset.deleteItem;
        const it = state.items.find(x=>x.id===id);
        if(!it) return;
        const ok = window.confirm(`Delete item "${it.name}"?\n\nThis won't affect items already used on saved vouchers.`);
        if(!ok) return;
        state.items = state.items.filter(x=>x.id!==id);
        await saveItems();
        toast('Item deleted');
        render();
      });
    });
  }

  if(view==='inventory'){
    attachStockItemFormHandlers();
    document.querySelectorAll('[data-stock-detail]').forEach(el=>{
      el.addEventListener('click', ()=>{
        stockDetailItemId = el.dataset.stockDetail;
        modal = 'stockDetail';
        render();
      });
    });
    document.querySelectorAll('[data-stock-adjust]').forEach(el=>{
      el.addEventListener('click', ()=>{
        stockAdjustItemId = el.dataset.stockAdjust;
        modal = 'stockAdjust';
        render();
      });
    });
  }
  if(modal==='stockAdjust'){
    document.getElementById('saveStockAdjBtn')?.addEventListener('click', async ()=>{
      const qtyRaw = document.getElementById('stockAdjQty').value;
      const reason = document.getElementById('stockAdjReason').value.trim();
      const qty = Number(qtyRaw);
      if(!qtyRaw || qty===0 || isNaN(qty)){ toast('Enter a non-zero adjustment quantity'); return; }
      state.stockAdjustments.push({
        id: uid('adj'),
        itemId: stockAdjustItemId,
        date: new Date().toISOString().slice(0,10),
        qty,
        reason,
        createdAt: new Date().toISOString(),
      });
      await saveStockAdjustments();
      toast('Stock adjustment saved');
      modal = null;
      render();
    });
  }

  if(modal==='import' && importState){
    document.getElementById('downloadSampleTemplateBtn')?.addEventListener('click', ()=> downloadImportTemplate(true));
    document.getElementById('downloadEmptyTemplateBtn')?.addEventListener('click', ()=> downloadImportTemplate(false));
    const fileInput = document.getElementById('importFileInput');
    fileInput?.addEventListener('change', async (e)=>{
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      importState.error = '';
      try{
        const {headers, rows} = await parseImportFile(file);
        if(!headers.length){ importState.error = 'No data found in this file.'; render(); return; }
        importState.fileName = file.name;
        importState.headers = headers;
        importState.rows = rows;
        importState.dateCol = guessImportColumn(headers,'date');
        importState.descCol = guessImportColumn(headers,'desc');
        importState.debitCol = guessImportColumn(headers,'debit');
        importState.creditCol = guessImportColumn(headers,'credit');
        importState.amountCol = guessImportColumn(headers,'amount');
        importState.typeCol = guessImportColumn(headers,'type');
        importState.colMode = (importState.debitCol && importState.creditCol) ? 'split' : (importState.amountCol ? 'single' : 'split');
        render();
      }catch(err){
        importState.error = 'Could not read this file. Please check the format and try again.';
        render();
      }
    });
    document.getElementById('importChangeFileBtn')?.addEventListener('click', ()=>{
      importState.headers = []; importState.rows = []; importState.fileName = '';
      render();
    });
    document.getElementById('importPrimaryLedger')?.addEventListener('change', e=>{
      importState.primaryLedgerId = e.target.value;
      render();
    });
    document.getElementById('importNewPrimaryName')?.addEventListener('input', e=> importState.newPrimaryLedgerName = e.target.value);
    document.getElementById('importDateCol')?.addEventListener('change', e=> importState.dateCol = e.target.value);
    document.getElementById('importDescCol')?.addEventListener('change', e=> importState.descCol = e.target.value);
    document.getElementById('importColMode')?.addEventListener('change', e=>{ importState.colMode = e.target.value; render(); });
    document.getElementById('importDebitCol')?.addEventListener('change', e=> importState.debitCol = e.target.value);
    document.getElementById('importCreditCol')?.addEventListener('change', e=> importState.creditCol = e.target.value);
    document.getElementById('importAmountCol')?.addEventListener('change', e=> importState.amountCol = e.target.value);
    document.getElementById('importTypeCol')?.addEventListener('change', e=> importState.typeCol = e.target.value);

    document.getElementById('importContinueBtn')?.addEventListener('click', ()=>{
      if(!importState.primaryLedgerId){ toast('Select which ledger this statement is for'); return; }
      if(importState.primaryLedgerId==='__new__' && !(importState.newPrimaryLedgerName||'').trim()){ toast('Enter a name for the new ledger'); return; }
      if(!importState.dateCol){ toast('Select the date column'); return; }
      if(importState.colMode==='split' && (!importState.debitCol || !importState.creditCol)){ toast('Select both debit and credit columns'); return; }
      if(importState.colMode==='single' && !importState.amountCol){ toast('Select the amount column'); return; }
      const txns = importRowsToTransactions();
      if(!txns.length){ toast('No valid transactions found — check your column mapping'); return; }
      importState.transactions = txns;
      importState.groups = importBuildGroups(txns);
      importState.step = 2;
      render();
    });

    document.getElementById('importBackBtn')?.addEventListener('click', ()=>{
      importState.step = 1;
      render();
    });

    document.querySelectorAll('[data-group-ledger]').forEach(sel=>{
      sel.addEventListener('change', e=>{
        const i = +e.target.dataset.groupLedger;
        importState.groups[i].ledgerId = e.target.value === '__suspense__' ? '' : e.target.value;
      });
    });

    document.getElementById('importCommitBtn')?.addEventListener('click', commitImport);
  }

  if(view==='reports'){
    document.getElementById('exportExcelBtn')?.addEventListener('click', exportReportsToExcel);
    document.getElementById('exportTBBtn')?.addEventListener('click', exportTrialBalanceToExcel);
    document.getElementById('exportPLBtn')?.addEventListener('click', exportPLToExcel);
    document.getElementById('exportBSBtn')?.addEventListener('click', exportBalanceSheetToExcel);
    document.getElementById('exportRatiosBtn')?.addEventListener('click', exportRatiosToExcel);
    document.getElementById('exportCFBtn')?.addEventListener('click', exportCashFlowToExcel);
    document.querySelectorAll('[data-open-report]').forEach(el=>{
      el.addEventListener('click', ()=>{
        reportsSelected = el.dataset.openReport;
        render();
      });
    });
    document.getElementById('reportsBackBtn')?.addEventListener('click', ()=>{
      reportsSelected = null;
      render();
    });
    document.querySelectorAll('[data-is-detail]').forEach(el=>{
      el.addEventListener('click', ()=>{
        isDetailCategory = el.dataset.isDetail;
        modal = 'isDetail';
        render();
      });
    });
    document.querySelectorAll('[data-ledger-detail]').forEach(el=>{
      el.addEventListener('click', ()=>{
        ledgerDetailId = el.dataset.ledgerDetail;
        modal = 'ledgerDetail';
        render();
      });
    });
  }

  if(view==='gst'){
    document.getElementById('downloadGSTBtn')?.addEventListener('click', downloadGSTStatement);
  }
}

function updateGSTPreview(){
  const el = document.getElementById('gstPreviewBox');
  if(el) el.outerHTML = gstPreview(vform.gst);
}
function updateItemsTotals(){
  document.querySelectorAll('#gstItemRows .item-amount').forEach((el,i)=>{
    const it = vform.gst.items[i];
    if(it) el.value = '₹'+fmt((Number(it.qty)||0)*(Number(it.rate)||0));
  });
  const totalEl = document.getElementById('gstItemsTotal');
  if(totalEl) totalEl.textContent = '₹'+fmt(itemsSubtotal(vform.gst.items));
  updateGSTPreview();
}

// Re-render just the totals line without losing input focus while typing amounts
function updateSingleEntryPreview(){
  const el = document.getElementById('singlePreview');
  if(el) el.textContent = singleEntryPreviewText();
  const s = vform.single;
  const amt = Number(s.amount)||0;
  const ok = !!(s.ledgerA && s.ledgerB && amt>0 && s.ledgerA!==s.ledgerB);
  const saveBtn = document.getElementById('saveVoucher');
  if(saveBtn) saveBtn.disabled = !ok;
}

function renderTotalsOnly(){
  const dr = vform.entries.reduce((s,e)=>s+(Number(e.dr)||0),0);
  const cr = vform.entries.reduce((s,e)=>s+(Number(e.cr)||0),0);
  const balanced = Math.abs(dr-cr) < 0.005 && dr > 0;
  const el = document.querySelector('.totals-line');
  if(el){
    el.className = 'totals-line ' + (balanced?'balanced':'unbalanced');
    el.innerHTML = `<span>Dr ₹${fmt(dr)}</span><span>Cr ₹${fmt(cr)}</span><span>${balanced?'Balanced ✓':'Not balanced'}</span>`;
  }
  const saveBtn = document.getElementById('saveVoucher');
  if(saveBtn) saveBtn.disabled = !balanced;
}

/* ---------------- init ----------------
   Companies and accounts now live in Firestore, which requires a signed-in user — so nothing is
   fetched here. The app always starts at the login screen (matching how it always worked, even
   before real accounts existed); ensureDemoCompany()/loadCompanies() run right after a successful
   login or admin login instead, once there's a Firebase Auth session to read/write with. */
(async function init(){
  try{ const n = await window.storage.get('lastUsername'); lastUsername = n ? n.value : ''; }catch(e){ lastUsername = ''; }
  authMode = 'login';
  screen = 'login';
  renderLogin();
  try{
    const rootSnap = { isRoot:true, screen:'login', view:null, authMode, companyId:null };
    history.replaceState(rootSnap, '', location.href);
    history.pushState(rootSnap, '', location.href);
  }catch(e){}
})();
</script>
